<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TODO</title>
<style>
:root{
  --bg:#f1f3f9;--bg2:#fff;--card:#fff;--card2:#f1f3f9;--fg:#171c2b;--mut:#6b7488;--mut2:#aab1c2;--line:#e2e6f0;
  --ac:#5b6cf0;--ac2:#a05cf0;--ok:#2fb872;--shadow:0 1px 2px #1a204012,0 6px 18px #1a204010;
  --glass:#f1f3f9d9;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1016;--bg2:#161a23;--card:#161a23;--card2:#212736;--fg:#eef1f7;--mut:#8d96aa;--mut2:#4b5468;--line:#272d3c;
  --ac:#7f8dff;--ac2:#b76cff;--ok:#3ecf86;--shadow:0 1px 2px #0006,0 8px 24px #0004;--glass:#0d1016d9;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;font-size:16px;color:inherit}

/* Header */
header{position:sticky;top:0;z-index:10;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd h1{margin:0;font-size:22px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hd .sub{color:var(--mut);font-size:13px;margin-top:1px}
.hd .grow{flex:1;min-width:0}
.ring{--p:0;--c:var(--ac);width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;font-size:12px;font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card2);font-size:20px;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:scale(.94)}

main{max-width:720px;margin:0 auto;padding:14px 12px}
ul{list-style:none;margin:0;padding:0}

/* Cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;padding:4px 6px 6px;overflow:hidden}
li>ul{margin:0 0 2px 12px;padding-left:6px;border-left:2px solid var(--line)}
.row{display:flex;align-items:flex-start;padding:3px 0 3px 0}
.tg{width:24px;height:38px;color:var(--mut);font-size:22px;line-height:38px;transition:transform .15s;flex:none;text-align:center}
.tg.open{transform:rotate(90deg)}
.tg.sp{visibility:hidden}

/* Case ronde */
.cb{width:38px;height:38px;position:relative;flex:none}
.cb::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--mut2);transition:all .15s}
.cb.on::before{background:var(--ok);border-color:var(--ok)}
.cb.on::after{content:"";position:absolute;left:16px;top:11px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);animation:pop .2s}
.cb.part::before{border-color:var(--ac)}
.cb.part::after{content:"";position:absolute;left:13px;top:18px;width:12px;height:2.5px;background:var(--ac);border-radius:2px}
@keyframes pop{from{transform:rotate(45deg) scale(.3)}to{transform:rotate(45deg) scale(1)}}

.body{flex:1;min-width:0;padding:8px 6px 6px 4px;cursor:pointer;border-radius:10px}
.line1{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.title{font-weight:550;word-break:break-word;line-height:22px}
.title.done{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1.5px}
.pct{display:inline-flex;align-items:baseline;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:18px;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.pct small{font-weight:500;opacity:.75;font-size:11px}
.desc{color:var(--mut);font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--c);transition:width .25s}

/* Actions */
.actions{display:flex;flex-wrap:wrap;gap:6px;margin:2px 4px 8px 38px}
.actions button{background:var(--card2);border-radius:999px;padding:8px 13px;font-size:14px;display:flex;gap:6px;align-items:center}
.actions button:active{transform:scale(.96)}
.actions .danger{color:#ef5b5b}

/* Formulaires */
.edit,.add{display:grid;gap:8px;margin:6px 4px 8px}
.edit{margin-left:10px}
.edit .btns{display:flex;gap:8px}
input[type=text],textarea{width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:64px}
textarea[hidden]{display:none}
.btn{background:var(--card2);border-radius:12px;padding:10px 16px;font-weight:550}
.btn.primary,.go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.line{display:flex;gap:8px;align-items:center}
.add .icon{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:20px;flex:none;color:var(--mut)}
.go{width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1;flex:none;box-shadow:0 4px 12px #5b6cf055}
.go:active{transform:scale(.92)}
.add.sub{padding:4px 0 2px 10px}

/* Barre de saisie fixe */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:18px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent)}
.composer .add{max-width:720px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column-reverse}

.empty{text-align:center;color:var(--mut);padding:56px 20px}
.empty b{display:block;font-size:44px;margin-bottom:6px}

/* Feuilles (menu / import) */
dialog.sheet{border:0;padding:0;background:var(--bg2);color:var(--fg);width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px #0006}
dialog.sheet::backdrop{background:#0009}
dialog.sheet .inner{padding:8px 14px calc(16px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--mut2);margin:6px auto 10px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 8px;border-radius:12px;font-size:16px}
.item:active{background:var(--card2)}
.item .ic{width:28px;text-align:center;font-size:20px}
.item .sw{margin-left:auto;font-size:13px;color:var(--mut)}
.sheet h2{margin:4px 8px 8px;font-size:17px}
.sheet p{margin:0 8px 10px;color:var(--mut);font-size:13.5px}
.sheet textarea{height:34vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
.sheet .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:flex-end;align-items:center}
.sheet input[type=file]{font-size:14px;flex:1;min-width:0;color:var(--mut)}
@media(min-width:700px){dialog.sheet{margin:auto;border-radius:22px}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="grow"><h1>TODO</h1><div class="sub" id="sub"></div></div>
    <div class="ring" id="ring" hidden><span id="ringTxt"></span></div>
    <button class="iconbtn" id="btnMenu" aria-label="Menu">⋯</button>
  </div>
</header>

<main><div id="tree"></div></main>

<div class="composer" id="composer"></div>

<dialog class="sheet" id="menuDlg"><div class="inner">
  <div class="grab"></div>
  <button class="item" data-act="hide"><span class="ic">👁</span>Masquer les faits<span class="sw" id="hideSw"></span></button>
  <button class="item" data-act="collapse"><span class="ic">⊟</span>Tout replier</button>
  <button class="item" data-act="expand"><span class="ic">⊞</span>Tout déplier</button>
  <button class="item" data-act="import"><span class="ic">⬆</span>Importer…</button>
  <button class="item" data-act="json"><span class="ic">⬇</span>Exporter en JSON</button>
  <button class="item" data-act="txt"><span class="ic">📄</span>Exporter en texte</button>
</div></dialog>

<dialog class="sheet" id="impDlg"><div class="inner">
  <div class="grab"></div>
  <h2>Importer</h2>
  <p>Colle du JSON (export de cette page) ou une liste indentée : <code>*</code> <code>+</code> <code>-</code>, <code>[x]</code> = fait, une ligne sans puce plus indentée = description.</p>
  <textarea id="impText" placeholder="Colle ici…"></textarea>
  <div class="btns">
    <input type="file" id="impFile" accept=".json,.txt,.md,text/*,application/json">
    <button class="btn" data-act="impcancel">Annuler</button>
    <button class="btn" data-act="impappend">Ajouter</button>
    <button class="btn primary" data-act="impreplace">Remplacer tout</button>
  </div>
</div></dialog>

<script>
const KEY = 'todo-tree-v1', UIKEY = 'todo-tree-ui';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function normalize(arr) {
  return (Array.isArray(arr) ? arr : []).map(n => ({
    id: uid(),
    title: String(n.title ?? '').trim() || '(sans titre)',
    desc: String(n.desc ?? n.description ?? ''),
    done: !!n.done,
    collapsed: !!n.collapsed,
    children: normalize(n.children)
  }));
}
function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); return normalize(d && d.nodes); } catch { return []; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ version: 1, nodes })); }
  catch (e) { alert('Sauvegarde impossible : ' + e.message); }
}
let nodes = load();
let hideDone = false;
try { hideDone = !!JSON.parse(localStorage.getItem(UIKEY)).hideDone; } catch {}
const ui = { adding: null, editing: null, menu: null, addDesc: false };

function find(id, list = nodes) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { list, i, node: list[i] };
    const r = find(id, list[i].children);
    if (r) return r;
  }
  return null;
}
// Taux d'achèvement : feuilles faites / feuilles totales (tous les descendants)
function stats(n) {
  if (!n.children.length) return { done: n.done ? 1 : 0, total: 1 };
  let d = 0, t = 0;
  for (const c of n.children) { const s = stats(c); d += s.done; t += s.total; }
  return { done: d, total: t };
}
function setDone(n, v) { n.done = v; n.children.forEach(c => setDone(c, v)); }
const color = pct => `hsl(${Math.round(pct * 1.2)},72%,52%)`; // rouge → vert

function addFormHTML(id, showDesc, sub) {
  return `<form class="add ${sub ? 'sub' : ''}" data-for="${id}">
    <div class="line">
      <input type="text" class="a-title" placeholder="${sub ? 'Sous-todo…' : 'Nouveau todo…'}" autocomplete="off" enterkeyhint="done">
      <button type="button" class="icon" data-act="adddesc" aria-label="Description">≡</button>
      ${sub ? '<button type="button" class="icon" data-act="canceladd" aria-label="Fermer">✕</button>' : ''}
      <button type="submit" class="go" aria-label="Ajouter">＋</button>
    </div>
    <textarea class="a-desc" rows="2" placeholder="Description (facultatif)" ${showDesc ? '' : 'hidden'}></textarea>
  </form>`;
}

function nodeHTML(n, top) {
  const s = stats(n), has = n.children.length > 0;
  const pct = Math.round(s.done / s.total * 100);
  const all = s.done === s.total, part = has && !all && s.done > 0;
  if (hideDone && all) return '';
  const c = color(pct);

  let h = `<li data-id="${n.id}"${top ? ' class="card"' : ''}>`;
  if (ui.editing === n.id) {
    h += `<form class="edit" data-id="${n.id}">
      <input type="text" class="e-title" value="${esc(n.title)}" autocomplete="off">
      <textarea class="e-desc" rows="3" placeholder="Description (facultatif)">${esc(n.desc)}</textarea>
      <div class="btns"><button type="submit" class="btn primary">Enregistrer</button><button type="button" class="btn" data-act="cancel">Annuler</button></div>
    </form>`;
  } else {
    h += `<div class="row">
      <button class="tg ${has ? '' : 'sp'} ${n.collapsed ? '' : 'open'}" data-act="toggle" aria-label="Replier / déplier">›</button>
      <button class="cb ${all ? 'on' : part ? 'part' : ''}" data-act="check" aria-label="Fait"></button>
      <div class="body" data-act="menu">
        <div class="line1"><span class="title ${all ? 'done' : ''}" data-dbl="1">${esc(n.title)}</span>${has ? `<span class="pct" style="--c:${c}">${pct}%<small>${s.done}/${s.total}</small></span>` : ''}</div>
        ${n.desc ? `<div class="desc">${esc(n.desc)}</div>` : ''}
        ${has ? `<div class="bar" style="--c:${c}"><i style="width:${pct}%"></i></div>` : ''}
      </div>
    </div>`;
    if (ui.menu === n.id) {
      h += `<div class="actions">
        <button data-act="add">＋ Sous-todo</button>
        <button data-act="edit">✎ Modifier</button>
        <button data-act="up">↑</button><button data-act="down">↓</button>
        <button data-act="del" class="danger">✕ Supprimer</button>
      </div>`;
    }
  }
  if (has && !n.collapsed) h += `<ul>${n.children.map(x => nodeHTML(x, false)).join('')}</ul>`;
  if (ui.adding === n.id) h += addFormHTML(n.id, ui.addDesc, true);
  return h + '</li>';
}

function render() {
  const tree = $('#tree');
  const visible = nodes.map(n => nodeHTML(n, true)).join('');
  tree.innerHTML = nodes.length
    ? (visible ? `<ul>${visible}</ul>` : `<div class="empty"><b>✅</b>Tout est fait !</div>`)
    : `<div class="empty"><b>📝</b>Rien à faire pour l'instant.<br>Ajoute un todo en bas, ou importe une liste.</div>`;

  const ring = $('#ring');
  if (nodes.length) {
    const s = stats({ children: nodes, done: false });
    const pct = Math.round(s.done / s.total * 100);
    ring.hidden = false;
    ring.style.setProperty('--p', pct); ring.style.setProperty('--c', color(pct));
    $('#ringTxt').textContent = pct + '%';
    $('#sub').textContent = `${s.done} / ${s.total} faits`;
  } else { ring.hidden = true; $('#sub').textContent = 'Liste vide'; }

  if (ui.editing) { const e = tree.querySelector('.e-title'); if (e) { e.focus(); e.select(); } }
  else if (ui.adding) { const a = tree.querySelector('.a-title'); if (a) { a.focus(); a.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
}
function commit() { save(); render(); }

// ---- Composer (nouveau todo racine)
$('#composer').innerHTML = addFormHTML('root', false, false);

// ---- Clics
document.addEventListener('click', e => {
  if (e.target.tagName === 'DIALOG') return e.target.close(); // clic sur le fond
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;

  // Actions globales (menu, import, formulaires)
  switch (act) {
    case 'hide': hideDone = !hideDone; try { localStorage.setItem(UIKEY, JSON.stringify({ hideDone })); } catch {} syncMenu(); return render();
    case 'collapse': setCollapsed(nodes, true); $('#menuDlg').close(); return commit();
    case 'expand': setCollapsed(nodes, false); $('#menuDlg').close(); return commit();
    case 'import': $('#menuDlg').close(); $('#impText').value = ''; $('#impFile').value = ''; $('#impDlg').showModal(); return;
    case 'json': $('#menuDlg').close(); return download(`todo-${day()}.json`, JSON.stringify({ version: 1, nodes: strip(nodes) }, null, 2), 'application/json');
    case 'txt': $('#menuDlg').close(); return download(`todo-${day()}.txt`, toText(nodes), 'text/plain');
    case 'impcancel': return $('#impDlg').close();
    case 'impreplace': return doImport(true);
    case 'impappend': return doImport(false);
    case 'cancel': ui.editing = null; return render();
    case 'canceladd': ui.adding = null; return render();
    case 'adddesc': {
      const f = b.closest('form'), ta = f.querySelector('.a-desc');
      ta.hidden = !ta.hidden;
      if (f.dataset.for !== 'root') ui.addDesc = !ta.hidden;
      return (ta.hidden ? f.querySelector('.a-title') : ta).focus();
    }
  }

  // Actions sur un todo
  const li = b.closest('li[data-id]');
  const r = li && find(li.dataset.id);
  if (!r) return;
  const n = r.node;
  switch (act) {
    case 'toggle': n.collapsed = !n.collapsed; return commit();
    case 'check': { const s = stats(n); setDone(n, s.done !== s.total); return commit(); }
    case 'menu': ui.menu = ui.menu === n.id ? null : n.id; return render();
    case 'add': n.collapsed = false; ui.adding = n.id; ui.editing = null; ui.menu = null; return commit();
    case 'edit': ui.editing = n.id; ui.adding = null; ui.menu = null; return render();
    case 'up': if (r.i > 0) [r.list[r.i - 1], r.list[r.i]] = [r.list[r.i], r.list[r.i - 1]]; return commit();
    case 'down': if (r.i < r.list.length - 1) [r.list[r.i + 1], r.list[r.i]] = [r.list[r.i], r.list[r.i + 1]]; return commit();
    case 'del': {
      const cnt = stats(n).total;
      if (n.children.length && !confirm(`Supprimer « ${n.title} » et ses ${cnt} sous-todo(s) ?`)) return;
      r.list.splice(r.i, 1);
      if (ui.adding === n.id) ui.adding = null;
      ui.menu = null;
      return commit();
    }
  }
});
document.addEventListener('dblclick', e => {
  const t = e.target.closest('[data-dbl]');
  const li = t && t.closest('li[data-id]');
  if (!li) return;
  ui.editing = li.dataset.id; ui.adding = null; ui.menu = null; render();
});
$('#btnMenu').onclick = () => { syncMenu(); $('#menuDlg').showModal(); };
function syncMenu() { $('#hideSw').textContent = hideDone ? 'activé' : 'désactivé'; }
function setCollapsed(list, v) { list.forEach(n => { n.collapsed = v; setCollapsed(n.children, v); }); }

// ---- Formulaires
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.classList.contains('edit')) {
    const r = find(f.dataset.id);
    if (r) {
      const t = f.querySelector('.e-title').value.trim();
      if (t) r.node.title = t;
      r.node.desc = f.querySelector('.e-desc').value.trim();
    }
    ui.editing = null; return commit();
  }
  if (f.classList.contains('add')) {
    const ti = f.querySelector('.a-title'), ta = f.querySelector('.a-desc');
    const title = ti.value.trim();
    if (!title) { ti.focus(); return; }
    const node = { id: uid(), title, desc: ta.value.trim(), done: false, collapsed: false, children: [] };
    if (f.dataset.for === 'root') {
      nodes.push(node);
      ti.value = ''; ta.value = ''; ta.hidden = true;
      commit(); ti.focus();
      requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
    } else {
      const r = find(f.dataset.for);
      if (r) { r.node.children.push(node); r.node.collapsed = false; }
      commit(); // le formulaire reste ouvert pour enchaîner
    }
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('.a-title')) {
    const f = t.closest('form');
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      const ta = f.querySelector('.a-desc'); ta.hidden = false;
      if (f.dataset.for !== 'root') ui.addDesc = true;
      ta.focus();
    } else if (e.key === 'Escape') {
      if (f.dataset.for === 'root') t.blur(); else { ui.adding = null; render(); }
    }
  } else if (t.matches('.a-desc')) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); t.closest('form').requestSubmit(); }
    else if (e.key === 'Escape') {
      const f = t.closest('form');
      if (f.dataset.for === 'root') { t.hidden = true; f.querySelector('.a-title').focus(); } else { ui.adding = null; render(); }
    }
  } else if (t.closest('form.edit')) {
    if (e.key === 'Escape') { ui.editing = null; render(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && t.matches('.e-desc')) { e.preventDefault(); t.closest('form').requestSubmit(); }
  }
});

// ---- Export
function strip(list) {
  return list.map(n => {
    const o = { title: n.title };
    if (n.desc) o.desc = n.desc;
    if (n.children.length) o.children = strip(n.children);
    else if (n.done) o.done = true;
    return o;
  });
}
function toText(list, d = 0) {
  const bullets = ['*', '+', '-'], ind = '  '.repeat(d);
  return list.map(n => {
    let s = `${ind}${bullets[d % 3]} ${!n.children.length && n.done ? '[x] ' : ''}${n.title}\n`;
    if (n.desc) s += n.desc.split('\n').map(l => `${ind}    > ${l}\n`).join('');
    return s + toText(n.children, d + 1);
  }).join('');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const day = () => new Date().toISOString().slice(0, 10);

// ---- Import
function parseText(t) {
  const root = [], stack = []; let last = null;
  for (const raw of t.replace(/\t/g, '    ').split(/\r?\n/)) {
    if (!raw.trim()) continue;
    const m = raw.match(/^(\s*)([*+\-•]\s+)?(?:\[([ xX])\]\s*)?(.*)$/);
    const indent = m[1].length, bullet = !!m[2], text = m[4].trim();
    if (!bullet && last && (indent > last.indent || text.startsWith('>'))) {
      last.node.desc += (last.node.desc ? '\n' : '') + text.replace(/^>\s?/, '');
      continue;
    }
    const node = { title: text, desc: '', done: !!m[3] && m[3].toLowerCase() === 'x', children: [] };
    while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
    (stack.length ? stack[stack.length - 1].node.children : root).push(node);
    stack.push({ indent, node });
    last = { indent, node };
  }
  return normalize(root);
}
function parseImport(txt) {
  const t = txt.trim();
  if (!t) throw new Error('Rien à importer.');
  if (t[0] === '{' || t[0] === '[') {
    const d = JSON.parse(t), arr = Array.isArray(d) ? d : d.nodes;
    if (!Array.isArray(arr)) throw new Error('JSON sans liste "nodes".');
    return normalize(arr);
  }
  return parseText(t);
}
$('#impFile').onchange = async e => { const f = e.target.files[0]; if (f) $('#impText').value = await f.text(); };
function doImport(replace) {
  try {
    const items = parseImport($('#impText').value);
    if (replace) {
      if (nodes.length && !confirm('Remplacer tous les todos actuels ?')) return;
      nodes = items;
    } else nodes.push(...items);
    ui.adding = ui.editing = ui.menu = null;
    $('#impDlg').close(); commit();
  } catch (err) { alert('Import impossible : ' + err.message); }
}
