<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ProtoBoardDesigner</title>
<meta name="description" content="Plan de câblage sur plaque à pastilles au pas de 2,54 mm : cartes ESP32, modules, barrettes Dupont et fils.">
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/svg+xml" href="icons/protoboard_designer.svg">

<script>
/* Registre des composants : chaque fichier de protoboard/components/ appelle ProtoBoard.component({…}).
   Défini avant les fichiers de composants, qui sont chargés en fin de page. */
window.ProtoBoard = { list: [], component(def) { this.list.push(def); } };
</script>
<style>
/* ProtoBoardDesigner — styles propres à l'outil.
   Composants du système : .topbar, .appicon, .brand, .iconbtn, .btn, .chips, .chip, dialog.sheet, .item, .toast.
   Les couleurs de la plaque, des broches et des fils représentent des objets réels : elles sont fixes,
   sauf la plaque (assombrie en thème sombre) et les repères de sélection (accent du thème). */
:root { --pb-under:#e2c486; --pb-board:#f3e3bd; --pb-board-edge:#c9a96a; --pb-pad:#dca866; --pb-pad-edge:#b07a35; --pb-hole:#5a4630; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --pb-under:#9a8458; --pb-board:#b9a47a; --pb-board-edge:#8a7448; --pb-pad:#c08a45; --pb-pad-edge:#8a5a22; --pb-hole:#2b2016; } }
:root[data-theme="dark"] { --pb-under:#9a8458; --pb-board:#b9a47a; --pb-board-edge:#8a7448; --pb-pad:#c08a45; --pb-pad-edge:#8a5a22; --pb-hole:#2b2016; }

/* La page occupe exactement la zone visible : position fixe plutôt que 100dvh, qui sur certains
   navigateurs mobiles (Android en plein écran, barre d'adresse dynamique) déborde sous le bas de l'écran
   et cachait la barre des modes. */
html, body { height:100%; }
body { position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none; }
.topbar, .dock { flex:none; }
.topbar-in { max-width:none; gap:8px; }
.topbar-in .iconbtn { --icon-size:38px; }
#subtitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:480px) { .topbar-in .appicon { display:none; } .topbar .subtitle { font-size:12px; } .brand { font-size:17px; } .topbar-in .iconbtn { --icon-size:34px; font-size:18px; } }

.stage { position:relative; flex:1; min-height:0; }
#svg { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.pb-line { stroke:var(--line); }
.pb-dot { fill:var(--mut2); }
.pb-board { fill:var(--pb-board); stroke:var(--pb-board-edge); }
#svg.under .pb-board { fill:var(--pb-under); }
.pb-half { fill:var(--ac); opacity:.55; }
.pb-copper { fill:var(--pb-pad); stroke:var(--pb-pad-edge); }
.sidepill { white-space:nowrap; position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:3; padding:5px 14px; border-radius:99px; font-size:12.5px; font-weight:750;
  background:var(--ac); color:#fff; box-shadow:0 2px 10px #0004; border:0; cursor:pointer; }
.sidepill[hidden] { display:none; }
.pb-pad { fill:var(--pb-pad); stroke:var(--pb-pad-edge); }
.pb-hole { fill:var(--pb-hole); }
.pb-sel { stroke:var(--ac); }
.pb-glow { stroke:var(--ac); stroke-opacity:.35; }
.pb-ring { fill:none; stroke:var(--ac); }
.pb-ring.here { fill:color-mix(in srgb,var(--ac) 22%,transparent); }
.pb-out { fill:var(--fg); stroke:var(--bg); stroke-width:2.5px; paint-order:stroke; }
.pb-in { fill:#fff; fill-opacity:.92; }
.pb-title { fill:#fff; fill-opacity:.55; }

.dock { position:relative; z-index:5; background:var(--glass); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-top:1px solid var(--line); padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px)); }
.dock-in { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.ctx { display:flex; flex-direction:column; gap:8px; }
.ctx:empty { display:none; }
.ctx .info { font-size:13.5px; color:var(--mut); }
.ctx .info b { color:var(--fg); }
.ctx .warn { font-size:13.5px; font-weight:700; color:var(--err); }
.rowb { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.rowb .btn { padding:8px 13px; }
.mainrow { display:flex; align-items:center; gap:8px; }
.mainrow .chips { flex:1; }
.mainrow .chip { flex:1; text-align:center; padding:9px 12px; }
@media (max-width:400px) { .mainrow { gap:6px; } .mainrow .chip { padding:9px 6px; white-space:nowrap; } .mainrow .btn { padding-left:12px; padding-right:12px; } }
.swatch { width:32px; height:32px; border-radius:50%; border:2px solid var(--card); box-shadow:0 0 0 1px var(--mut2); flex:none; transition:transform .2s var(--spring); }
.swatch.on { box-shadow:0 0 0 3px var(--ac); }
.swatch:active { transform:scale(.9); }

/* Feuilles */
.sheet .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:0 4px; }
.sheet .grid .btn { justify-content:flex-start; flex-direction:column; align-items:flex-start; gap:1px; white-space:normal; text-align:left; min-height:58px; }
.sheet .grid small { font-weight:500; color:var(--mut); font-size:12px; }
.sheet h3 { margin:16px 8px 6px; font-size:14px; font-weight:750; }
.sheet .form { margin:0 4px; }
.sheet label.lbl { display:block; font-size:13px; font-weight:600; color:var(--mut); margin:8px 0 4px; }
.sheet .three { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.sheet textarea { font:12.5px/1.45 var(--f-mono); min-height:120px; }
.sheet .net { padding:8px; border-bottom:1px solid var(--line); font-size:14px; }
.sheet .net b { font-weight:700; }
.sheet .warn { color:var(--err); font-weight:700; font-size:13px; }
.sheet .help p { color:var(--fg); font-size:14px; }
.sheet .lib { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--line); }
.sheet .lib .grow { flex:1; min-width:0; }
.sheet .lib small { display:block; color:var(--mut); }
.inner { max-height:84dvh; overflow-y:auto; }
.legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--mut); margin:14px 8px 0; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
</style>
</head>

<script>
'use strict';
/* ==========================================================================
   ProtoBoardDesigner
   Coordonnées : unités de grille (1 = 2,54 mm), dessinées à U pixels par pas.
   Plan (doc) : { board:{w,h,show}, parts:[…], wires:[{id,c,pts:[[x,y]…], iso?:true}] }
   Les points de fil peuvent être au demi-pas (x.5) pour passer entre deux pastilles ; iso = fil isolé (gaine).
   Vue de dessous : miroir horizontal autour de l'axe de la plaque ; les coordonnées du plan ne changent pas.
   Pièce : { id, type, x, y, r (quarts de tour), f (retournée), label, names[], n, rows, gap }
   ========================================================================== */
const U = 20;
const KEY_DOC = 'protoboard.doc.v1', KEY_VIEW = 'protoboard.view.v1', KEY_LIB = 'protoboard.components.v1', KEY_CIRC = 'protoboard.circuits.v1', KEY_CUR = 'protoboard.current.v1';
/* Synchronisation facultative avec un serveur PocketBase (docs/SYNCHRO.md). localStorage reste la source locale :
   protoboard.doc.v1 (plan en cours), protoboard.components.v1 (Mes composants), protoboard.circuit.<id> (un circuit
   par clé). La vue et le circuit ouvert restent propres à chaque appareil. */
const CIRC_PREFIX = 'protoboard.circuit.';
const store = new PBStore({app:'protoboard', prefix:'protoboard.'});
const $ = s => document.querySelector(s);
const svg = $('#svg'), vp = $('#vp'), mir = $('#mir'), world = $('#world'), paper = $('#paper'), paperHalf = $('#paperHalf');
const COLORS = ['#e53935','#212121','#1e88e5','#43a047','#fdd835','#fb8c00','#8e24aa','#f5f5f5'];
const TYPES = {
  power:{f:'#e53935',t:'Alimentation'}, gnd:{f:'#1a1a1a',t:'Masse'}, gpio:{f:'#d4a72c',t:'Signal / GPIO'},
  strap:{f:'#fb8c00',t:'Strapping (démarrage)'}, uart:{f:'#1e88e5',t:'UART'}, avoid:{f:'#8e24aa',t:'À éviter'},
  ctrl:{f:'#9e9e9e',t:'Contrôle'}
};
const POWER_NOTE = {'5V':'Alim 5 V (USB) — entrée ou sortie', '3V3':'Sortie 3,3 V du régulateur', 'GND':'Masse'};
const BUILTIN = {
  hdrM:{name:'Barrette mâle', label:'Mâle'},
  hdrF:{name:'Barrette femelle', label:'Femelle'},
  mod:{name:'Module générique', label:'Module'},
  axial:{name:'Pièce à 2 pattes', label:'R'}
};
/* Pièces à deux pattes, écart réglable : kind -> nom, étiquette, broches, couleur du corps. */
const AXIAL = {
  res:{name:'Résistance', label:'R', pins:['1','2'], fill:'#d9b98a', band:'#8a4b1c', sp:4},
  diode:{name:'Diode', label:'D', pins:['A','K'], fill:'#1c1c1c', band:'#d8d8d8', sp:4},
  cap:{name:'Condensateur céramique', label:'C', pins:['1','2'], fill:'#e0a030', sp:2},
  elec:{name:'Condensateur chimique', label:'C', pins:['+','-'], fill:'#1d3557', band:'#c9d1db', sp:2},
  led:{name:'LED', label:'LED', pins:['A','K'], fill:'#e5484d', sp:2}
};

/* ---------- utilitaires ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clampInt = (v,a,b) => { v = parseInt(v, 10); if (isNaN(v)) v = a; return Math.max(a, Math.min(b, v)); };
const K = (x,y) => x + ',' + y;
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'composant';
let toastTimer;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, err ? 6000 : 3000);
}
function download(name, txt, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type})); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast('Copié dans le presse-papiers.'); }
  catch(e){ toast('Copie impossible : sélectionne le texte à la main.', true); }
}

/* ---------- bibliothèque de composants ---------- */
const LIB = new Map();   // id → { def, src:'file'|'local', geo }
function pinType(name, t){
  if (t && TYPES[t]) return t;
  const n = String(name).trim().toUpperCase();
  if (/^(GND|VSS|0V|G|MASSE)$/.test(n)) return 'gnd';
  if (/^(VCC|VIN|VDD|5V|3V3|3\.3V|3V|V\+|\+5V|\+3V3)$/.test(n)) return 'power';
  return 'gpio';
}
function parsePin(s){ const i = String(s).lastIndexOf(':'); return i > 0 ? {name:s.slice(0,i), type:s.slice(i+1)} : {name:String(s)}; }
/* Compile la définition d'un fichier de composant en géométrie (broches, corps, décor). */
function compile(def){
  const pins = [];
  (def.columns || []).forEach(c => (c.pins || []).forEach((s,i) => pins.push({...parsePin(s), x:c.x, y:(c.y || 0) + i, dir:c.labels})));
  (def.rows || []).forEach(r => (r.pins || []).forEach((s,i) => pins.push({...parsePin(s), x:(r.x || 0) + i, y:r.y, dir:r.labels})));
  (def.pins || []).forEach(p => pins.push({name:p.name, type:p.type, x:p.x, y:p.y, dir:p.label}));
  if (!pins.length) throw new Error('aucune broche');
  let body = def.body;
  if (!body){
    const xs = pins.map(p => p.x), ys = pins.map(p => p.y);
    body = {x0:Math.min(...xs) - .8, y0:Math.min(...ys) - .8, x1:Math.max(...xs) + .8, y1:Math.max(...ys) + .8};
  }
  const cx = (body.x0 + body.x1) / 2, cy = (body.y0 + body.y1) / 2;
  const DIRS = {left:[-1,0], right:[1,0], up:[0,-1], down:[0,1]};
  const out = pins.map(p => {
    let d = DIRS[p.dir];
    if (!d){
      const col = (def.columns || []).length && (def.columns || []).some(c => c.x === p.x);
      d = col ? [p.x <= cx ? 1 : -1, 0] : [0, p.y <= cy ? 1 : -1];
    }
    return {name:p.name, type:pinType(p.name, p.type), x:p.x, y:p.y, d};
  });
  return {pins:out, body, deco:def.deco || [], style:def.pinStyle || 'round', color:def.color || '#1b2a3a'};
}
function register(def, src){
  if (!def || typeof def !== 'object' || !def.id || !def.name) throw new Error('il faut au moins id et name');
  const id = slug(def.id); def = Object.assign({}, def, {id});
  const geo = compile(def);
  if (src === 'file' && LIB.has(id)) console.warn('ProtoBoard : composant en double', id);
  LIB.set(id, {def, src, geo});
  return id;
}
function loadLocalLib(){ try { (JSON.parse(localStorage.getItem(KEY_LIB)) || []).forEach(d => { try { register(d, 'local'); } catch(e){} }); } catch(e){} }
function saveLocalLib(){ try { store.set('components.v1', [...LIB.values()].filter(e => e.src === 'local').map(e => e.def)); } catch(e){} }
ProtoBoard.list.forEach(d => { try { register(d, 'file'); } catch(e){ console.warn('ProtoBoard : composant ignoré', d && d.id, e.message); } });
ProtoBoard.component = d => { try { register(d, 'file'); } catch(e){} };   // fichiers chargés plus tard
/* Fichier de composant (.js) à partir d'une définition. */
function componentFile(def){
  const q = v => JSON.stringify(v).replace(/"([A-Za-z_]\w*)":/g, '$1: ').replace(/,"/g, ', "').replace(/,\{/g, ', {').replace(/,([A-Za-z_]\w*): /g, ', $1: ');
  const parts = [];
  ['id','name','label','category','description','color','pinStyle','body','deco','columns','rows','pins','notes'].forEach(k => {
    const v = def[k]; if (v === undefined) return;
    if (Array.isArray(v) && (k === 'columns' || k === 'rows' || k === 'pins' || k === 'deco'))
      parts.push(`  ${k}: [\n${v.map(x => '    ' + q(x)).join(',\n')}\n  ]`);
    else if (k === 'notes' && v && typeof v === 'object')
      parts.push(`  notes: {\n${Object.entries(v).map(([a,b]) => `    ${JSON.stringify(a)}: ${JSON.stringify(b)}`).join(',\n')}\n  }`);
    else parts.push(`  ${k}: ${q(v)}`);
  });
  return `/* ${def.name} — composant ProtoBoardDesigner. */\nProtoBoard.component({\n${parts.join(',\n')}\n});\n`;
}
function parseComponentText(txt){
  txt = txt.trim(); const found = [];
  try { const d = JSON.parse(txt); (Array.isArray(d) ? d : [d]).forEach(x => found.push(x)); return found; } catch(e){}
  // Texte d'un fichier .js : exécuté avec un ProtoBoard qui ne fait que recueillir les définitions.
  new Function('ProtoBoard', txt)({component:d => found.push(d)});

/* ---------- géométrie des pièces ---------- */
function geo(p){
  let g;

    const n = p.n || 4, rows = p.rows || 1, pins = [];
    for (let i = 0; i < n; i++) for (let r = 0; r < rows; r++)
      pins.push({name:String(rows === 1 ? i+1 : i*2+r+1), type:'gpio', x:i, y:r, d:[0, r ? 1 : -1]});
    g = {pins, body:{x0:-.5, x1:n-.5, y0:-.5, y1:rows-.5}, deco:[], style:p.type === 'hdrM' ? 'male' : 'female', color:'#262626', out:true};
  } else if (p.type === 'axial'){
    const a = AXIAL[p.kind] || AXIAL.res, sp = Math.max(1, p.n || a.sp), bw = Math.max(.6, sp - 1.6), x0 = (sp - bw)/2, deco = [];
    deco.push({shape:'rect', x:x0, y:-.45, w:bw, h:.9, fill:a.fill});
    if (a.band) deco.push({shape:'rect', x:p.kind === 'res' ? x0 + bw*.2 : x0 + bw - Math.min(.3, bw*.25), y:-.45, w:Math.min(.3, bw*.25), h:.9, fill:a.band});
    g = {pins:a.pins.map((nm, i) => ({name:nm, type:nm === 'K' || nm === '-' ? 'gnd' : 'gpio', x:i ? sp : 0, y:0, d:[0,1]})),
      body:{x0:-.5, x1:sp + .5, y0:-.6, y1:.6}, deco, style:'round', color:'#0000', out:true};
  } else if (p.type === 'mod'){
    const n = p.n || 4, rows = p.rows || 1, gap = p.gap || 5, pins = [];
    if (rows === 1){
      for (let i = 0; i < n; i++) pins.push({name:String(i+1), type:'gpio', x:i, y:0, d:[0,1]});
      g = {pins, body:{x0:-.7, x1:n-.3, y0:-.7, y1:2.8}};
    } else {
      for (let i = 0; i < n; i++) pins.push({name:String(i+1), type:'gpio', x:0, y:i, d:[1,0]});
      for (let i = 0; i < n; i++) pins.push({name:String(n+i+1), type:'gpio', x:gap, y:i, d:[-1,0]});
      g = {pins, body:{x0:-.8, x1:gap+.8, y0:-.8, y1:n-.2}};
    }

  } else if (LIB.has(p.type)){
    const c = LIB.get(p.type).geo;
    g = {pins:c.pins.map(q => ({...q})), body:c.body, deco:c.deco, style:c.style, color:c.color};
  } else {
    return {pins:[], body:{x0:-.5, y0:-.5, x1:5.5, y1:2.5}, deco:[], style:'round', color:'#000', missing:true};
  }
  if (p.names && p.names.length) g.pins.forEach((q,i) => { if (p.names[i]) { q.name = p.names[i]; q.type = pinType(q.name, q.type === 'gpio' ? null : q.type); } });

}
function tf(p, lx, ly){ let x = p.f ? -lx : lx, y = ly; for (let i = 0; i < p.r; i++) [x,y] = [-y,x]; return [p.x + x, p.y + y]; }

const pinKeys = p => geo(p).pins.map(q => tf(p, q.x, q.y));
/* Fils accrochés aux broches d'une pièce : ils la suivent quand elle bouge ou pivote. */
function attached(p){
  const ks = pinKeys(p), refs = [];
  doc.wires.forEach(w => w.pts.forEach((pt,j) => { const i = ks.findIndex(k => k[0] === pt[0] && k[1] === pt[1]); if (i >= 0) refs.push([w,j,i]); }));

}

  const ks = pinKeys(p);

/* ---------- réseaux (union-find sur les points de soudure) ---------- */
function find(k){ let r = k; while (parent.has(r) && parent.get(r) !== r) r = parent.get(r); return r; }

    const [x,y] = tf(p,q.x,q.y), k = K(x,y);

const pinTitle = e => `${esc(e.p.label)} · ${esc(e.q.name)}`;

/* ---------- rendu ---------- */
function decoSVG(d){

    case 'can': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#cfd4da" stroke="#8a9099"/>`;
    case 'antenna': {
      let p = `M${x + U*.4} ${y + h*.75}`; const step = U*.5;
      for (let i = 0, up = true; x + U*.4 + (i+1)*step <= x + w - U*.3; i++, up = !up) p += ` h${step} v${up ? -h*.45 : h*.45}`;
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#22324d"/><path d="${p}" stroke="#d4a72c" stroke-width="1.5" fill="none"/>`;
    }
    case 'chip': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#1c1c1c" stroke="#555"/>`;
    case 'screen': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#0a0f1c" stroke="#3a4a6a"/>`;
    case 'coin': return `<circle cx="${x + w/2}" cy="${y + h/2}" r="${Math.min(w,h)/2}" fill="#c3c8cf" stroke="#7a7f87"/><circle cx="${x + w/2}" cy="${y + h/2}" r="${Math.min(w,h)/2.6}" fill="none" stroke="#9aa0a8"/>`;
    case 'rect': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${esc(d.fill || '#888')}"/>`;
  }

}
function partSVG(p, g, isSel){
  const b = g.body;

    return s + `<rect x="${b.x0*U}" y="${b.y0*U}" width="${(b.x1-b.x0)*U}" height="${(b.y1-b.y0)*U}" fill="#e5484d22" stroke="#e5484d" stroke-dasharray="5 4" stroke-width="2"/></g>`;

    const cx = q.x*U, cy = q.y*U;

/* Texte du plan. En vue de dessous le calque est en miroir : on re-retourne chaque texte autour de son point

  if (bottom){
    if (!o.vert) anchor = anchor === 'start' ? 'end' : anchor === 'end' ? 'start' : anchor;
    tr = `translate(${X} ${Y}) scale(-1 1) translate(${-X} ${-Y}) ` + tr;
  }
  return `<text class="${cls}" x="${X}" y="${Y}" font-size="${size}"${wt} text-anchor="${anchor}" dominant-baseline="central"${tr ? ` transform="${tr.trim()}"` : ''}>${esc(str)}</text>`;

/* Fils fins : on voit mieux ceux qui se croisent ou se longent. Nu = trait fin ; isolé = trait plus épais

/* Le dessin du plan. forExport : sans sélection, sans surbrillance, sans fil en cours (image PNG). */
function sceneHTML(forExport){

function restore(j){ lastJSON = j; doc = JSON.parse(j); sel = null; cur = null; save(); render(); updateCtx(); }

/* ---------- vue ---------- */
function toWorld(cx, cy){

  doc.parts.forEach(p => { const b = bboxW(p, geo(p)); add(b.x0, b.y0, b.x1, b.y1 + 1.5); });
  doc.wires.forEach(w => w.pts.forEach(([x,y]) => add(x,y,x,y)));
  if (!isFinite(x0)){ x0 = 0; y0 = 0; x1 = 20; y1 = 20; }
  if (bottom){ const a = doc.board.w - 1 - x1, b = doc.board.w - 1 - x0; x0 = a; x1 = b; }
  const r = svg.getBoundingClientRect(), aw = r.width - 24, ah = r.height - 24;
  const bw = (x1 - x0 + 1)*U, bh = (y1 - y0 + 1)*U;
  view.s = Math.max(.3, Math.min(4, Math.min(aw/bw, ah/bh)));
  view.tx = 12 + (aw - bw*view.s)/2 - (x0 - .5)*U*view.s;
  view.ty = 12 + (ah - bh*view.s)/2 - (y0 - .5)*U*view.s;
  applyView();
}

/* ---------- pointeurs : toucher, souris, pincement ---------- */
const ptrs = new Map(); let gest = null;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
svg.addEventListener('contextmenu', e => e.preventDefault());
svg.addEventListener('pointerdown', e => {
  try { svg.setPointerCapture(e.pointerId); } catch(_){}
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2){
    if (gest && gest.moved && (gest.part || gest.vertex)) commit();
    const [a,b] = [...ptrs.values()], m = mid(a,b), r = svg.getBoundingClientRect();
    gest = {type:'pinch', d0:dist(a,b) || 1, s0:view.s, wm:{x:(m.x - r.left - view.tx)/view.s, y:(m.y - r.top - view.ty)/view.s}};
    return;
  }
  if (ptrs.size > 2) return;
  const w = toWorld(e.clientX, e.clientY);
  gest = {type:'tap', sx:e.clientX, sy:e.clientY, w, target:e.target, moved:false, tx0:view.tx, ty0:view.ty};
  if (mode !== 'sel') return;
  if (sel && sel.t === 'wire'){
    const wr = getWire(sel.id); let idx = -1, best = .45*U;
    if (wr) wr.pts.forEach((pt,i) => { const d = Math.hypot(pt[0]*U - w.x, pt[1]*U - w.y); if (d < best){ best = d; idx = i; } });
    if (idx >= 0) gest.vertex = {wr, idx};
  }
  if (!gest.vertex && e.target.closest){
    const pg = e.target.closest('[data-part]');
    if (pg && !e.target.closest('[data-wire]')){ const p = getPart(pg.dataset.part); if (p){ gest.part = p; gest.p0 = {x:p.x, y:p.y}; gest.att = attached(p); } }
  }
});
svg.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (!gest){
    if (mode === 'wire' && cur && e.pointerType === 'mouse'){
      const k = snapPt(toWorld(e.clientX, e.clientY));
      if (!hover || hover[0] !== k[0] || hover[1] !== k[1]){ hover = k; render(); }
    }
    return;
  }
  if (gest.type === 'pinch'){
    if (ptrs.size < 2) return;
    const [a,b] = [...ptrs.values()], m = mid(a,b), r = svg.getBoundingClientRect();
    view.s = Math.max(.3, Math.min(8, gest.s0*dist(a,b)/gest.d0));
    view.tx = m.x - r.left - gest.wm.x*view.s; view.ty = m.y - r.top - gest.wm.y*view.s; applyView(); return;
  }
  const dx = e.clientX - gest.sx, dy = e.clientY - gest.sy;
  if (!gest.moved && Math.hypot(dx,dy) > 7) gest.moved = true;
  if (!gest.moved) return;
  if (gest.vertex){
    const k = snapPt(toWorld(e.clientX, e.clientY)), pt = gest.vertex.wr.pts[gest.vertex.idx];
    if (pt[0] !== k[0] || pt[1] !== k[1]){ gest.vertex.wr.pts[gest.vertex.idx] = k; render(); }
  } else if (gest.part){
    const nx = gest.p0.x + Math.round((bottom ? -dx : dx)/view.s/U), ny = gest.p0.y + Math.round(dy/view.s/U);
    if (nx !== gest.part.x || ny !== gest.part.y){ gest.part.x = nx; gest.part.y = ny; reattach(gest.part, gest.att); sel = {t:'part', id:gest.part.id}; render(); }
  } else { view.tx = gest.tx0 + dx; view.ty = gest.ty0 + dy; applyView(); }
});
function endPtr(e, cancel){
  ptrs.delete(e.pointerId);
  if (!gest) return;
  if (gest.type === 'pinch'){ if (!ptrs.size) gest = null; return; }
  const g = gest; gest = null;
  if (g.moved && (g.part || g.vertex)){ if (g.vertex) cleanWire(g.vertex.wr); commit(); return; }
  if (!cancel && !g.moved) handleTap(g);
}
svg.addEventListener('pointerup', e => endPtr(e, false));
svg.addEventListener('pointercancel', e => endPtr(e, true));
svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY*.0015)); }, {passive:false});

function handleTap(g){
  const k = [Math.round(g.w.x/U), Math.round(g.w.y/U)], key = K(...k);
  if (mode === 'wire'){ wireTap(snapPt(g.w)); return; }
  const near = Math.hypot(k[0]*U - g.w.x, k[1]*U - g.w.y) < .46*U;
  const t = g.target && g.target.closest ? g.target : null;
  if (near && pinMap.has(key)) sel = {t:'pin', key};
  else if (t && t.closest('[data-wire]')) sel = {t:'wire', id:t.closest('[data-wire]').dataset.wire};
  else if (t && t.closest('[data-part]')) sel = {t:'part', id:t.closest('[data-part]').dataset.part};
  else sel = null;
  render(); updateCtx();
}

/* ---------- fils ---------- */
function cleanWire(w){ w.pts = w.pts.filter((p,i,a) => i === 0 || p[0] !== a[i-1][0] || p[1] !== a[i-1][1]); if (w.pts.length < 2) doc.wires = doc.wires.filter(x => x !== w); }
function wireTap(k){
  const key = K(...k);
  if (!cur) cur = {pts:[k]};
  else {
    const l = cur.pts[cur.pts.length-1];
    if (l[0] === k[0] && l[1] === k[1]){ finishWire(); return; }
    if (ortho && l[0] !== k[0] && l[1] !== k[1]) cur.pts.push([k[0], l[1]]);
    cur.pts.push(k);
    if (pinMap.has(key) || vtxKeys.has(key)){ finishWire(); return; }
  }
  render(); updateCtx();
}
function finishWire(){
  if (cur && cur.pts.length >= 2){
    const w = {id:uid(), c:wireColor, pts:cur.pts};
    if (wireIso) w.iso = true;
    cur = null; hover = null; doc.wires.push(w); cleanWire(w); commit();
  } else { cur = null; hover = null; render(); updateCtx(); }
}

/* ---------- modes et pièces ---------- */
function setMode(m){
  if (mode === 'wire' && m !== 'wire' && cur) finishWire();
  mode = m; if (m === 'wire') sel = null;
  $('#mSel').classList.toggle('on', m === 'sel'); $('#mWire').classList.toggle('on', m === 'wire');
  render(); updateCtx();
}
function centerW(p){ const b = geo(p).body; return tf(p, (b.x0+b.x1)/2, (b.y0+b.y1)/2); }
function transformPart(id, fn){
  const p = getPart(id); if (!p) return;
  const refs = attached(p), c0 = centerW(p);
  fn(p);
  const c1 = centerW(p); p.x += Math.round(c0[0]-c1[0]); p.y += Math.round(c0[1]-c1[1]);
  reattach(p, refs); commit();
}
function addPart(type, extra){
  const r = svg.getBoundingClientRect(), c = toWorld(r.left + r.width/2, r.top + r.height/2);
  const label = BUILTIN[type] ? BUILTIN[type].label : (LIB.get(type).def.label || LIB.get(type).def.name);
  const p = Object.assign({id:uid(), type, x:0, y:0, r:0, f:false, label, names:[]}, extra || {});
  const b = geo(p).body;
  p.x = Math.round(c.x/U - (b.x0+b.x1)/2); p.y = Math.round(c.y/U - (b.y0+b.y1)/2);
  doc.parts.push(p); closeDlg(); setMode('sel'); sel = {t:'part', id:p.id}; commit();
}

/* ---------- panneau contextuel (au-dessus des modes) ---------- */
const swatches = active => '<div class="rowb">' + COLORS.map(c => `<button class="swatch ${c === active ? 'on' : ''}" style="background:${c}" data-a="color" data-v="${c}" aria-label="Couleur ${c}"></button>`).join('') + '</div>';
function updateCtx(){
  let h = '';
  if (mode === 'wire'){
    h += swatches(wireColor) + `<div class="rowb"><button class="chip ${ortho ? 'on' : ''}" data-a="ortho">⌐ Angles droits</button><button class="chip ${half ? 'on' : ''}" data-a="half" title="Accrocher entre les pastilles">½ Entre pastilles</button><button class="chip ${wireIso ? 'on' : ''}" data-a="iso" title="Fil gainé, par-dessus les soudures">Fil isolé</button></div>`;
    if (cur) h += `<div class="rowb"><button class="btn" data-a="pop" title="Retirer le dernier point">⌫</button><button class="btn primary" data-a="finish">✓ Terminer</button><button class="btn" data-a="cancel">✕</button></div>`;
    h += `<div class="info">${cur ? `${cur.pts.length} point(s) — touche les coudes, puis une broche ou un fil pour terminer (ou retouche le dernier point).` : 'Touche un point de départ : une broche ou un trou.'}</div>`;
  } else if (sel && sel.t === 'part'){
    const p = getPart(sel.id);
    if (p) h += `<div class="info"><b>${esc(p.label)}</b> — ${esc(partName(p))}</div>
      <div class="rowb"><button class="btn" data-a="rot" title="Pivoter (R)">⟳</button><button class="btn" data-a="flip" title="Retourner (F)">⇋</button><button class="btn" data-a="edit">✎ Modifier</button><button class="btn" data-a="dup" title="Dupliquer">⧉</button><button class="btn" data-a="delpart" title="Supprimer">🗑</button></div>`;
  } else if (sel && sel.t === 'wire'){
    const w = getWire(sel.id);
    if (w){
      const pins = netPins(netKeys(K(...w.pts[0])));
      h += swatches(w.c) + `<div class="rowb"><button class="chip ${w.iso ? 'on' : ''}" data-a="iso" title="Fil gainé, par-dessus les soudures">Fil isolé</button><button class="chip ${half ? 'on' : ''}" data-a="half" title="Déplacer les points entre les pastilles">½ Entre pastilles</button><button class="btn" data-a="delwire">🗑 Supprimer</button></div>`;
      h += `<div class="info">Réseau : ${pins.length ? pins.map(e => `<b>${pinTitle(e)}</b>`).join(' ↔ ') : 'aucune broche'} · glisse un point du fil pour le déplacer</div>`;
      netWarnings(pins).forEach(t => h += `<div class="warn">${t}</div>`);
    }
  } else if (sel && sel.t === 'pin'){
    const here = pinMap.get(sel.key) || [], pins = netPins(netKeys(sel.key));
    here.forEach(e => {
      const def = LIB.get(e.p.type), note = (def && def.def.notes && def.def.notes[e.q.name]) || POWER_NOTE[e.q.name] || '';
      h += `<div class="info"><b>${pinTitle(e)}</b> — ${(TYPES[e.q.type] || TYPES.gpio).t}${note ? ' — ' + esc(note) : ''}</div>`;
    });
    const others = pins.filter(e => K(e.x,e.y) !== sel.key);
    h += `<div class="info">${others.length ? 'Relié à : ' + others.map(e => `<b>${pinTitle(e)}</b>`).join(', ') : 'Aucune connexion'}</div>`;
    netWarnings(pins).forEach(t => h += `<div class="warn">${t}</div>`);
  } else h += `<div class="rowb"><button class="btn" data-a="save">💾 Enregistrer</button><button class="btn" data-a="load">📂 Charger</button></div>
    <div class="info">Touche une pièce, une broche ou un fil · glisse pour déplacer · pince pour zoomer</div>`;
  $('#ctx').innerHTML = h;
}
$('#ctx').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const id = sel && sel.id;
  switch (b.dataset.a){
    case 'color':
      wireColor = b.dataset.v;
      if (sel && sel.t === 'wire' && getWire(id)){ getWire(id).c = wireColor; commit(); } else { render(); updateCtx(); }
      break;
    case 'save': saveCmd(); break;
    case 'load': sheetLoad(); break;
    case 'ortho': ortho = !ortho; updateCtx(); break;
    case 'half': half = !half; applyMirror(); updateCtx(); break;
    case 'iso':
      if (sel && sel.t === 'wire' && getWire(id)){ const w = getWire(id); if (w.iso) delete w.iso; else w.iso = true; commit(); }
      else { wireIso = !wireIso; render(); updateCtx(); }
      break;
    case 'pop': if (cur){ cur.pts.pop(); if (!cur.pts.length) cur = null; render(); updateCtx(); } break;
    case 'finish': finishWire(); break;
    case 'cancel': cur = null; hover = null; render(); updateCtx(); break;
    case 'rot': transformPart(id, p => p.r = (p.r + 1) % 4); break;
    case 'flip': transformPart(id, p => p.f = !p.f); break;
    case 'edit': sheetEdit(id); break;
    case 'dup': { const p = getPart(id), bb = bboxW(p, geo(p)), q = JSON.parse(JSON.stringify(p));
      q.id = uid(); q.x += Math.ceil(bb.x1 - bb.x0) + 1; doc.parts.push(q); sel = {t:'part', id:q.id}; commit(); break; }
    case 'delpart': doc.parts = doc.parts.filter(p => p.id !== id); sel = null; commit(); break;
    case 'delwire': doc.wires = doc.wires.filter(w => w.id !== id); sel = null; commit(); break;
  }
});

/* ---------- feuilles ---------- */
const dlg = $('#dlg');
let dlgHandler = null;
function openDlg(html, handler){

}

dlg.addEventListener('click', e => {

  const b = e.target.closest('[data-a]'); if (b && dlgHandler) dlgHandler(b.dataset.a, b);
});
const typeLegend = () => '<div class="legend">' + Object.values(TYPES).map(t => `<span><i style="background:${t.f}"></i>${t.t}</span>`).join('') + '</div>';

function sheetAdd(){

  [...LIB.entries()].sort((a,b) => (a[1].src === b[1].src ? 0 : a[1].src === 'file' ? -1 : 1)).forEach(([id, e]) => {
    const c = e.src === 'local' ? 'Mes composants' : (e.def.category || 'Divers');
    if (!cats.has(c)) cats.set(c, []); cats.get(c).push([id, e.def]);
  });
  let h = '<h2>Ajouter</h2>';
  cats.forEach((list, c) => {
    h += `<h3>${esc(c)}</h3><div class="grid">` + list.map(([id, d]) => `<button class="btn" data-a="add" data-id="${esc(id)}"><b>${esc(d.name)}</b><small>${esc(d.description || '')}</small></button>`).join('') + '</div>';
  });
  h += `<h3>Connecteurs Dupont</h3><div class="form"><div class="three">
      <div><label class="lbl" for="hn">Broches</label><input type="number" id="hn" min="1" max="40" value="4" inputmode="numeric"></div>
      <div><label class="lbl" for="hr">Rangées</label><select id="hr"><option value="1">1</option><option value="2">2</option></select></div><div></div></div></div>
    <div class="grid" style="margin-top:8px"><button class="btn" data-a="hdrM"><b>Barrette mâle</b><small>picots</small></button><button class="btn" data-a="hdrF"><b>Barrette femelle</b><small>douilles</small></button></div>
    <h3>Pièces à 2 pattes</h3><div class="form"><div class="three">

  openDlg(h, (a, b) => {

}
function sheetEdit(id){
  const p = getPart(id); if (!p) return;
  const g = geo(p), param = p.type === 'hdrM' || p.type === 'hdrF' || p.type === 'mod';
  let h = `<h2>Modifier</h2><div class="form"><label class="lbl" for="eLabel">Nom</label><input type="text" id="eLabel" value="${esc(p.label)}">`;
  if (param) h += `<div class="three"><div><label class="lbl" for="eN">Broches${p.type === 'mod' ? '/rangée' : ''}</label><input type="number" id="eN" min="1" max="40" value="${p.n || 4}" inputmode="numeric"></div>
      <div><label class="lbl" for="eRows">Rangées</label><select id="eRows"><option value="1" ${(p.rows || 1) === 1 ? 'selected' : ''}>1</option><option value="2" ${p.rows === 2 ? 'selected' : ''}>2</option></select></div>

  h += `<label class="lbl" for="eNames">Noms des broches (virgules, dans l'ordre)</label><textarea id="eNames" spellcheck="false">${esc(g.pins.map(q => q.name).join(', '))}</textarea></div>`;
  if (p.type === 'axial') h = h.replace('<label class="lbl" for="eNames"', `<div class="three"><div><label class="lbl" for="eSp">Écart (pas)</label><input type="number" id="eSp" min="1" max="30" value="${p.n || (AXIAL[p.kind] || AXIAL.res).sp}" inputmode="numeric"></div><div></div><div></div></div><label class="lbl" for="eNames"`);

  h += `<div class="btns">${p.type === 'mod' ? '<button class="btn" data-a="tocomp">Enregistrer comme composant</button>' : ''}<button class="btn" data-a="reset">Noms par défaut</button><button class="btn primary" data-a="apply">Appliquer</button></div>`;
  openDlg(h, a => {
    if (a === 'reset'){ p.names = []; closeDlg(); commit(); }

    }

}
/* Module générique → composant enregistré dans le navigateur, et fichier .js à placer dans le dépôt. */
function moduleToComponent(p){
  const g = geo(p), names = g.pins.map(q => q.name + (q.type === 'power' || q.type === 'gnd' ? ':' + q.type : ''));
  const n = p.n || 4;
  let id = slug(p.label); while (LIB.has(id) && LIB.get(id).src === 'file') id += '-perso';
  const def = {id, name:p.label, label:p.label, category:'Mes composants', description:(p.rows === 2 ? '2×' : '1×') + n + ' broches', color:'#2e6b34', body:g.body};
  if ((p.rows || 1) === 1) def.rows = [{y:0, pins:names}];
  else def.columns = [{x:0, pins:names.slice(0, n)}, {x:p.gap || 5, pins:names.slice(n)}];
  register(def, 'local'); saveLocalLib();
  p.type = id; p.names = []; delete p.n; delete p.rows; delete p.gap;
  commit(); sheetComponentFile(id);
}
function sheetComponentFile(id){
  const e = LIB.get(id), file = id.replace(/-/g, '_') + '.js', txt = componentFile(e.def);
  openDlg(`<h2>${esc(e.def.name)}</h2><p>Enregistré dans ce navigateur. Pour l'ajouter au dépôt, place ce fichier dans <code>code/protoboard/components/${esc(file)}</code> et ajoute sa ligne <code>&lt;script src&gt;</code> dans la page.</p>
    <textarea id="cfTxt" readonly spellcheck="false" style="min-height:220px">${esc(txt)}</textarea>
    <div class="btns"><button class="btn" data-a="copy">Copier</button><button class="btn primary" data-a="dl">Télécharger ${esc(file)}</button></div>`,
    a => { if (a === 'copy') copyText(txt); if (a === 'dl') download(file, txt, 'text/javascript'); });
}
function sheetLib(){

function nets(){
  buildIndex();
  const groups = new Map();
  pinMap.forEach((list, k) => { const r = find(k); if (!groups.has(r)) groups.set(r, []); list.forEach(e => groups.get(r).push(e)); });
  return [...groups.values()].filter(g => g.length >= 2);
}

  const N = nets();

  h += N.length ? N.map((g,i) => `<div class="net"><b>${i+1}.</b> ${g.map(pinTitle).join(' ↔ ')}${netWarnings(g).map(t => `<div class="warn">${t}</div>`).join('')}</div>`).join('') : '<p>Aucune connexion pour l\'instant.</p>';

const usedComponents = () => { const used = {}; doc.parts.forEach(p => { const e = LIB.get(p.type); if (e) used[p.type] = e.def; }); return used; };
function exportText(){
  return JSON.stringify({app:'ProtoBoardDesigner', version:1, board:doc.board, parts:doc.parts, wires:doc.wires, components:usedComponents()}, null, 1);

/* ---------- bibliothèque de circuits (localStorage, enregistrement à la demande) ---------- */
const fmtDate = t => new Date(t).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'});
function readCircuits(){
  const out = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (!k || !k.startsWith(CIRC_PREFIX)) continue;
    try { const c = JSON.parse(localStorage.getItem(k)); if (c && c.id && c.name && validDoc(c.doc)) out.push(c); } catch(e){}
  }
  return out;
}
function putCircuit(rec){
  try { store.set('circuit.' + rec.id, rec); return true; }
  catch(e){ toast('Enregistrement impossible : le stockage du navigateur est plein.', true); return false; }
}
function delCircuit(id){ try { store.remove('circuit.' + id); } catch(e){} }
/* Ancienne bibliothèque (une seule clé protoboard.circuits.v1) : un circuit par clé, pour pouvoir les synchroniser. */
function migrateCircuits(){
  try {
    const old = JSON.parse(localStorage.getItem(KEY_CIRC));
    if (Array.isArray(old)){ old.forEach(c => { if (c && c.id && c.name && validDoc(c.doc)) store.set('circuit.' + c.id, c); }); }
    if (old !== null) localStorage.removeItem(KEY_CIRC);
  } catch(e){}
}
function setCircuit(c){
  circuit = c; savedJSON = c ? JSON.stringify(doc) : '';
  try { c ? localStorage.setItem(KEY_CUR, JSON.stringify(c)) : localStorage.removeItem(KEY_CUR); } catch(e){}
  updateTitle();
}
const isDirty = () => JSON.stringify(doc) !== savedJSON;
const hasContent = () => doc.parts.length || doc.wires.length;
/* Sous le titre : le nom du circuit, avec • quand il a changé depuis son enregistrement. */
function updateTitle(){
  const el = $('#subtitle');
  if (circuit){ el.textContent = circuit.name + (isDirty() ? ' •' : ''); el.title = isDirty() ? 'Modifications non enregistrées' : 'Enregistré'; }
  else { el.textContent = hasContent() ? 'Circuit sans nom' : 'Plaque à pastilles · pas 2,54 mm'; el.title = ''; }
}
function saveCircuit(name, id){
  const rec = {id:id || uid(), name, t:Date.now(), doc:JSON.parse(JSON.stringify(doc)), components:usedComponents()};
  if (!putCircuit(rec)) return false;
  setCircuit({id:rec.id, name}); return true;
}
/* Remplace le plan par un plan lu (import ou bibliothèque) et ajoute à « Mes composants » ceux qui manquent. */
function applyDoc(d, comps){
  let added = 0;
  Object.values(comps || {}).forEach(c => { if (c && c.id && !LIB.has(slug(c.id))){ try { register(c, 'local'); added++; } catch(e){} } });
  if (added) saveLocalLib();
  doc = {board:d.board || {w:24,h:30,show:true}, parts:d.parts, wires:d.wires};
  sel = null; cur = null; commit(); fit();
  return added;
}
/* Enregistrer : sur place si le circuit a déjà un nom, sinon on le demande. */
function saveCmd(){

/* Image PNG de la vue actuelle (dessus ou dessous), sur fond blanc, avec repères de colonnes (A, B…) et de
   lignes (1, 2…) : un guide pour souder. Fabriquée à partir du même dessin que l'écran, sans sélection. */
const colLetter = i => { let r = ''; for (i++; i > 0; i = Math.floor((i - 1)/26)) r = String.fromCharCode(65 + (i - 1) % 26) + r; return r; };
function exportPNG(){
  const B = doc.board, W = B.w;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a,b,c,d) => { x0 = Math.min(x0,a); y0 = Math.min(y0,b); x1 = Math.max(x1,c); y1 = Math.max(y1,d); };
  if (B.show) add(-.5, -.5, W - .5, B.h - .5);
  doc.parts.forEach(p => { const b = bboxW(p, geo(p)); add(b.x0, b.y0, b.x1, b.y1 + 1.5); });
  doc.wires.forEach(w => w.pts.forEach(([x,y]) => add(x,y,x,y)));
  if (!isFinite(x0)){ toast('Rien à exporter.', true); return; }
  if (bottom){ const a = W - 1 - x1, b = W - 1 - x0; x0 = a; x1 = b; }
  const L = 2.2, T = 3, R = 1.2, Bm = 2.2;
  const vx = (x0 - L)*U, vy = (y0 - T)*U, vw = (x1 - x0 + L + R)*U, vh = (y1 - y0 + T + Bm)*U;
  const sc = Math.min(2, 4000/Math.max(vw, vh));
  const gx = i => (bottom ? W - 1 - i : i)*U;
  let ov = `<text x="${vx + U*.6}" y="${vy + U*1.1}" font-size="11" font-weight="700" fill="#111">ProtoBoardDesigner — vue de ${bottom ? 'dessous (miroir)' : 'dessus'}</text>`;
  if (B.show){
    for (let i = 0; i < W; i++) ov += `<text x="${gx(i)}" y="${-1.15*U}" font-size="7" fill="#555" text-anchor="middle" dominant-baseline="central">${colLetter(i)}</text>`;
    for (let j = 0; j < B.h; j++) ov += `<text x="${-1.25*U}" y="${j*U}" font-size="7" fill="#555" text-anchor="middle" dominant-baseline="central">${j + 1}</text>`;
  }
  ov += `<text x="${vx + U*.6}" y="${vy + vh - U*.7}" font-size="7.5" fill="#555">Trait fin : fil nu soudé de pastille en pastille · trait épais : fil isolé · pastille cerclée : couleur = type de broche</text>`;
  const css = `text{font-family:system-ui,Arial,sans-serif}.pb-board{fill:${bottom ? '#e2c486' : '#f3e3bd'};stroke:#c9a96a}.pb-pad,.pb-copper{fill:#dca866;stroke:#b07a35}.pb-hole{fill:#5a4630}`
    + `.pb-line{stroke:#ddd}.pb-dot{fill:#bbb}.pb-half{fill:none}.pb-sel{stroke:none}.pb-glow{stroke:none}.pb-in{fill:#fff;fill-opacity:.92}.pb-title{fill:#fff;fill-opacity:.55}`
    + `.pb-out{fill:#111;stroke:#fff;stroke-width:2.5px;paint-order:stroke}`;
  const mirror = bottom ? `translate(${mirX()},0) scale(-1,1)` : '';
  const out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} ${vy} ${vw} ${vh}" width="${Math.round(vw*sc)}" height="${Math.round(vh*sc)}">`
    + `<style>${css}</style><defs>${svg.querySelector('defs').innerHTML}</defs><rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="#fff"/>`
    + `<g ${mirror ? `transform="${mirror}"` : ''}>${sceneHTML(true)}</g>${ov}</svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = Math.round(vw*sc); c.height = Math.round(vh*sc);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => { if (!b){ toast('Export de l\'image impossible.', true); return; } download(`protoboard-${bottom ? 'dessous' : 'dessus'}.png`, b, 'image/png'); toast('Image enregistrée.'); }, 'image/png');
  };
  img.onerror = () => toast('Export de l\'image impossible.', true);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out);
}

/* ---------- synchronisation (PocketBase, facultative) ---------- */
let syncing = false, lastSync = 0, syncMsg = '';
function reloadLocalLib(){ [...LIB.entries()].forEach(([id, e]) => { if (e.src === 'local') LIB.delete(id); }); loadLocalLib(); }
/* Une valeur vient d'être remplacée par la version du serveur. */
store.onChange = (key, value) => {
  if (key === 'doc.v1'){
    if (!validDoc(value)) return;
    undoStack.push(lastJSON); if (undoStack.length > 100) undoStack.shift(); redoStack = [];
    doc = value; if (!doc.board) doc.board = {w:24, h:30, show:true};
    lastJSON = JSON.stringify(doc); sel = null; cur = null; render(); updateCtx();
    toast('Plan mis à jour depuis un autre appareil — ↶ pour revenir.');
  } else if (key === 'components.v1'){ reloadLocalLib(); render(); }
  else if (key.startsWith('circuit.')){ const h = $('#dlgIn h2'); if (dlg.open && h && h.textContent === 'Charger un circuit') sheetLoad(); }
};
store.onError = e => {
  syncMsg = 'Erreur : ' + (e && e.message || e);
  if (e && (e.status === 401 || e.status === 403)) toast('Synchronisation : reconnecte-toi (menu ☰ → Synchronisation).', true);
  console.warn('pbstore :', e);
};
async function doSync(manual){
  if (!store.connected || syncing) return null;
  if (!manual && Date.now() - lastSync < 20000) return null;   // l'authentification du serveur est limitée en débit
  syncing = true; lastSync = Date.now();
  try {
    const r = await store.sync();
    syncMsg = `Synchronisé à ${new Date().toLocaleTimeString('fr-FR', {timeStyle:'short'})} · ${r.pushed} envoyé(s), ${r.pulled} reçu(s)`;
    return r;
  } catch(e){ store.onError(e); return null; }
  finally { syncing = false; }
}
function sheetSync(){
  let h = '<h2>Synchronisation</h2>';
  if (store.connected){
    h += `<p>Connecté : <b>${esc(store.email)}</b> · ${esc(store.url)}</p><p id="syMsg">${esc(syncMsg || 'Pas encore synchronisé sur cette page.')}</p>
      <div class="btns"><button class="btn" data-a="logout">Se déconnecter</button><button class="btn primary" data-a="now">Synchroniser maintenant</button></div>
      <p>Le plan en cours, les circuits enregistrés et « Mes composants » sont copiés sur le serveur. La dernière modification gagne, clé par clé (le plan, chaque circuit, les composants) : les horloges des appareils doivent être à peu près justes. Les valeurs sont lisibles par l'administrateur du serveur.</p>`;
  } else {
    h += `<p>Facultatif : retrouve ton plan et tes circuits sur tes autres appareils. Sans connexion, tout reste dans ce navigateur.</p>
      <div class="form"><label class="lbl" for="syUrl">Serveur</label><input type="text" id="syUrl" value="${esc(store.url)}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label class="lbl" for="syMail">Email</label><input class="field" type="email" id="syMail" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label class="lbl" for="syPw">Mot de passe</label><input class="field" type="password" id="syPw" autocomplete="current-password"></div>
      <div class="btns"><button class="btn primary" data-a="login">Se connecter</button></div>
      <p>Les comptes sont créés par l'administrateur. Le mot de passe n'est pas gardé, seulement un jeton. Au premier envoi, si le serveur a déjà un plan en cours ou des composants, c'est sa version qui est reprise (↶ pour revenir) ; les circuits des deux côtés sont réunis.</p>`;
  }
  openDlg(h, async (a, b) => {
    if (a === 'logout'){ store.logout(); syncMsg = ''; sheetSync(); }
    if (a === 'now'){ b.disabled = true; const r = await doSync(true); if (dlg.open) sheetSync(); if (r) toast('Synchronisé.'); }
    if (a === 'login'){
      const url = $('#syUrl').value.trim(), mail = $('#syMail').value.trim(), pw = $('#syPw').value;
      if (!mail || !pw){ toast('Email et mot de passe, s\'il te plaît.', true); return; }
      b.disabled = true; b.textContent = 'Connexion…';
      try { await store.login(url, mail, pw); }
      catch(e){ toast(e.status === 429 ? 'Trop d\'essais, attends quelques secondes.' : e.status === 400 ? 'Identifiants refusés.' : 'Connexion impossible : ' + (e.message || e), true); b.disabled = false; b.textContent = 'Se connecter'; return; }
      store.adopt(['doc.v1', 'components.v1']);
      await doSync(true);
      if (dlg.open) sheetSync();
      toast('Connecté.');
    }
  });
}
window.addEventListener('online', () => doSync(false));
document.addEventListener('visibilitychange', () => { if (!document.hidden) doSync(false); });

/* ---------- barres et clavier ---------- */
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bFit').onclick = fit; $('#bMenu').onclick = sheetMenu;
$('#bSide').onclick = () => setSide(!bottom); $('#pillSide').onclick = () => setSide(false);
$('#bAdd').onclick = sheetAdd; $('#mSel').onclick = () => setMode('sel'); $('#mWire').onclick = () => setMode('wire');
document.addEventListener('keydown', e => {
  if (dlg.open || (e.target.matches && e.target.matches('input,textarea,select'))) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveCmd(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape'){ if (cur){ cur = null; hover = null; } else sel = null; render(); updateCtx(); }
  else if (e.key === 'Enter' && cur) finishWire();
  else if (e.key === 'w') setMode(mode === 'wire' ? 'sel' : 'wire');
  else if (e.key === 'd') setSide(!bottom);
  else if (e.key === 'h'){ half = !half; applyMirror(); updateCtx(); }
  else if (sel && sel.t === 'part' && e.key === 'r') transformPart(sel.id, p => p.r = (p.r + 1) % 4);
  else if (sel && sel.t === 'part' && e.key === 'f') transformPart(sel.id, p => p.f = !p.f);
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel){
    if (sel.t === 'part') doc.parts = doc.parts.filter(p => p.id !== sel.id);
    else if (sel.t === 'wire') doc.wires = doc.wires.filter(w => w.id !== sel.id);
    else return;
    sel = null; commit();
  }
});
window.addEventListener('resize', applyView);

/* ---------- démarrage ---------- */
migrateCircuits();
store.adopt(['doc.v1', 'components.v1']);
loadLocalLib();
const savedView = load();
try {   // circuit ouvert avant le rechargement de la page
  const c = JSON.parse(localStorage.getItem(KEY_CUR)), rec = c && readCircuits().find(r => r.id === c.id);
  if (rec){ circuit = {id:rec.id, name:rec.name}; savedJSON = JSON.stringify(rec.doc); }
} catch(e){}
setMode('sel');
if (savedView && savedView.s){ view = savedView; bottom = !!view.b; applyView(); render(); } else fit();
const missing = [...new Set(doc.parts.filter(p => !BUILTIN[p.type] && !LIB.has(p.type)).map(p => p.type))];
if (missing.length) toast('Composant(s) introuvable(s) : ' + missing.join(', '), true);
doSync(true);
</script>
</body>
</html>
