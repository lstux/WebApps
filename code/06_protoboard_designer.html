<title>ProtoBoardDesigner</title>

<script>
/* Registre des composants : chaque fichier de protoboard/components/ appelle ProtoBoard.component({…}).
   Défini avant les fichiers de composants, qui sont chargés en fin de page. */
window.ProtoBoard = { list: [], component(def) { this.list.push(def); } };
</script>
<style>
/* ProtoBoardDesigner — styles propres à l'outil.
   Composants du système : .topbar, .appicon, .brand, .iconbtn, .btn, .chips, .chip, dialog.sheet, .item, .toast.
   Les couleurs de la plaque, des broches et des fils représentent des objets réels : elles sont fixes,
   sauf la plaque (assombrie en thème sombre) et les repères de sélection (accent du thème). */
:root { --pb-under:#e2c486; --pb-board:#f3e3bd; --pb-board-edge:#c9a96a; --pb-pad:#dca866; --pb-pad-edge:#b07a35; --pb-hole:#5a4630; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --pb-under:#9a8458; --pb-board:#b9a47a; --pb-board-edge:#8a7448; --pb-pad:#c08a45; --pb-pad-edge:#8a5a22; --pb-hole:#2b2016; } }
:root[data-theme="dark"] { --pb-under:#9a8458; --pb-board:#b9a47a; --pb-board-edge:#8a7448; --pb-pad:#c08a45; --pb-pad-edge:#8a5a22; --pb-hole:#2b2016; }

/* La page occupe exactement la zone visible : position fixe plutôt que 100dvh, qui sur certains
   navigateurs mobiles (Android en plein écran, barre d'adresse dynamique) déborde sous le bas de l'écran
   et cachait la barre des modes. */
html, body { height:100%; }
body { position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none; }
.topbar, .dock { flex:none; }
.topbar-in { max-width:none; gap:8px; }
.topbar-in .iconbtn { --icon-size:38px; }
#subtitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:480px) { .topbar-in { gap:5px; } .topbar-in .appicon { width:30px; height:30px; border-radius:9px; } .topbar-in .grow { min-width:0; } .brand { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .topbar .subtitle { font-size:12px; } .brand { font-size:16px; } .topbar-in .iconbtn { --icon-size:32px; font-size:18px; } }
@media (max-width:380px) { .brand { font-size:14px; } .topbar-in .iconbtn { --icon-size:30px; } }

.stage { position:relative; flex:1; min-height:0; }
#svg { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.pb-line { stroke:var(--line); }
.pb-dot { fill:var(--mut2); }
.pb-board { fill:var(--pb-board); stroke:var(--pb-board-edge); }
#svg.under .pb-board { fill:var(--pb-under); }
.pb-half { fill:var(--ac); opacity:.55; }
.pb-copper { fill:var(--pb-pad); stroke:var(--pb-pad-edge); }
.sidepill { white-space:nowrap; position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:3; padding:5px 14px; border-radius:99px; font-size:12.5px; font-weight:750;
  background:var(--ac); color:#fff; box-shadow:0 2px 10px #0004; border:0; cursor:pointer; }
.sidepill[hidden] { display:none; }
.pb-pad { fill:var(--pb-pad); stroke:var(--pb-pad-edge); }
.pb-hole { fill:var(--pb-hole); }
.pb-sel { stroke:var(--ac); }
.pb-glow { stroke:var(--ac); stroke-opacity:.35; }
.pb-ring { fill:none; stroke:var(--ac); }
.pb-ring.here { fill:color-mix(in srgb,var(--ac) 22%,transparent); }
.pb-out { fill:var(--fg); stroke:var(--bg); stroke-width:2.5px; paint-order:stroke; }
.pb-in { fill:#fff; fill-opacity:.92; }
.pb-title { fill:#fff; fill-opacity:.55; }

.dock { position:relative; z-index:5; background:var(--glass); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-top:1px solid var(--line); padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px)); }
.dock-in { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.ctx { display:flex; flex-direction:column; gap:8px; }
.ctx:empty { display:none; }
.ctx .info { font-size:13.5px; color:var(--mut); }
.ctx .info b { color:var(--fg); }
.ctx .warn { font-size:13.5px; font-weight:700; color:var(--err); }
.rowb { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.rowb .btn { padding:8px 13px; }
.mainrow { display:flex; align-items:center; gap:8px; }
.mainrow .chips { flex:1; }
.mainrow .chip { flex:1; text-align:center; padding:9px 12px; }
@media (max-width:400px) { .mainrow { gap:6px; } .mainrow .chip { padding:9px 6px; white-space:nowrap; } .mainrow .btn { padding-left:12px; padding-right:12px; } }
.swatch { width:32px; height:32px; border-radius:50%; border:2px solid var(--card); box-shadow:0 0 0 1px var(--mut2); flex:none; transition:transform .2s var(--spring); }
.swatch.on { box-shadow:0 0 0 3px var(--ac); }
.swatch:active { transform:scale(.9); }

/* Feuilles */
.sheet .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:0 4px; }
.sheet .grid .btn { justify-content:flex-start; flex-direction:column; align-items:flex-start; gap:1px; white-space:normal; text-align:left; min-height:58px; }
.sheet .grid small { font-weight:500; color:var(--mut); font-size:12px; }
/* Sélecteur de composants : filtre, groupes repliables, cartes à mini-empreinte */
#pkHead { position:sticky; top:-8px; z-index:2; background:var(--card); padding-top:8px; margin-top:-8px; }
#pkQ { margin:0 4px 8px; width:calc(100% - 8px); }
dialog.sheet:has(#pkHead) { max-width:760px; }
.plist { margin:0 4px; min-height:40vh; }
.pgrp { margin:0 0 2px; }
.pghd { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; color:var(--fg); font:inherit; padding:10px 6px; border-radius:var(--r-m); cursor:pointer; text-align:left; }
.pghd:hover, .pghd:focus-visible { background:var(--hover); }
.pghd b { flex:1; font-size:15px; font-weight:700; }
.pghd small { color:var(--mut); font-size:13px; font-weight:600; }
.pghd .chev { color:var(--mut); width:12px; text-align:center; }
.gico { width:20px; height:20px; flex:none; color:var(--ac); }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; padding:2px 0 10px; }
.pcard { display:flex; flex-direction:column; gap:4px; min-width:0; padding:8px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--card); color:var(--fg); font:inherit; text-align:left; cursor:pointer; }
.pcard:hover, .pcard:focus-visible { background:var(--hover); }
.pmini { width:100%; height:52px; display:block; }
.pcard b { font-size:13px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcard small { color:var(--mut); font-size:11.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.plist .empty { color:var(--mut); padding:6px 8px 12px; }
.pgen { padding:0 4px 10px; }
.pgen p { margin:4px 4px 8px; }
.pgen h3:first-child { margin-top:4px; }
.sheet h3 { margin:16px 8px 6px; font-size:14px; font-weight:750; }
.sheet .form { margin:0 4px; }
.sheet label.lbl { display:block; font-size:13px; font-weight:600; color:var(--mut); margin:8px 0 4px; }
.sheet .three { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.sheet textarea { font:12.5px/1.45 var(--f-mono); min-height:120px; }
.sheet .net { padding:8px; border-bottom:1px solid var(--line); font-size:14px; }
.sheet .net b { font-weight:700; }
.sheet .warn { color:var(--err); font-weight:700; font-size:13px; }
.sheet .help p { color:var(--fg); font-size:14px; }
.sheet .lib { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--line); }
.sheet .lib .grow { flex:1; min-width:0; }
.sheet .lib small { display:block; color:var(--mut); }
.inner { max-height:84dvh; overflow-y:auto; }
.legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--mut); margin:14px 8px 0; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
</style>
</head>

<script>
'use strict';
/* ==========================================================================
   ProtoBoardDesigner
   Coordonnées : unités de grille (1 = 2,54 mm), dessinées à U pixels par pas.
   Plan (doc) : { board:{w,h,show}, parts:[…], wires:[{id,c,pts:[[x,y]…], iso?:true}] }
   Les points de fil peuvent être au demi-pas (x.5) pour passer entre deux pastilles ; iso = fil isolé (gaine).
   Vue de dessous : miroir horizontal autour de l'axe de la plaque ; les coordonnées du plan ne changent pas.
   Pièce : { id, type, x, y, r (quarts de tour), f (retournée), label, names[], n, rows, gap }
   ========================================================================== */
const U = 20;
const KEY_DOC = 'protoboard.doc.v1', KEY_VIEW = 'protoboard.view.v1', KEY_LIB = 'protoboard.components.v1', KEY_CIRC = 'protoboard.circuits.v1', KEY_CUR = 'protoboard.current.v1';
/* Synchronisation facultative avec un serveur PocketBase (docs/SYNCHRO.md). localStorage reste la source locale :
   protoboard.doc.v1 (plan en cours), protoboard.components.v1 (Mes composants), protoboard.circuit.<id> (un circuit
   par clé). La vue et le circuit ouvert restent propres à chaque appareil. */
const CIRC_PREFIX = 'protoboard.circuit.';
const store = new PBStore({app:'protoboard', prefix:'protoboard.', sharedAuth:true});
const $ = s => document.querySelector(s);
const svg = $('#svg'), vp = $('#vp'), mir = $('#mir'), world = $('#world'), paper = $('#paper'), paperHalf = $('#paperHalf');
const COLORS = ['#e53935','#212121','#1e88e5','#43a047','#fdd835','#fb8c00','#8e24aa','#f5f5f5'];
const TYPES = {
  power:{f:'#e53935',t:'Alimentation'}, gnd:{f:'#1a1a1a',t:'Masse'}, gpio:{f:'#d4a72c',t:'Signal / GPIO'},
  strap:{f:'#fb8c00',t:'Strapping (démarrage)'}, uart:{f:'#1e88e5',t:'UART'}, avoid:{f:'#8e24aa',t:'À éviter'},
  ctrl:{f:'#9e9e9e',t:'Contrôle'}
};
const POWER_NOTE = {'5V':'Alim 5 V (USB) — entrée ou sortie', '3V3':'Sortie 3,3 V du régulateur', 'GND':'Masse'};
const BUILTIN = {
  hdrM:{name:'Barrette mâle', label:'Mâle'},
  hdrF:{name:'Barrette femelle', label:'Femelle'},
  mod:{name:'Module générique', label:'Module'},
  axial:{name:'Pièce à 2 pattes', label:'R'}
};
/* Pièces à deux pattes, écart réglable : kind -> nom, étiquette, broches, couleur du corps. */
const AXIAL = {
  res:{name:'Résistance', label:'R', pins:['1','2'], fill:'#d9b98a', band:'#8a4b1c', sp:4},
  diode:{name:'Diode', label:'D', pins:['A','K'], fill:'#1c1c1c', band:'#d8d8d8', sp:4},
  cap:{name:'Condensateur céramique', label:'C', pins:['1','2'], fill:'#e0a030', sp:2},
  elec:{name:'Condensateur chimique', label:'C', pins:['+','-'], fill:'#1d3557', band:'#c9d1db', sp:2},
  led:{name:'LED', label:'LED', pins:['A','K'], fill:'#e5484d', sp:2}
};

/* ---------- utilitaires ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clampInt = (v,a,b) => { v = parseInt(v, 10); if (isNaN(v)) v = a; return Math.max(a, Math.min(b, v)); };
const K = (x,y) => x + ',' + y;
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'composant';
let toastTimer;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, err ? 6000 : 3000);
}
function download(name, txt, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type})); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast('Copié dans le presse-papiers.'); }
  catch(e){ toast('Copie impossible : sélectionne le texte à la main.', true); }
}

/* ---------- bibliothèque de composants ---------- */
const LIB = new Map();   // id → { def, src:'file'|'local', geo }
function pinType(name, t){
  if (t && TYPES[t]) return t;
  const n = String(name).trim().toUpperCase();
  if (/^(GND|VSS|0V|G|MASSE)$/.test(n)) return 'gnd';
  if (/^(VCC|VIN|VDD|5V|3V3|3\.3V|3V|V\+|\+5V|\+3V3)$/.test(n)) return 'power';
  return 'gpio';
}
function parsePin(s){ const i = String(s).lastIndexOf(':'); return i > 0 ? {name:s.slice(0,i), type:s.slice(i+1)} : {name:String(s)}; }
/* Compile la définition d'un fichier de composant en géométrie (broches, corps, décor). */
function compile(def){
  const pins = [];
  (def.columns || []).forEach(c => (c.pins || []).forEach((s,i) => pins.push({...parsePin(s), x:c.x, y:(c.y || 0) + i, dir:c.labels})));
  (def.rows || []).forEach(r => (r.pins || []).forEach((s,i) => pins.push({...parsePin(s), x:(r.x || 0) + i, y:r.y, dir:r.labels})));
  (def.pins || []).forEach(p => pins.push({name:p.name, type:p.type, x:p.x, y:p.y, dir:p.label}));
  if (!pins.length) throw new Error('aucune broche');
  let body = def.body;
  if (!body){
    const xs = pins.map(p => p.x), ys = pins.map(p => p.y);
    body = {x0:Math.min(...xs) - .8, y0:Math.min(...ys) - .8, x1:Math.max(...xs) + .8, y1:Math.max(...ys) + .8};
  }

function componentFile(def){

/* ---------- géométrie des pièces ---------- */

    deco.push({shape:'rect', x:x0, y:-.45, w:bw, h:.9, fill:a.fill});
    if (a.band) deco.push({shape:'rect', x:p.kind === 'res' ? x0 + bw*.2 : x0 + bw - Math.min(.3, bw*.25), y:-.45, w:Math.min(.3, bw*.25), h:.9, fill:a.band});

    if (rows === 1){

      g = {pins, body:{x0:-.7, x1:n-.3, y0:-.7, y1:2.8}};
    } else {
      for (let i = 0; i < n; i++) pins.push({name:String(i+1), type:'gpio', x:0, y:i, d:[1,0]});
      for (let i = 0; i < n; i++) pins.push({name:String(n+i+1), type:'gpio', x:gap, y:i, d:[-1,0]});
      g = {pins, body:{x0:-.8, x1:gap+.8, y0:-.8, y1:n-.2}};

/* ---------- réseaux (union-find sur les points de soudure) ---------- */
function find(k){ let r = k; while (parent.has(r) && parent.get(r) !== r) r = parent.get(r); return r; }

    case 'can': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#cfd4da" stroke="#8a9099"/>`;
    case 'antenna': {

      for (let i = 0, up = true; x + U*.4 + (i+1)*step <= x + w - U*.3; i++, up = !up) p += ` h${step} v${up ? -h*.45 : h*.45}`;
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#22324d"/><path d="${p}" stroke="#d4a72c" stroke-width="1.5" fill="none"/>`;
    }
    case 'chip': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#1c1c1c" stroke="#555"/>`;
    case 'screen': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#0a0f1c" stroke="#3a4a6a"/>`;
    case 'coin': return `<circle cx="${x + w/2}" cy="${y + h/2}" r="${Math.min(w,h)/2}" fill="#c3c8cf" stroke="#7a7f87"/><circle cx="${x + w/2}" cy="${y + h/2}" r="${Math.min(w,h)/2.6}" fill="none" stroke="#9aa0a8"/>`;

function partSVG(p, g, isSel){

function freeSpot(p, x0, y0){
  const taken = doc.parts.map(q => bboxW(q, geo(q)));
  const rel = bboxW(Object.assign({}, p, {x:0, y:0}), geo(p));
  const clash = (x, y) => taken.some(t => rel.x0 + x < t.x1 + 1 && rel.x1 + x + 1 > t.x0 && rel.y0 + y < t.y1 + 1 && rel.y1 + y + 1 > t.y0);
  if (!clash(x0, y0)) return [x0, y0];
  const offs = [];
  for (let dx = -40; dx <= 40; dx++) for (let dy = -40; dy <= 40; dy++) offs.push([dx, dy]);
  offs.sort((a, b) => (a[0]*a[0] + a[1]*a[1]) - (b[0]*b[0] + b[1]*b[1]));
  const hit = offs.find(([dx, dy]) => !clash(x0 + dx, y0 + dy));
  return hit ? [x0 + hit[0], y0 + hit[1]] : [x0, y0];
}
function addPart(type, extra){
  const r = svg.getBoundingClientRect(), c = toWorld(r.left + r.width/2, r.top + r.height/2);
  const label = BUILTIN[type] ? BUILTIN[type].label : (LIB.get(type).def.label || LIB.get(type).def.name);
  const p = Object.assign({id:uid(), type, x:0, y:0, r:0, f:false, label, names:[]}, extra || {});
  const b = geo(p).body;
  const [x, y] = freeSpot(p, Math.round(c.x/U - (b.x0+b.x1)/2), Math.round(c.y/U - (b.y0+b.y1)/2));
  p.x = x; p.y = y;
  doc.parts.push(p); closeDlg(); setMode('sel'); sel = {t:'part', id:p.id}; commit();
}

/* ---------- panneau contextuel (au-dessus des modes) ---------- */
const swatches = active => '<div class="rowb">' + COLORS.map(c => `<button class="swatch ${c === active ? 'on' : ''}" style="background:${c}" data-a="color" data-v="${c}" aria-label="Couleur ${c}"></button>`).join('') + '</div>';
function updateCtx(){
  let h = '';
  if (mode === 'wire'){
    h += swatches(wireColor) + `<div class="rowb"><button class="chip ${ortho ? 'on' : ''}" data-a="ortho">⌐ Angles droits</button><button class="chip ${half ? 'on' : ''}" data-a="half" title="Accrocher entre les pastilles">½ Entre pastilles</button><button class="chip ${wireIso ? 'on' : ''}" data-a="iso" title="Fil gainé, par-dessus les soudures">Fil isolé</button></div>`;
    if (cur) h += `<div class="rowb"><button class="btn" data-a="pop" title="Retirer le dernier point">⌫</button><button class="btn primary" data-a="finish">✓ Terminer</button><button class="btn" data-a="cancel">✕</button></div>`;
    h += `<div class="info">${cur ? `${cur.pts.length} point(s) — touche les coudes, puis une broche ou un fil pour terminer (ou retouche le dernier point).` : 'Touche un point de départ : une broche ou un trou.'}</div>`;
  } else if (isMulti()){
    const np = sel.parts.length, nw = sel.wires.length, parts = sel.parts.map(getPart).filter(Boolean), all = np && parts.every(p => p.lk);
    h += `<div class="info"><b>Sélection multiple</b> — ${np} pièce${np > 1 ? 's' : ''}, ${nw} fil${nw > 1 ? 's' : ''} · touche pour ajouter ou retirer, trace un rectangle sur le vide, glisse un élément pour tout déplacer</div>
      <div class="rowb"><button class="btn" data-a="glock" ${np ? '' : 'disabled'} title="Verrouiller / déverrouiller (L)">${all ? '🔒' : '🔓'}</button><button class="btn" data-a="gdup" ${np + nw ? '' : 'disabled'} title="Dupliquer">⧉</button><button class="btn" data-a="gdel" ${np + nw ? '' : 'disabled'} title="Supprimer">🗑</button><button class="btn" data-a="gall">Tout</button><button class="btn" data-a="gquit">✕ Terminer</button></div>`;
  } else if (sel && sel.t === 'part'){
    const p = getPart(sel.id);
    if (p){ const lk = p.lk ? 'disabled' : '';
      h += `<div class="info"><b>${esc(p.label)}</b> — ${esc(partName(p))}${p.lk ? ' · verrouillée' : ''}</div>
      <div class="rowb"><button class="btn ${p.lk ? 'on' : ''}" data-a="lock" title="${p.lk ? 'Déverrouiller' : 'Verrouiller : ni déplacement, ni rotation, ni suppression'} (L)">${p.lk ? '🔒' : '🔓'}</button><button class="btn" data-a="rot" title="Pivoter (R)" ${lk}>⟳</button><button class="btn" data-a="flip" title="Retourner (F)" ${lk}>⇋</button><button class="btn" data-a="edit">✎ Modifier</button><button class="btn" data-a="dup" title="Dupliquer">⧉</button><button class="btn" data-a="delpart" title="Supprimer" ${lk}>🗑</button><button class="btn" data-a="multi" title="Sélectionner plusieurs éléments (ou Maj+clic)">⬚ Plusieurs</button></div>`; }
  } else if (sel && sel.t === 'wire'){
    const w = getWire(sel.id);
    if (w){
      const pins = netPins(netKeys(K(...w.pts[0])));
      h += swatches(w.c) + `<div class="rowb"><button class="chip ${w.iso ? 'on' : ''}" data-a="iso" title="Fil gainé, par-dessus les soudures">Fil isolé</button><button class="chip ${half ? 'on' : ''}" data-a="half" title="Déplacer les points entre les pastilles">½ Entre pastilles</button><button class="btn" data-a="delwire">🗑 Supprimer</button></div>`;
      if (sel.vi != null && sel.vi < w.pts.length) h += `<div class="rowb"><button class="btn" data-a="delpt" ${w.pts.length <= 2 ? 'disabled' : ''}>⌫ Retirer le point</button></div>`;
      const real = pins.filter(e => !e.q.hole);
      h += `<div class="info">Réseau : ${real.length ? real.map(e => `<b>${pinTitle(e)}</b>`).join(' ↔ ') : 'aucune broche'} · glisse un point pour le déplacer, touche le fil pour en ajouter un</div>`;
      netWarnings(pins).forEach(t => h += `<div class="warn">${t}</div>`);
    }
  } else if (sel && sel.t === 'pin'){
    const here = pinMap.get(sel.key) || [], pins = netPins(netKeys(sel.key));
    here.forEach(e => {
      const def = LIB.get(e.p.type), note = e.q.hole ? 'trou de breadboard (relié à sa colonne ou à son rail)' : (def && def.def.notes && def.def.notes[e.q.name]) || POWER_NOTE[e.q.name] || '';
      h += `<div class="info"><b>${pinTitle(e)}</b> — ${(TYPES[e.q.type] || TYPES.gpio).t}${note ? ' — ' + esc(note) : ''}</div>`;
    });
    const others = pins.filter(e => K(e.x,e.y) !== sel.key && !e.q.hole);
    h += `<div class="info">${others.length ? 'Relié à : ' + others.map(e => `<b>${pinTitle(e)}</b>`).join(', ') : 'Aucune connexion'}</div>`;
    netWarnings(pins).forEach(t => h += `<div class="warn">${t}</div>`);
  } else h += `<div class="info">Touche une pièce, une broche ou un fil · glisse pour déplacer · pince pour zoomer</div><div class="rowb"><button class="btn" data-a="multi" title="Sélectionner plusieurs éléments (ou Maj+clic, Maj+glisser)">⬚ Sélection multiple</button></div>`;
  $('#ctx').innerHTML = h;
}
$('#ctx').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const id = sel && sel.id;
  switch (b.dataset.a){
    case 'color':
      wireColor = b.dataset.v;
      if (sel && sel.t === 'wire' && getWire(id)){ getWire(id).c = wireColor; commit(); } else { render(); updateCtx(); }
      break;
    case 'save': saveCmd(); break;
    case 'load': sheetLoad(); break;
    case 'delpt': { const wr = getWire(id); if (wr) removeWirePoint(wr, sel.vi); break; }
    case 'ortho': ortho = !ortho; updateCtx(); break;
    case 'half': half = !half; applyMirror(); updateCtx(); break;
    case 'iso':
      if (sel && sel.t === 'wire' && getWire(id)){ const w = getWire(id); if (w.iso) delete w.iso; else w.iso = true; commit(); }
      else { wireIso = !wireIso; render(); updateCtx(); }
      break;
    case 'pop': if (cur){ cur.pts.pop(); if (!cur.pts.length) cur = null; render(); updateCtx(); } break;
    case 'finish': finishWire(); break;
    case 'cancel': cur = null; hover = null; render(); updateCtx(); break;
    case 'rot': transformPart(id, p => p.r = (p.r + 1) % 4); break;
    case 'flip': transformPart(id, p => p.f = !p.f); break;
    case 'edit': sheetEdit(id); break;
    case 'multi': sel = {t:'multi', parts: sel && sel.t === 'part' ? [sel.id] : [], wires: []}; render(); updateCtx(); break;
    case 'gquit': sel = null; render(); updateCtx(); break;
    case 'gall': sel = {t:'multi', parts: doc.parts.map(p => p.id), wires: doc.wires.map(w => w.id)}; render(); updateCtx(); break;
    case 'glock': groupLock(); break;
    case 'gdup': groupDup(); break;
    case 'gdel': groupDelete(); break;
    case 'lock': { const p = getPart(id); if (p){ if (p.lk) delete p.lk; else p.lk = true; commit(); } break; }
    case 'dup': { const p = getPart(id), bb = bboxW(p, geo(p)), q = JSON.parse(JSON.stringify(p));
      q.id = uid(); delete q.lk; q.x += Math.ceil(bb.x1 - bb.x0) + 1; doc.parts.push(q); sel = {t:'part', id:q.id}; commit(); break; }
    case 'delpart': if (getPart(id) && getPart(id).lk){ toast('Pièce verrouillée.'); break; } doc.parts = doc.parts.filter(p => p.id !== id); sel = null; commit(); break;
    case 'delwire': doc.wires = doc.wires.filter(w => w.id !== id); sel = null; commit(); break;
  }
});

const KEY_PICK = 'protoboard.pick', KEY_RECENT = 'protoboard.recent';
const PK_OPEN_DEF = new Set(['recent', 'Cartes']);   // groupes ouverts par défaut (si rien n'a été mémorisé)

const ICON_OF = {'Cartes':'board', 'Capteurs':'gauge', 'Écrans':'screen', 'Moteurs':'motor', 'Radio & GPS':'antenna', 'Interfaces':'exchange', 'Modules':'chip', 'Puissance':'bolt', 'Alimentation':'battery', 'Commandes':'switch', 'Composants':'resistor', 'Breadboards':'grid', 'Mes composants':'folder'};
const svgIco = k => `<svg class="gico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k] || ICO.dots}</svg>`;
const readJ = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } };
const catOf = e => e.src === 'local' ? 'Mes composants' : (e.def.category || 'Divers');
const fold = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function searchText(e){
  if (e.st) return e.st;
  const names = e.geo.pins.map(p => p.name.toUpperCase()), has = re => names.some(n => re.test(n)), auto = [];
  if (has(/^SDA/) && has(/^SC[LK]/) && !has(/^(CS|DC|A0|RS)$/)) auto.push('i2c');   // les TFT « SPI » nomment aussi SDA/SCL
  if (has(/^(MOSI|SDI|DIN)$/) || has(/^(MISO|SDO)$/) || has(/^(SCK|CLK|SCLK)$/) && has(/^(CS|SS|NSS|CE)/)) auto.push('spi');
  if (has(/^(TX|TXD)/) && has(/^(RX|RXD)/)) auto.push('uart serie');
  if (has(/^(WS|LRC|LRCK)$/) && has(/^(SD|DOUT|DIN)$/)) auto.push('i2s');
  if (has(/^(AO|A0|AOUT|OUT|VRX|VRY|SIG)$/)) auto.push('analogique');
  if (has(/PWM/)) auto.push('pwm');
  const d = e.def;
  return e.st = fold([d.name, d.label, d.description, catOf(e), ...(d.tags || []), ...auto, ...names].join(' '));
}
/* Mini-empreinte : corps (forme, couleur), décorations, broches colorées par type. */
function miniSVG(e){
  const g = e.geo, b = g.body, pts = g.pins;
  const xs = [b.x0, b.x1, ...pts.map(p => p.x)], ys = [b.y0, b.y1, ...pts.map(p => p.y)];
  const x0 = Math.min(...xs) - .6, y0 = Math.min(...ys) - .6, W = Math.max(...xs) - x0 + .6, H = Math.max(...ys) - y0 + .6;
  const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  let s = `<svg class="pmini" viewBox="${x0} ${y0} ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">`;
  s += `<rect x="${b.x0}" y="${b.y0}" width="${bw}" height="${bh}" rx="${g.round ? Math.min(bw, bh) / 2 : .25}" fill="${esc(g.color)}" fill-opacity=".85"/>`;
  (g.deco || []).forEach(d => { if (d.x !== undefined) s += `<rect x="${d.x}" y="${d.y}" width="${d.w || .5}" height="${d.h || .5}" rx=".12" fill="${esc(d.fill || '#0004')}"/>`; });
  pts.forEach(p => { s += `<circle cx="${p.x}" cy="${p.y}" r=".32" fill="${(TYPES[p.type] || TYPES.gpio).f}" stroke="#0007" stroke-width=".08"/>`; });
  return s + '</svg>';
}
function pickCard(id, e){
  const d = e.def, n = e.geo.pins.length;
  const sub = d.description || `${n} broche${n > 1 ? 's' : ''}`;
  return `<button class="pcard" data-a="add" data-id="${esc(id)}">${miniSVG(e)}<b>${esc(d.name)}</b><small>${esc(sub)}</small></button>`;
}
/* Groupes : Récents, catégories (dans l'ordre), puis les deux générateurs. */
function pickGroups(){
  const counts = new Map();
  LIB.forEach(e => { const c = catOf(e); counts.set(c, (counts.get(c) || 0) + 1); });
  const cats = [...CAT_ORDER.filter(c => counts.has(c)), ...[...counts.keys()].filter(c => !CAT_ORDER.includes(c) && c !== 'Mes composants').sort(), ...(counts.has('Mes composants') ? ['Mes composants'] : [])];
  return [
    {id:'recent', name:'Récents', icon:'clock'},
    ...cats.map(c => ({id:c, name:c, icon:ICON_OF[c] || 'dots', cat:true})),
    {id:'Connecteurs', name:'Connecteurs', icon:'connector', gen:true, kw:'connecteur dupont barrette male femelle picot broche'},
    {id:'Générique', name:'Générique', icon:'plus', gen:true, kw:'generique generer piece resistance condensateur diode module pattes'}
  ];
}
let pkSearchClosed = new Set(), pkLastQ = '';   // groupes repliés pendant une recherche (oubliés à chaque nouvelle recherche)
function pickData(){
  const q = fold(($('#pkQ') ? $('#pkQ').value : '').trim()), words = q ? q.split(/\s+/) : null;
  if (q !== pkLastQ){ pkSearchClosed = new Set(); pkLastQ = q; }
  const all = [...LIB.entries()].sort((a, b) => a[1].def.name.localeCompare(b[1].def.name, 'fr'));
  const rec = readJ(KEY_RECENT, []).filter(id => LIB.has(id)).map(id => [id, LIB.get(id)]);
  const st = readJ(KEY_PICK, {}), open = st.open || {};
  const groups = pickGroups().map(g => {
    let items = g.id === 'recent' ? rec : (g.cat ? all.filter(([, e]) => catOf(e) === g.id) : []);
    if (words){
      items = items.filter(([, e]) => words.every(w => searchText(e).includes(w)));
      g.show = items.length > 0 || (!!g.kw && words.every(w => fold(g.kw).includes(w)));
      g.isOpen = g.show && !pkSearchClosed.has(g.id);
    } else {
      g.show = true;
      g.isOpen = g.id in open ? !!open[g.id] : PK_OPEN_DEF.has(g.id);
    }
    g.items = items; return g;
  });
  return {groups, q};
}

function pickBody(){
  const {groups, q} = pickData();
  const shown = groups.filter(g => g.show);
  if (!shown.length) return `<div class="empty">Rien pour « ${esc(q)} ». Essaie Connecteurs ou Générique pour les barrettes, pièces à 2 pattes et modules génériques.</div>`;
  return shown.map(g => {
    let body = '';
    if (g.isOpen){
      if (g.gen) body = g.id === 'Connecteurs' ? connectorsHTML() : genericHTML();
      else if (g.items.length) body = `<div class="pgrid">${g.items.map(([id, e]) => pickCard(id, e)).join('')}</div>`;
      else body = `<div class="empty">${g.id === 'recent' ? 'Les composants que tu ajoutes apparaîtront ici.' : 'Aucun composant ici.'}</div>`;
    }
    const count = g.gen ? '' : `<small>${g.items.length}</small>`;
    return `<section class="pgrp">
      <button class="pghd" data-a="grp" data-g="${esc(g.id)}" aria-expanded="${g.isOpen}">${svgIco(g.icon)}<b>${esc(g.name)}</b>${count}<span class="chev" aria-hidden="true">${g.isOpen ? '▾' : '▸'}</span></button>${body}</section>`;
  }).join('');
}

function sheetAdd(){
  const old = $('#pkQ'); if (old) old.remove();   // la feuille précédente (fermée) est encore dans le DOM
  const h = `<h2>Ajouter</h2><div id="pkHead"><input type="search" id="pkQ" placeholder="Filtrer : esp32, i2c, moteur, relais…" autocomplete="off" enterkeyhint="search"></div><div class="plist" id="pkList">${pickBody()}</div>`;

/* Module générique → composant enregistré dans le navigateur, et fichier .js à placer dans le dépôt. */
function moduleToComponent(p){
  const g = geo(p), names = g.pins.map(q => q.name + (q.type === 'power' || q.type === 'gnd' ? ':' + q.type : ''));
  const n = p.n || 4;
  let id = slug(p.label); while (LIB.has(id) && LIB.get(id).src === 'file') id += '-perso';
  const def = {id, name:p.label, label:p.label, category:'Mes composants', description:(p.rows === 2 ? '2×' : '1×') + n + ' broches', color:'#2e6b34', body:g.body};
  if ((p.rows || 1) === 1) def.rows = [{y:0, pins:names}];
  else def.columns = [{x:0, pins:names.slice(0, n)}, {x:p.gap || 5, pins:names.slice(n)}];
  register(def, 'local'); saveLocalLib();
  p.type = id; p.names = []; delete p.n; delete p.rows; delete p.gap;
  commit(); sheetComponentFile(id);
}

function nets(){

/* ---------- bibliothèque de circuits (localStorage, enregistrement à la demande) ---------- */
const fmtDate = t => new Date(t).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'});
function readCircuits(){
  const out = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (!k || !k.startsWith(CIRC_PREFIX)) continue;
    try { const c = JSON.parse(localStorage.getItem(k)); if (c && c.id && c.name && validDoc(c.doc)) out.push(c); } catch(e){}
  }
  return out;
}
function putCircuit(rec){
  try { store.set('circuit.' + rec.id, rec); return true; }
  catch(e){ toast('Enregistrement impossible : le stockage du navigateur est plein.', true); return false; }
}
function delCircuit(id){ try { store.remove('circuit.' + id); } catch(e){} }
/* Ancienne bibliothèque (une seule clé protoboard.circuits.v1) : un circuit par clé, pour pouvoir les synchroniser. */
function migrateCircuits(){
  try {
    const old = JSON.parse(localStorage.getItem(KEY_CIRC));
    if (Array.isArray(old)){ old.forEach(c => { if (c && c.id && c.name && validDoc(c.doc)) store.set('circuit.' + c.id, c); }); }
    if (old !== null) localStorage.removeItem(KEY_CIRC);
  } catch(e){}
}
function setCircuit(c){
  circuit = c; savedJSON = c ? JSON.stringify(doc) : '';
  try { c ? localStorage.setItem(KEY_CUR, JSON.stringify(c)) : localStorage.removeItem(KEY_CUR); } catch(e){}
  updateTitle();
}
const isDirty = () => JSON.stringify(doc) !== savedJSON;
const hasContent = () => doc.parts.length || doc.wires.length;
/* Sous le titre : le nom du circuit, avec • quand il a changé depuis son enregistrement. */
function updateTitle(){
  const el = $('#subtitle');
  if (circuit){ el.textContent = circuit.name + (isDirty() ? ' •' : ''); el.title = isDirty() ? 'Modifications non enregistrées' : 'Enregistré'; }
  else { el.textContent = hasContent() ? 'Circuit sans nom' : 'Plaque à pastilles · pas 2,54 mm'; el.title = ''; }

function saveCircuit(name, id){
  const rec = {id:id || uid(), name, t:Date.now(), doc:JSON.parse(JSON.stringify(doc)), components:usedComponents()};
  if (!putCircuit(rec)) return false;
  setCircuit({id:rec.id, name}); return true;
}
/* Remplace le plan par un plan lu (import ou bibliothèque) et ajoute à « Mes composants » ceux qui manquent. */
function applyDoc(d, comps){
  let added = 0;
  Object.values(comps || {}).forEach(c => { if (c && c.id && !LIB.has(slug(c.id))){ try { register(c, 'local'); added++; } catch(e){} } });
  if (added) saveLocalLib();
  doc = {board:d.board || {w:24,h:30,show:true}, parts:d.parts, wires:d.wires};
  sel = null; cur = null; commit(); fit();
  return added;
}

/* Image PNG de la vue actuelle (dessus ou dessous), sur fond blanc, avec repères de colonnes (A, B…) et de
   lignes (1, 2…) : un guide pour souder. Fabriquée à partir du même dessin que l'écran, sans sélection. */
const colLetter = i => { let r = ''; for (i++; i > 0; i = Math.floor((i - 1)/26)) r = String.fromCharCode(65 + (i - 1) % 26) + r; return r; };
function exportPNG(){
  const B = doc.board, W = B.w;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a,b,c,d) => { x0 = Math.min(x0,a); y0 = Math.min(y0,b); x1 = Math.max(x1,c); y1 = Math.max(y1,d); };
  if (B.show) add(-.5, -.5, W - .5, B.h - .5);
  doc.parts.forEach(p => { const b = bboxW(p, geo(p)); add(b.x0, b.y0, b.x1, b.y1 + 1.5); });
  doc.wires.forEach(w => w.pts.forEach(([x,y]) => add(x,y,x,y)));
  if (!isFinite(x0)){ toast('Rien à exporter.', true); return; }
  if (bottom){ const a = W - 1 - x1, b = W - 1 - x0; x0 = a; x1 = b; }
  const L = 2.2, T = 3, R = 1.2, Bm = 2.2;
  const vx = (x0 - L)*U, vy = (y0 - T)*U, vw = (x1 - x0 + L + R)*U, vh = (y1 - y0 + T + Bm)*U;
  const sc = Math.min(2, 4000/Math.max(vw, vh));
  const gx = i => (bottom ? W - 1 - i : i)*U;
  let ov = `<text x="${vx + U*.6}" y="${vy + U*1.1}" font-size="11" font-weight="700" fill="#111">ProtoBoardDesigner — vue de ${bottom ? 'dessous (miroir)' : 'dessus'}</text>`;
  if (B.show){
    for (let i = 0; i < W; i++) ov += `<text x="${gx(i)}" y="${-1.15*U}" font-size="7" fill="#555" text-anchor="middle" dominant-baseline="central">${colLetter(i)}</text>`;
    for (let j = 0; j < B.h; j++) ov += `<text x="${-1.25*U}" y="${j*U}" font-size="7" fill="#555" text-anchor="middle" dominant-baseline="central">${j + 1}</text>`;
  }
  ov += `<text x="${vx + U*.6}" y="${vy + vh - U*.7}" font-size="7.5" fill="#555">Trait fin : fil nu soudé de pastille en pastille · trait épais : fil isolé · pastille cerclée : couleur = type de broche</text>`;
  const css = `text{font-family:system-ui,Arial,sans-serif}.pb-board{fill:${bottom ? '#e2c486' : '#f3e3bd'};stroke:#c9a96a}.pb-pad,.pb-copper{fill:#dca866;stroke:#b07a35}.pb-hole{fill:#5a4630}`
    + `.pb-line{stroke:#ddd}.pb-dot{fill:#bbb}.pb-half{fill:none}.pb-sel{stroke:none}.pb-glow{stroke:none}.pb-in{fill:#fff;fill-opacity:.92}.pb-title{fill:#fff;fill-opacity:.55}`
    + `.pb-out{fill:#111;stroke:#fff;stroke-width:2.5px;paint-order:stroke}`;
  const mirror = bottom ? `translate(${mirX()},0) scale(-1,1)` : '';
  const out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} ${vy} ${vw} ${vh}" width="${Math.round(vw*sc)}" height="${Math.round(vh*sc)}">`
    + `<style>${css}</style><defs>${svg.querySelector('defs').innerHTML}</defs><rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="#fff"/>`
    + `<g ${mirror ? `transform="${mirror}"` : ''}>${sceneHTML(true)}</g>${ov}</svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = Math.round(vw*sc); c.height = Math.round(vh*sc);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => { if (!b){ toast('Export de l\'image impossible.', true); return; } download(`protoboard-${bottom ? 'dessous' : 'dessus'}.png`, b, 'image/png'); toast('Image enregistrée.'); }, 'image/png');
  };
  img.onerror = () => toast('Export de l\'image impossible.', true);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out);
}

  const txt = exportText();

  });
}

/* ---------- circuit imprimé simple face (export Gerber + Excellon pour la gravure à l'anglaise) ----------
   Composants traversants côté dessus, cuivre dessous. Fils normaux = pistes de cuivre ; fils
   « isolés » = straps (fils soudés côté composants), avec un trou à chaque bout. Les fichiers sont
   en vue de dessus (convention Gerber) : le logiciel de FAO retourne la couche dessous. */
const PITCH = 2.54;
const KEY_PCB = 'protoboard.pcb.v1';   // réglages, propres à ce navigateur
const PCB_DEF = {trace:0.8, pad:1.8, drill:1.0, clear:0.4};
function pcbOpts(){ try { return Object.assign({}, PCB_DEF, JSON.parse(localStorage.getItem(KEY_PCB)) || {}); } catch(e){ return Object.assign({}, PCB_DEF); } }
function savePcbOpts(o){ try { localStorage.setItem(KEY_PCB, JSON.stringify(o)); } catch(e){} }

/* Distance point–segment et segment–segment (unités de la grille). */
function dPtSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l = dx*dx + dy*dy;
  const t = l ? Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / l)) : 0;
  return Math.hypot(px - ax - t*dx, py - ay - t*dy);
}
function dSegSeg(a, b){
  const [ax,ay,bx,by] = a, [cx,cy,dx,dy] = b;
  const o = (px,py,qx,qy,rx,ry) => Math.sign((qx-px)*(ry-py) - (qy-py)*(rx-px));
  if (o(ax,ay,bx,by,cx,cy) * o(ax,ay,bx,by,dx,dy) < 0 && o(cx,cy,dx,dy,ax,ay) * o(cx,cy,dx,dy,bx,by) < 0) return 0;
  return Math.min(dPtSeg(ax,ay,cx,cy,dx,dy), dPtSeg(bx,by,cx,cy,dx,dy), dPtSeg(cx,cy,ax,ay,bx,by), dPtSeg(dx,dy,ax,ay,bx,by));
}

/* Modèle du circuit : pastilles (broches + trous des straps), pistes, straps, problèmes. */
function pcbModel(o){
  buildIndex();
  const net = (x,y) => find(K(x,y));
  const pads = new Map();   // "x,y" → {x, y, net, name}
  const traces = [], straps = [], issues = [];
  pinMap.forEach((list, k) => { const e = list.find(x => !x.q.hole); if (e) pads.set(k, {x:e.x, y:e.y, net:net(e.x, e.y), name:`${e.p.label} ${e.q.name}`}); });
  doc.parts.filter(p => geo(p).style === 'hole').forEach(p => issues.push({x:p.x, y:p.y, msg:`${p.label} : une breadboard n’a pas sa place sur un circuit imprimé (ses liaisons internes ne sont pas gravées).`}));
  doc.wires.forEach(w => {
    if (w.pts.length < 2) return;
    const n = net(...w.pts[0]);
    if (w.iso){
      const a = w.pts[0], b = w.pts[w.pts.length - 1];
      straps.push({w, a, b, net:n});
      [a, b].forEach(([x,y]) => { const k = K(x,y); if (!pads.has(k)) pads.set(k, {x, y, net:n, name:'strap'}); });
    } else {
      for (let i = 1; i < w.pts.length; i++){
        const [ax,ay] = w.pts[i-1], [bx,by] = w.pts[i];
        if (ax !== bx || ay !== by) traces.push({s:[ax,ay,bx,by], net:n, w});
      }
    }
  });
  // Un fil ne peut s'accrocher qu'aux extrémités d'un strap (c'est là que sont les trous)
  doc.wires.forEach(w => { if (!w.iso) return;
    w.pts.slice(1, -1).forEach(([x,y]) => { const k = K(x,y);
      if (doc.wires.some(v => v !== w && v.pts.some(p => K(...p) === k)) || pinMap.has(k))
        issues.push({x, y, msg:'Connexion au milieu d’un strap : le strap n’a de trous qu’à ses extrémités.'}); }); });
  const P = PITCH, tw = o.trace / P, pr = o.pad / 2 / P, cl = o.clear / P;
  const padList = [...pads.values()];
  traces.forEach(t => padList.forEach(p => {
    if (p.net === t.net) return;
    const d = dPtSeg(p.x, p.y, ...t.s);
    if (d < tw/2 + pr + cl) issues.push({x:p.x, y:p.y, msg:d < pr ? `Une piste passe sur ${p.name} (court-circuit).` : `Piste trop près de ${p.name}.`});
  }));
  for (let i = 0; i < traces.length; i++) for (let j = i + 1; j < traces.length; j++){
    const a = traces[i], b = traces[j]; if (a.net === b.net) continue;
    const d = dSegSeg(a.s, b.s);
    if (d < tw + cl){
      const [x,y] = d === 0 ? [(a.s[0]+a.s[2]+b.s[0]+b.s[2])/4, (a.s[1]+a.s[3]+b.s[1]+b.s[3])/4] : [(a.s[0]+a.s[2])/2, (a.s[1]+a.s[3])/2];
      issues.push({x, y, msg:d === 0 ? 'Deux pistes de réseaux différents se croisent (court-circuit) : passer l’une en strap (fil isolé).' : 'Deux pistes de réseaux différents trop proches.'});
    }
  }
  for (let i = 0; i < padList.length; i++) for (let j = i + 1; j < padList.length; j++){
    const a = padList[i], b = padList[j];
    if (a.net !== b.net && Math.hypot(a.x - b.x, a.y - b.y) < 2*pr + cl) issues.push({x:a.x, y:a.y, msg:`Pastilles trop proches : ${a.name} / ${b.name} (réduire le diamètre des pastilles).`});
  }
  const B = doc.board, out = q => q.x < 0 || q.y < 0 || q.x > B.w - 1 || q.y > B.h - 1;
  padList.forEach(p => { if (out(p)) issues.push({x:p.x, y:p.y, msg:`${p.name} est hors de la plaque.`}); });
  traces.forEach(t => { const [ax,ay,bx,by] = t.s; if (out({x:ax,y:ay}) || out({x:bx,y:by})) issues.push({x:ax, y:ay, msg:'Une piste sort de la plaque.'}); });
  return {pads:padList, traces, straps, issues};
}

/* Coordonnées en mm, vue de dessus, origine en bas à gauche du contour (demi-pas autour des trous). */
const mmX = x => (x + .5) * PITCH;
const mmY = y => (doc.board.h - .5 - y) * PITCH;
const g6 = v => Math.round(v * 1e6);   // format Gerber 4.6 en mm

function gerberCopper(M, o, name){
  const L = ['G04 ProtoBoardDesigner - ' + name + '*', '%TF.GenerationSoftware,lstux,ProtoBoardDesigner,1*%', '%TF.FileFunction,Copper,L1,Bot*%', '%TF.FilePolarity,Positive*%',
    '%FSLAX46Y46*%', '%MOMM*%', '%LPD*%', `%ADD10C,${o.trace.toFixed(3)}*%`, `%ADD11C,${o.pad.toFixed(3)}*%`, 'G01*', 'D10*'];
  M.traces.forEach(t => { const [ax,ay,bx,by] = t.s; L.push(`X${g6(mmX(ax))}Y${g6(mmY(ay))}D02*`, `X${g6(mmX(bx))}Y${g6(mmY(by))}D01*`); });
  L.push('D11*'); M.pads.forEach(p => L.push(`X${g6(mmX(p.x))}Y${g6(mmY(p.y))}D03*`));
  L.push('M02*'); return L.join('\n') + '\n';
}
function gerberOutline(name){
  const W = doc.board.w * PITCH, H = doc.board.h * PITCH;
  return ['G04 ProtoBoardDesigner - ' + name + ' contour*', '%TF.GenerationSoftware,lstux,ProtoBoardDesigner,1*%', '%TF.FileFunction,Profile,NP*%',
    '%FSLAX46Y46*%', '%MOMM*%', '%LPD*%', '%ADD10C,0.100*%', 'G01*', 'D10*',
    'X0Y0D02*', `X${g6(W)}Y0D01*`, `X${g6(W)}Y${g6(H)}D01*`, `X0Y${g6(H)}D01*`, 'X0Y0D01*', 'M02*'].join('\n') + '\n';
}
function excellon(M, o){
  const f = v => v.toFixed(3);
  return ['M48', '; ProtoBoardDesigner', 'FMAT,2', 'METRIC,TZ', `T1C${f(o.drill)}`, '%', 'G90', 'G05', 'T1',
    ...M.pads.map(p => `X${f(mmX(p.x))}Y${f(mmY(p.y))}`), 'T0', 'M30'].join('\n') + '\n';
}
function strapList(M){
  const where = ([x,y]) => { const e = (pinMap.get(K(x,y)) || [])[0]; return e ? `${e.p.label} ${e.q.name}` : `trou ${String.fromCharCode(65 + Math.min(25, x))}${y + 1}`; };
  return M.straps.map((s,i) => `${i+1}. ${where(s.a)}  ->  ${where(s.b)}  (${(s.w.pts.reduce((l,p,j) => j ? l + Math.hypot(p[0]-s.w.pts[j-1][0], p[1]-s.w.pts[j-1][1]) : 0, 0) * PITCH / 10).toFixed(1)} cm)`).join('\n');
}

/* ZIP sans compression (format « stored ») : assez pour quelques fichiers texte. */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipFiles(files){   // [{name, text}] → Blob
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,dt,2],[12,dd,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,name.length,2],[28,0,2]]
      .forEach(([o,v,n]) => n === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    const c = new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,dt,2],[14,dd,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,name.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]]
      .forEach(([o,v,n]) => n === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
    parts.push(h, name, data); central.push(c, name); off += 30 + name.length + data.length;
  });
  const size = central.reduce((s, b) => s + b.byteLength, 0), e = new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,files.length,2],[10,files.length,2],[12,size,4],[16,off,4],[20,0,2]]
    .forEach(([o,v,n]) => n === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true));
  return new Blob([...parts, ...central, e], {type:'application/zip'});
}

/* Aperçu SVG : côté cuivre vu de dessous (comme sur la plaque à graver) ou vue de dessus. */
function pcbSvg(M, o, mirror){
  const P = PITCH, W = doc.board.w * P, H = doc.board.h * P;
  const X = x => mirror ? W - mmX(x) : mmX(x), Y = y => H - mmY(y);
  let s = `<svg viewBox="-1 -1 ${W + 2} ${H + 2}" style="width:100%;max-height:52vh;background:#0e3b2e;border-radius:8px;display:block">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#1f5c45" stroke="#9fd3b8" stroke-width=".15"/>`;
  M.straps.forEach(t => s += `<polyline points="${t.w.pts.map(([x,y]) => X(x) + ',' + Y(y)).join(' ')}" fill="none" stroke="#7fb2ff" stroke-width=".35" stroke-dasharray=".8 .5" opacity=".8"/>`);
  M.traces.forEach(t => { const [ax,ay,bx,by] = t.s; s += `<line x1="${X(ax)}" y1="${Y(ay)}" x2="${X(bx)}" y2="${Y(by)}" stroke="#d08a46" stroke-width="${o.trace}" stroke-linecap="round"/>`; });
  M.pads.forEach(p => s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${o.pad/2}" fill="#d08a46"/><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${o.drill/2}" fill="#0e3b2e"/>`);
  M.issues.forEach(i => s += `<circle cx="${X(i.x)}" cy="${Y(i.y)}" r="1.6" fill="none" stroke="#ff4d4d" stroke-width=".35"/>`);
  return s + '</svg>';
}

function sheetPcb(mirror = true){
  const o = pcbOpts(), M = pcbModel(o);
  const uniq = [...new Map(M.issues.map(i => [i.msg, i])).values()];
  const num = (id, label, v, step) => `<div><label class="lbl" for="${id}">${label}</label><input type="number" id="${id}" min="0.1" max="5" step="${step}" value="${v}" inputmode="decimal"></div>`;
  openDlg(`<h2>Circuit imprimé (simple face)</h2>
    <p>Fils normaux = pistes de cuivre, fils isolés = straps soudés côté composants. Export Gerber + perçage pour un logiciel de FAO (FlatCAM, pcb2gcode…), ou G-code GRBL directement.</p>
    ${pcbSvg(M, o, mirror)}
    <p style="margin-top:6px">${mirror ? 'Côté cuivre, vu de dessous (comme la plaque à graver).' : 'Vue de dessus (transparence).'} ${M.traces.length} segments de piste · ${M.pads.length} trous · ${M.straps.length} strap${M.straps.length > 1 ? 's' : ''}.</p>
    <div class="form"><div class="three">${num('pTr', 'Piste (mm)', o.trace, .1)}${num('pPad', 'Pastille (mm)', o.pad, .1)}${num('pDr', 'Perçage (mm)', o.drill, .1)}</div>
    <div class="three">${num('pCl', 'Isolement min. (mm)', o.clear, .05)}</div></div>
    ${uniq.length ? `<div class="net"><div class="warn">${uniq.length} problème${uniq.length > 1 ? 's' : ''} (cerclé${uniq.length > 1 ? 's' : ''} en rouge) :</div>${uniq.slice(0, 12).map(i => `<div>• ${esc(i.msg)}</div>`).join('')}${uniq.length > 12 ? `<div>… et ${uniq.length - 12} autre(s)</div>` : ''}</div>` : '<div class="net">✓ Aucun problème détecté.</div>'}
    <div class="btns"><button class="btn" data-a="flip">${mirror ? 'Vue de dessus' : 'Côté cuivre'}</button><button class="btn" data-a="apply">Appliquer</button><button class="btn" data-a="cnc">G-code CNC…</button><button class="btn primary" data-a="zip">Gerber (ZIP)</button></div>`, a => {
    const read = () => { const v = id => Math.max(.1, Math.min(5, parseFloat($(id).value) || 0)); return {trace:v('#pTr'), pad:v('#pPad'), drill:Math.min(v('#pDr'), v('#pPad') - .2), clear:v('#pCl')}; };
    if (a === 'flip'){ savePcbOpts(read()); sheetPcb(!mirror); }
    if (a === 'apply'){ savePcbOpts(read()); sheetPcb(mirror); }
    if (a === 'cnc'){ savePcbOpts(read()); sheetCnc(); }
    if (a === 'zip'){
      const opts = read(); savePcbOpts(opts);
      const m = pcbModel(opts), name = slug(circuit ? circuit.name : 'protoboard');
      const readme = [`${circuit ? circuit.name : 'Circuit'} : circuit imprimé simple face (ProtoBoardDesigner)`, '',
        `${name}-B_Cu.gbl     cuivre dessous (vue de dessus, comme tout Gerber : à retourner dans la FAO)`,
        `${name}-Edge_Cuts.gm1 contour de la carte (${(doc.board.w*PITCH).toFixed(2)} x ${(doc.board.h*PITCH).toFixed(2)} mm)`,
        `${name}.drl          perçages (Excellon, mm), ${m.pads.length} trous de ${opts.drill} mm`, '',
        `Pistes ${opts.trace} mm, pastilles ${opts.pad} mm, isolement visé ${opts.clear} mm.`,
        m.issues.length ? `ATTENTION : ${m.issues.length} problème(s) signalé(s) à la vérification.` : 'Vérification : aucun problème détecté.', '',
        'Straps (fils côté composants) :', strapList(m) || '(aucun)'].join('\n') + '\n';
      const blob = zipFiles([{name:`${name}-B_Cu.gbl`, text:gerberCopper(m, opts, name)}, {name:`${name}-Edge_Cuts.gm1`, text:gerberOutline(name)},
        {name:`${name}.drl`, text:excellon(m, opts)}, {name:`${name}-LISEZMOI.txt`, text:readme}]);
      downloadBlob(blob, `${name}-pcb.zip`);
      toast(m.issues.length ? `Exporté, avec ${m.issues.length} problème(s) signalé(s).` : 'Exporté.', m.issues.length > 0);
    }
  });
}

/* ---------- G-code direct (GRBL) : gravure à l'anglaise, perçage, découpe ----------
   Tout se fait côté cuivre (plaque retournée) : X en miroir, origine (0,0) au coin bas-gauche du
   contour vu de dessous, Z0 sur le cuivre. Trois fichiers, GRBL ne gérant pas le changement d'outil.
   Passes de gravure : le cuivre est dessiné en image (RES px/mm), on calcule pour chaque pixel la
   distance au cuivre le plus proche, puis les courbes de niveau de cette distance (carrés marchants)
   donnent directement les trajets de la fraise, à la distance voulue des pistes. */
const KEY_CNC = 'protoboard.cnc.v1';
const CNC_DEF = {vAngle:30, vTip:0.1, depth:0.1, passes:2, overlap:40, feed:150, plunge:50, rpm:10000, spindle:1, safeZ:2,
  thick:1.6, drillFeed:60, millDia:2, millStep:0.5, millFeed:120, tabs:1, tabW:3, tabH:0.6};
function cncOpts(){ try { return Object.assign({}, CNC_DEF, JSON.parse(localStorage.getItem(KEY_CNC)) || {}); } catch(e){ return Object.assign({}, CNC_DEF); } }
function saveCncOpts(o){ try { localStorage.setItem(KEY_CNC, JSON.stringify(o)); } catch(e){} }
const vWidth = c => c.vTip + 2 * c.depth * Math.tan(c.vAngle / 2 * Math.PI / 180);   // largeur gravée à la profondeur choisie

/* Distance euclidienne exacte (Felzenszwalb) : f = 0 sur le cuivre, Infinity ailleurs → distances² */
function edt1(f, n, d, v, z){
  let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  for (let q = 1; q < n; q++){
    let s;
    for (;;){ const p = v[k]; s = ((f[q] + q*q) - (f[p] + p*p)) / (2*q - 2*p); if (s <= z[k]) k--; else break; }
    k++; v[k] = q; z[k] = s; z[k+1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++){ while (z[k+1] < q) k++; const p = v[k]; d[q] = (q - p)*(q - p) + f[p]; }
}
function edt(mask, W, H){
  const INF = 1e20, g = new Float64Array(W * H), n = Math.max(W, H);
  const f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < W; x++){ for (let y = 0; y < H; y++) f[y] = mask[y*W + x] ? 0 : INF; edt1(f, H, d, v, z); for (let y = 0; y < H; y++) g[y*W + x] = d[y]; }
  for (let y = 0; y < H; y++){ for (let x = 0; x < W; x++) f[x] = g[y*W + x]; edt1(f, W, d, v, z); for (let x = 0; x < W; x++) g[y*W + x] = Math.sqrt(d[x]); }
  return g;
}
/* Courbes de niveau fermées de g = t (carrés marchants), en pixels. */
function contours(g, W, H, t){
  const hid = (x,y) => y*W + x, vid = (x,y) => W*H + y*W + x;   // arêtes horizontales / verticales
  const pt = new Map(), link = new Map();
  const add = (a, b) => { (link.get(a) || link.set(a, []).get(a)).push(b); (link.get(b) || link.set(b, []).get(b)).push(a); };
  const P = (id, x0, y0, x1, y1) => { if (!pt.has(id)){ const a = g[y0*W+x0], b = g[y1*W+x1], s = (t - a) / (b - a); pt.set(id, [x0 + s*(x1-x0), y0 + s*(y1-y0)]); } return id; };
  for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++){
    const a = g[y*W+x] <= t, b = g[y*W+x+1] <= t, c = g[(y+1)*W+x+1] <= t, d = g[(y+1)*W+x] <= t;
    const k = (a?8:0) | (b?4:0) | (c?2:0) | (d?1:0); if (k === 0 || k === 15) continue;
    const T = () => P(hid(x,y), x,y, x+1,y), R = () => P(vid(x+1,y), x+1,y, x+1,y+1), B = () => P(hid(x,y+1), x,y+1, x+1,y+1), L = () => P(vid(x,y), x,y, x,y+1);
    const mid = (g[y*W+x] + g[y*W+x+1] + g[(y+1)*W+x+1] + g[(y+1)*W+x]) / 4 <= t;
    switch (k){
      case 1: case 14: add(L(), B()); break;  case 2: case 13: add(B(), R()); break;
      case 3: case 12: add(L(), R()); break;  case 4: case 11: add(T(), R()); break;
      case 6: case 9:  add(T(), B()); break;  case 7: case 8:  add(L(), T()); break;
      case 5:  if (mid){ add(L(), T()); add(B(), R()); } else { add(L(), B()); add(T(), R()); } break;
      case 10: if (mid){ add(T(), R()); add(L(), B()); } else { add(L(), T()); add(B(), R()); } break;
    }
  }
  // Chaînage : les courbes ouvertes (qui touchent le bord de l'image) partent d'une extrémité et
  // ne sont jamais refermées ; les autres sont refermées sur leur point de départ.
  const seen = new Set(), out = [];
  const walk = start => {
    const poly = [pt.get(start)]; seen.add(start); let cur = start;
    for (;;){
      const nx = link.get(cur).find(n => !seen.has(n));
      if (nx === undefined) break;
      seen.add(nx); poly.push(pt.get(nx)); cur = nx;
    }
    const closed = link.get(start).length === 2 && link.get(cur).includes(start);
    if (poly.length > 2) out.push(closed ? [...poly, poly[0]] : poly);
  };
  link.forEach((n, k) => { if (n.length === 1 && !seen.has(k)) walk(k); });
  link.forEach((_, k) => { if (!seen.has(k)) walk(k); });
  return out;
}
/* Simplification (Ramer–Douglas–Peucker), tolérance en mêmes unités que les points. */
function simplify(pts, tol){
  if (pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const st = [[0, pts.length - 1]];
  while (st.length){
    const [a, b] = st.pop(); let m = -1, md = tol;
    for (let i = a + 1; i < b; i++){ const d = dPtSeg(pts[i][0], pts[i][1], pts[a][0], pts[a][1], pts[b][0], pts[b][1]); if (d > md){ md = d; m = i; } }
    if (m >= 0){ keep[m] = 1; st.push([a, m], [m, b]); }
  }
  return pts.filter((_, i) => keep[i]);
}
/* Ordre de parcours : le plus proche d'abord (moins de déplacements à vide). */
function nearestOrder(items, start, pos){
  const left = items.slice(), out = []; let cur = start;
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((it, i) => { const p = pos(it), d = (p[0]-cur[0])**2 + (p[1]-cur[1])**2; if (d < bd){ bd = d; bi = i; } });
    const it = left.splice(bi, 1)[0]; out.push(it); cur = pos(it);
  }
  return out;
}

/* Trajets en mm, coordonnées machine (vue de dessous). */
function cncPaths(o, c){
  const M = pcbModel(o), BW = doc.board.w * PITCH, BH = doc.board.h * PITCH;
  const w = vWidth(c), step = w * (1 - c.overlap / 100), RES = 20;
  const bx = x => BW - mmX(x), by = y => mmY(y);   // grille → mm, miroir
  // Zone de calcul : la plaque et tout le cuivre (même hors plaque), plus la largeur des passes
  const xs = [0, BW], ys = [0, BH];
  M.pads.forEach(p => { xs.push(bx(p.x)); ys.push(by(p.y)); });
  M.traces.forEach(t => { xs.push(bx(t.s[0]), bx(t.s[2])); ys.push(by(t.s[1]), by(t.s[3])); });
  const margin = Math.max(o.pad / 2, o.trace / 2) + w / 2 + (c.passes - 1) * step + 2;
  const X0 = Math.min(...xs) - margin, Y1 = Math.max(...ys) + margin;
  const W = Math.ceil((Math.max(...xs) + margin - X0) * RES) + 2, H = Math.ceil((Y1 - (Math.min(...ys) - margin)) * RES) + 2;
  // image du cuivre, en vue de dessous : pixel (px,py) ↔ X = X0 + px/RES, Y = Y1 - py/RES
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), mx = X => (X - X0) * RES, my = Y => (Y1 - Y) * RES;
  ctx.fillStyle = ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineWidth = o.trace * RES;
  M.traces.forEach(t => { const [ax,ay,bx2,by2] = t.s; ctx.beginPath(); ctx.moveTo(mx(bx(ax)), my(by(ay))); ctx.lineTo(mx(bx(bx2)), my(by(by2))); ctx.stroke(); });
  M.pads.forEach(p => { ctx.beginPath(); ctx.arc(mx(bx(p.x)), my(by(p.y)), o.pad / 2 * RES, 0, 2*Math.PI); ctx.fill(); });
  const img = ctx.getImageData(0, 0, W, H).data, mask = new Uint8Array(W * H);
  for (let i = 0; i < W*H; i++) mask[i] = img[i*4 + 3] > 127;
  const g = edt(mask, W, H), iso = [];
  for (let k = 0; k < c.passes; k++){
    // Marge de 1,2 pixel (0,06 mm) : la distance se mesure entre centres de pixels, le bord du cuivre
    // est lissé dans l'image et la simplification coupe les arcs. Vérifié : la fraise ne touche pas le cuivre.
    const d = (w / 2 + k * step) * RES + 1.2;
    contours(g, W, H, d).forEach(poly => iso.push(simplify(poly, 0.25).map(([px,py]) => [X0 + (px + .5) / RES, Y1 - (py + .5) / RES])));
  }
  const holes = M.pads.map(p => [bx(p.x), by(p.y)]);
  return {M, w, isoW: w + (c.passes - 1) * step, iso: nearestOrder(iso, [0,0], p => p[0]), holes: nearestOrder(holes, [0,0], p => p), BW, BH};
}

const f3 = v => (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3);
function gHead(c, title, tool, extra){
  return [`(ProtoBoardDesigner - ${title})`, `(Outil : ${tool})`, '(Plaque retournee, cote cuivre dessus. Origine X0 Y0 = coin bas-gauche du contour, Z0 = surface du cuivre.)',
    ...(extra || []), 'G21 G90 G17', 'G94', `G0 Z${f3(c.safeZ)}`, ...(c.spindle ? [`M3 S${Math.round(c.rpm)}`, 'G4 P3'] : ['(Broche : demarrer a la main)', 'M0'])];
}
const gTail = c => [`G0 Z${f3(c.safeZ)}`, ...(c.spindle ? ['M5'] : []), 'G0 X0 Y0', 'M30'];
function gcodeIsolation(P, c){
  const L = gHead(c, 'gravure des pistes', `fraise en V ${c.vAngle} deg, pointe ${c.vTip} mm`,
    [`(Profondeur ${c.depth} mm -> largeur gravee ${P.w.toFixed(3)} mm, ${c.passes} passe(s))`, '(Conseil : nivellement automatique de la plaque dans le logiciel d envoi.)']);
  P.iso.forEach(poly => {
    L.push(`G0 X${f3(poly[0][0])} Y${f3(poly[0][1])}`, `G1 Z${f3(-c.depth)} F${c.plunge}`, `F${c.feed}`);
    poly.slice(1).forEach(([x,y]) => L.push(`G1 X${f3(x)} Y${f3(y)}`));
    L.push(`G0 Z${f3(c.safeZ)}`);
  });
  return [...L, ...gTail(c)].join('\n') + '\n';
}
function gcodeDrill(P, o, c){
  const L = gHead(c, 'percage', `foret ${o.drill} mm`, [`(${P.holes.length} trous, profondeur ${f3(c.thick + 0.2)} mm)`]);
  P.holes.forEach(([x,y]) => L.push(`G0 X${f3(x)} Y${f3(y)}`, `G1 Z${f3(-(c.thick + 0.2))} F${c.drillFeed}`, `G0 Z${f3(c.safeZ)}`));
  return [...L, ...gTail(c)].join('\n') + '\n';
}
/* Contour : rectangle décalé du rayon de la fraise, passes successives, pattes au milieu des côtés. */
function gcodeOutline(P, c){
  const r = c.millDia / 2, x0 = -r, y0 = -r, x1 = P.BW + r, y1 = P.BH + r, total = c.thick + 0.1;
  const L = gHead(c, 'decoupe du contour', `fraise ${c.millDia} mm`, [`(${P.BW.toFixed(2)} x ${P.BH.toFixed(2)} mm, ${c.tabs ? '4 pattes de maintien de ' + c.tabW + ' mm' : 'sans pattes'})`]);
  const sides = [[[x0,y0],[x1,y0]], [[x1,y0],[x1,y1]], [[x1,y1],[x0,y1]], [[x0,y1],[x0,y0]]];
  const tabZ = -(total - c.tabH), half = (c.tabW + c.millDia) / 2;
  L.push(`G0 X${f3(x0)} Y${f3(y0)}`);
  for (let z = -Math.min(c.millStep, total); ; z = Math.max(z - c.millStep, -total)){
    L.push(`G1 Z${f3(z)} F${c.plunge}`, `F${c.millFeed}`);
    sides.forEach(([a, b]) => {
      const len = Math.hypot(b[0]-a[0], b[1]-a[1]), at = s => [a[0] + (b[0]-a[0]) * s / len, a[1] + (b[1]-a[1]) * s / len];
      if (c.tabs && z < tabZ && len > 2 * half + 4){
        const m = len / 2, p1 = at(m - half), p2 = at(m + half);
        L.push(`G1 X${f3(p1[0])} Y${f3(p1[1])}`, `G1 Z${f3(tabZ)}`, `G1 X${f3(p2[0])} Y${f3(p2[1])}`, `G1 Z${f3(z)}`);
      }
      L.push(`G1 X${f3(b[0])} Y${f3(b[1])}`);
    });
    if (z <= -total + 1e-9) break;
  }
  return [...L, ...gTail(c)].join('\n') + '\n';
}
/* Durée estimée (mm parcourus / vitesse ; déplacements rapides comptés à 1000 mm/min). */
function gcodeMinutes(txt){
  let x = 0, y = 0, z = 0, f = 100, t = 0;
  txt.split('\n').forEach(l => {
    const m = l.match(/^G([01])\b/); if (!m) { const fm = l.match(/^F([\d.]+)/); if (fm) f = +fm[1]; return; }
    const v = k => { const r = l.match(new RegExp(k + '(-?[\\d.]+)')); return r ? +r[1] : null; };
    const nx = v('X') ?? x, ny = v('Y') ?? y, nz = v('Z') ?? z; if (v('F') !== null) f = v('F');
    t += Math.hypot(nx - x, ny - y, nz - z) / (m[1] === '0' ? 1000 : f); x = nx; y = ny; z = nz;
  });
  return t;
}

function cncSvg(P, o){
  const {BW, BH} = P, Yv = y => BH - y;
  let s = `<svg viewBox="-3 -3 ${BW + 6} ${BH + 6}" style="width:100%;max-height:48vh;background:#0e3b2e;border-radius:8px;display:block">`;
  s += `<rect x="0" y="0" width="${BW}" height="${BH}" fill="#1f5c45" stroke="#9fd3b8" stroke-width=".15"/>`;
  P.M.traces.forEach(t => { const [ax,ay,bx,by] = t.s; s += `<line x1="${BW - mmX(ax)}" y1="${Yv(mmY(ay))}" x2="${BW - mmX(bx)}" y2="${Yv(mmY(by))}" stroke="#d08a46" stroke-width="${o.trace}" stroke-linecap="round" opacity=".55"/>`; });
  P.M.pads.forEach(p => s += `<circle cx="${BW - mmX(p.x)}" cy="${Yv(mmY(p.y))}" r="${o.pad/2}" fill="#d08a46" opacity=".55"/>`);
  P.iso.forEach(poly => s += `<polyline points="${poly.map(([x,y]) => x.toFixed(2) + ',' + Yv(y).toFixed(2)).join(' ')}" fill="none" stroke="#fff" stroke-width=".12"/>`);
  P.holes.forEach(([x,y]) => s += `<circle cx="${x}" cy="${Yv(y)}" r="${o.drill/2}" fill="none" stroke="#7fb2ff" stroke-width=".15"/>`);
  s += `<circle cx="0" cy="${BH}" r=".8" fill="#ff4d4d"/><text x="1.2" y="${BH - 1}" font-size="2.2" fill="#ff9d9d">X0 Y0</text>`;
  return s + '</svg>';
}
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function sheetCnc(){

    <p style="margin-top:6px">Trait de fraise : <b>${P.w.toFixed(2)} mm</b>${clear} · isolement gravé ≈ ${P.isoW.toFixed(2)} mm · ${P.iso.length} trajets · ${P.holes.length} trous.
      Durée ≈ gravure ${Math.ceil(mins.iso)} min, perçage ${Math.ceil(mins.drill)} min, découpe ${Math.ceil(mins.cut)} min.</p>

      <div class="three">${num('cP', 'Passes', c.passes, 1)}${num('cO', 'Recouvrement (%)', c.overlap, 5)}${num('cF', 'Avance (mm/min)', c.feed, 10)}</div>
      <div class="three">${num('cPl', 'Plongée (mm/min)', c.plunge, 10)}${num('cR', 'Broche (tr/min)', c.rpm, 500)}<div><label class="lbl" for="cS">Broche M3</label><select id="cS"><option value="1" ${c.spindle ? 'selected' : ''}>Pilotée</option><option value="0" ${c.spindle ? '' : 'selected'}>À la main</option></select></div></div>

        'Straps (fils cote composants) :', strapList(PP.M) || '(aucun)'].join('\n') + '\n';
      downloadBlob(zipFiles([{name:`${name}-1-gravure.nc`, text:gcodeIsolation(PP, cc)}, {name:`${name}-2-percage.nc`, text:gcodeDrill(PP, o, cc)},
        {name:`${name}-3-decoupe.nc`, text:gcodeOutline(PP, cc)}, {name:`${name}-LISEZMOI.txt`, text:readme}]), `${name}-gcode.zip`);
      toast(PP.M.issues.length ? `G-code exporté, avec ${PP.M.issues.length} problème(s) signalé(s).` : 'G-code exporté.', PP.M.issues.length > 0);
    }
  });
}


/* ---------- synchronisation (PocketBase, facultative) : écran et boucle dans pbsync.js ---------- */
function reloadLocalLib(){ [...LIB.entries()].forEach(([id, e]) => { if (e.src === 'local') LIB.delete(id); }); loadLocalLib(); }
/* Une valeur vient d'être remplacée par la version du serveur (le texte renvoyé s'affiche en message). */
function syncChanged(key, value){
  if (key === 'doc.v1'){
    if (!validDoc(value)) return null;
    undoStack.push(lastJSON); if (undoStack.length > 100) undoStack.shift(); redoStack = [];
    doc = value; if (!doc.board) doc.board = {w:24, h:30, show:true};
    lastJSON = JSON.stringify(doc); sel = null; cur = null; render(); updateCtx();
    return 'Plan mis à jour depuis un autre appareil — ↶ pour revenir.';
  }
  if (key === 'components.v1'){ reloadLocalLib(); render(); }
  else if (key.startsWith('circuit.')){ const h = $('#dlgIn h2'); if (dlg.open && h && h.textContent === 'Charger un circuit') sheetLoad(); }
  return null;
}

/* ---------- barres et clavier ---------- */
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bFit').onclick = fit; $('#bMenu').onclick = sheetMenu;
$('#bSide').onclick = () => setSide(!bottom); $('#pillSide').onclick = () => setSide(false);
$('#bAdd').onclick = sheetAdd; $('#mSel').onclick = () => setMode('sel'); $('#mWire').onclick = () => setMode('wire');
document.addEventListener('keydown', e => {
  if (dlg.open || (e.target.matches && e.target.matches('input,textarea,select'))) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveCmd(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape'){ if (cur){ cur = null; hover = null; } else sel = null; render(); updateCtx(); }
  else if (e.key === 'Enter' && cur) finishWire();
  else if (e.key === 'w') setMode(mode === 'wire' ? 'sel' : 'wire');
  else if (e.key === 'd') setSide(!bottom);
  else if (e.key === 'h'){ half = !half; applyMirror(); updateCtx(); }
  else if (sel && sel.t === 'part' && e.key === 'r') transformPart(sel.id, p => p.r = (p.r + 1) % 4);
  else if (sel && sel.t === 'part' && e.key === 'f') transformPart(sel.id, p => p.f = !p.f);
  else if (isMulti() && e.key === 'l') groupLock();
  else if (isMulti() && (e.key === 'Delete' || e.key === 'Backspace')) groupDelete();
  else if (sel && sel.t === 'part' && e.key === 'l'){ const p = getPart(sel.id); if (p){ if (p.lk) delete p.lk; else p.lk = true; commit(); } }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel){
    if (sel.t === 'part' && getPart(sel.id) && getPart(sel.id).lk){ toast('Pièce verrouillée.'); return; }
    if (sel.t === 'part') doc.parts = doc.parts.filter(p => p.id !== sel.id);
    else if (sel.t === 'wire') doc.wires = doc.wires.filter(w => w.id !== sel.id);
    else return;
    sel = null; commit();
  }
});
window.addEventListener('resize', applyView);

/* ---------- démarrage ---------- */
migrateCircuits();
loadLocalLib();
const savedView = load();
try {   // circuit ouvert avant le rechargement de la page
  const c = JSON.parse(localStorage.getItem(KEY_CUR)), rec = c && readCircuits().find(r => r.id === c.id);
  if (rec){ circuit = {id:rec.id, name:rec.name}; savedJSON = JSON.stringify(rec.doc); }
} catch(e){}
setMode('sel');
if (savedView && savedView.s){ view = savedView; bottom = !!view.b; applyView(); render(); } else fit();
const missing = [...new Set(doc.parts.filter(p => !BUILTIN[p.type] && !LIB.has(p.type)).map(p => p.type))];
if (missing.length) toast('Composant(s) introuvable(s) : ' + missing.join(', '), true);
/* Ouverture directe d'un circuit de la bibliothèque : page#open=<id> (lien depuis le Notebook).
   Même chemin que Charger : le plan précédent reste récupérable avec ↶. */
function openFromHash(){
  const m = location.hash.match(/^#open=([\w-]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  const rec = readCircuits().find(r => r.id === m[1]);
  if (!rec){ toast('Circuit introuvable dans la bibliothèque de ce navigateur.', true); return; }
  if (circuit && circuit.id === rec.id && !isDirty()){ fit(); return; }
  const added = applyDoc(JSON.parse(JSON.stringify(rec.doc)), rec.components);
  setCircuit({id:rec.id, name:rec.name}); fit();
  toast(added ? `Ouvert : ${rec.name} (${added} composant(s) ajouté(s)).` : `Ouvert : ${rec.name} — ↶ pour revenir au plan précédent.`);
}
openFromHash();
window.addEventListener('hashchange', openFromHash);
const sync = PBSync.init(store, {   // synchronise tout de suite, puis au retour en ligne / sur l'onglet
  adopt: ['doc.v1', 'components.v1', ...readCircuits().map(r => 'circuit.' + r.id)],   // circuits arrivés par un import du Notebook
  summary: 'Le plan en cours, les circuits enregistrés et « Mes composants » sont synchronisés sur le serveur, les données sont stockées sans chiffrement.',
  note: 'Au premier envoi, si le serveur a déjà un plan ou des composants, c\'est sa version qui est reprise (↶ pour revenir).',
  onChange: syncChanged,
  toast: toast,
});
</script>
