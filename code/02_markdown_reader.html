<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liseuse Markdown</title>
<meta name="description" content="Liseuse pour fichiers Markdown : favoris, arborescence, recherche, listes de tâches avec progression.">
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/svg+xml" href="icons/markdown_reader.svg">
<script src="common.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
/* Mise en page : bandeau fin en haut, volet de documents à gauche, colonne de lecture étroite au centre, plan de la section à droite sur grand écran. */
:root{
  --f-read:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs:18px; --side-w:312px;
  --syn-kw:#7A3E9D; --syn-str:#1F7A4D; --syn-com:#66737A; --syn-num:#B4530A; --syn-fn:#1F5FA8;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
/* Couleurs de la coloration syntaxique (le reste des couleurs vient de common.css) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--syn-kw:#C79BE8; --syn-str:#7FD1A0; --syn-com:#7E8D91; --syn-num:#F0A869; --syn-fn:#7DB4F0}
}
:root[data-theme="dark"]{--syn-kw:#C79BE8; --syn-str:#7FD1A0; --syn-com:#7E8D91; --syn-num:#F0A869; --syn-fn:#7DB4F0}

html,body{height:100%}
body{overflow:hidden}

.app{height:100%;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar" "side stage"}

/* Bandeau */
.bar{grid-area:bar;position:relative;display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.readbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.readbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.bar{--icon-size:36px}
.bar .btn.icon{font-size:13px}
.bar .ring{--ring-size:36px;--ring-w:4px;--ring-fs:10px}
.crumb{flex:1;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb strong{color:var(--fg);font-weight:500}
.crumb .sep{margin:0 .45em;opacity:.55}
.stats{font-size:12px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.grp{display:flex;gap:4px}
.btn{min-height:36px;padding:6px 13px;font-size:13px;font-weight:500;border-radius:var(--r-s)}
.btn.icon.menu{display:none}
.bar .appicon{width:28px;height:28px;border-radius:9px}
.bar .themebtn svg{width:18px;height:18px}
svg.i{flex:none;display:block}

/* Volet */
.side{grid-area:side;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-right:1px solid var(--line)}
.side-head{display:flex;flex-direction:column;gap:8px;padding:14px 16px 10px}
.openers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.urlrow{display:flex;gap:6px;min-width:0}
.side .field{min-height:36px;padding:6px 12px;font-size:13px;border-radius:var(--r-s)}
.srcline{display:flex;justify-content:space-between;gap:8px;padding:10px 16px 6px;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.srcline span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcline span+span{flex:none}
.srcline span:first-child{text-transform:none;letter-spacing:0;font-size:12px}
.tree{flex:1;min-height:0;overflow:auto;padding:2px 8px 20px}
.tree ul{list-style:none;margin:0;padding:0}
.row,.hit{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;border-radius:9px;text-align:left;cursor:pointer;font-size:13.5px;line-height:1.35;color:var(--fg)}
.row{padding:5px 8px 5px calc(8px + var(--d,0) * 14px)}
.row:hover,.hit:hover{background:var(--hover)}
.row svg.i{color:var(--mut)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on,.hit.on{background:var(--ac-soft)}
.row.on svg.i{color:var(--ac)}
.row.on .nm,.hit.on .t{font-weight:500}
.dir-row .chev{transition:transform .12s}
.dir-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.hit{flex-direction:column;align-items:stretch;gap:1px;padding:7px 8px}
.hit .t{font-size:13.5px}
.hit .p{font-size:11.5px;color:var(--mut)}
.hit .s{font-size:12px;color:var(--mut);line-height:1.4;overflow-wrap:anywhere}
.hit mark{background:var(--ac-soft);color:var(--fg);border-radius:2px;padding:0 1px}
.hit.on mark{background:var(--card)}
.empty,.hint{margin:10px 8px;font-size:12.5px;color:var(--mut)}

/* Scène de lecture */
.stage{grid-area:stage;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--card);scroll-behavior:auto}
.stage-inner{display:flex;justify-content:center;align-items:flex-start;gap:56px;padding:44px clamp(16px,4vw,48px) 96px}
.col{flex:1 1 auto;min-width:0;max-width:68ch;font-family:var(--f-read);font-size:var(--fs)}
.toc{flex:none;width:210px;position:sticky;top:28px;max-height:calc(100vh - 150px);overflow:auto;font-size:13px;line-height:1.4}
.toc h2{margin:0 0 8px;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.toc a{display:block;padding:3px 0 3px calc(var(--l,0) * 12px);color:var(--mut);text-decoration:none;overflow-wrap:anywhere}
.toc a:hover{color:var(--fg)}
.toc a.on{color:var(--ac);font-weight:500}

/* Typographie du document */
.doc{line-height:1.7;overflow-wrap:anywhere}
.doc>:first-child{margin-top:0}
.doc h1,.doc h2,.doc h3,.doc h4{font-family:var(--f-ui);font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance;scroll-margin-top:20px;margin:1.9em 0 .55em}
.doc h1{font-size:1.95em;letter-spacing:-.022em;margin-top:0}
.doc h2{font-size:1.38em;padding-bottom:.28em;border-bottom:1px solid var(--line)}
.doc h3{font-size:1.14em}
.doc h4,.doc h5,.doc h6{font-size:.82em;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.doc p,.doc ul,.doc ol,.doc blockquote,.doc details{margin:0 0 1.1em}
.doc ul,.doc ol{padding-left:1.5em}
.doc li{margin:.25em 0}
.doc li>ul,.doc li>ol{margin:.25em 0 .4em}
/* Tâches : même langage visuel que l’outil TODO (cases rondes, pastille %, barre, texte barré) */
.taskcard{margin:0 0 1.3em;padding:.3em .4em .45em;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);font-family:var(--f-ui);font-size:.88em;line-height:1.45}
.thead{display:flex;align-items:center;gap:12px;padding:.5em .6em .3em}
.doc .thead .pct{margin:0}
.thead .progress{flex:1;margin:0}
.doc .tasks{list-style:none;margin:0;padding:0}
.doc li.task{margin:0}
.doc li.task>ul.tasks,.doc li.task>ol.tasks{margin:0 0 .2em 1.1em;padding-left:.6em;border-left:2px solid var(--line)}
.trow{display:flex;align-items:flex-start;gap:.65em;padding:.4em .6em}
.trow .cb{--cb-box:2.1em;margin:-.196em -.336em -.336em}
.tbody{flex:1;min-width:0;overflow-wrap:anywhere}
.tbody p{margin:0 0 .4em}
.tbody p:last-child{margin-bottom:0}
.tbody.done{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1.5px}
.doc .pct{margin-left:.6em}
.doc a{color:var(--ac);text-decoration:underline;text-underline-offset:.18em;text-decoration-thickness:1px}
.doc a:hover{text-decoration-thickness:2px}
.doc a.dead{color:var(--mut);text-decoration:line-through dotted;cursor:help}
.doc strong{font-weight:650}
.doc code{font-family:var(--f-mono);font-size:.86em;background:var(--card2);padding:.12em .36em;border-radius:4px}
.doc kbd{font-family:var(--f-mono);font-size:.8em;padding:.08em .45em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--card)}
.doc blockquote{margin-inline:0;padding:.75em 1.15em;border-radius:14px;background:var(--card2);color:var(--mut)}
.doc blockquote>:first-child{margin-top:0}
.doc blockquote>:last-child{margin-bottom:0}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
.doc img{max-width:100%;height:auto;border-radius:4px}
.doc .missing-img{display:inline-block;padding:.1em .5em;border:1px dashed var(--line);border-radius:4px;font:12.5px var(--f-ui);color:var(--mut)}
.doc mark{background:var(--ac-soft);color:inherit;padding:0 .15em}
.doc details{border:1px solid var(--line);border-radius:14px;padding:.55em 1em}
.doc details>summary{cursor:pointer;font-family:var(--f-ui);font-size:.88em;font-weight:500}
.doc details[open]>summary{margin-bottom:.5em}
.doc .fm{font-size:.85em}
.doc .fm pre{margin:0;overflow-x:auto;font-family:var(--f-mono);font-size:.9em;line-height:1.5}
.doc .notice{font-family:var(--f-ui);font-size:.85em;color:var(--err)}
.tablewrap{overflow-x:auto;margin:0 0 1.3em;border:1px solid var(--line);border-radius:14px}
.doc table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:.82em;font-variant-numeric:tabular-nums}
.doc th,.doc td{padding:.55em .9em;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:normal}
.doc th{font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap}
.doc thead th{background:var(--card2)}
.doc tbody tr:last-child td{border-bottom:0}
.doc tbody tr:hover td{background:var(--hover)}
.codewrap{margin:0 0 1.3em;border:1px solid var(--line);border-radius:14px;background:var(--card2);overflow:hidden}
.codebar{display:flex;align-items:center;justify-content:space-between;padding:3px 6px 3px 14px;border-bottom:1px solid var(--line);font-family:var(--f-ui)}
.codebar .lang{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.codebar .copy{border:0;background:transparent;color:var(--mut);font-size:12px;padding:4px 8px;border-radius:4px;cursor:pointer}
.codebar .copy:hover{color:var(--fg);background:var(--hover)}
.codewrap pre{margin:0;padding:13px 16px;overflow-x:auto;line-height:1.55;background:none}
.codewrap pre code{background:none;padding:0;font-size:.82em;white-space:pre;overflow-wrap:normal}
.doc>pre{font-family:var(--f-mono);font-size:.82em;overflow-x:auto;background:var(--card2);padding:12px 16px;border-radius:6px}
.hljs-keyword,.hljs-selector-tag,.hljs-name,.hljs-tag{color:var(--syn-kw)}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--syn-str)}
.hljs-number,.hljs-literal,.hljs-symbol,.hljs-bullet,.hljs-variable,.hljs-template-variable{color:var(--syn-num)}
.hljs-comment,.hljs-quote{color:var(--syn-com);font-style:italic}
.hljs-title,.hljs-section,.hljs-built_in,.hljs-type,.hljs-attr,.hljs-attribute,.hljs-selector-class,.hljs-selector-id{color:var(--syn-fn)}
.hljs-deletion{color:var(--err)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:3.2em;padding-top:1.4em;border-top:1px solid var(--line);font-family:var(--f-ui)}
.pager:empty{display:none}
.pg{display:flex;flex-direction:column;gap:2px;min-width:0;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;cursor:pointer;font-size:14px;font-weight:500;transition:transform .12s,box-shadow .12s,border-color .12s}
.pg:hover{border-color:var(--ac);box-shadow:var(--shadow)}
.pg:active{transform:scale(.98)}
.pg small{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.next{align-items:flex-end;text-align:right;grid-column:2}

/* Superpositions */
.drop{position:fixed;inset:12px;z-index:70;display:flex;align-items:center;justify-content:center;border:2px dashed var(--ac);border-radius:12px;background:color-mix(in srgb,var(--ac-soft) 88%,transparent);color:var(--fg);font-size:18px;font-weight:500;pointer-events:none}
.scrim{display:none}

/* Favoris */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 16px;padding:3px;border-radius:12px;background:var(--card2)}
.tab{display:flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 8px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.tab .n{font-size:11px;font-variant-numeric:tabular-nums;color:var(--mut)}
.btn.icon[aria-pressed="true"]{color:var(--ac)}
.btn.icon.na{opacity:.5}
.mini{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border:0;border-radius:6px;background:none;color:var(--mut);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.mini:hover{color:var(--fg);background:var(--hover)}
.mini svg{width:12px;height:12px}
.tree .favs,.tree .favs ul{list-style:none;margin:0;padding:0}
.tree .favs ul{margin-left:15px;padding-left:4px;border-left:2px solid var(--line)}
.fav{border-radius:9px}
.fav-row{display:flex;align-items:center;gap:1px;min-height:32px;border-radius:9px}
.fav-row:hover{background:var(--hover)}
.fav-row.on{background:var(--ac-soft)}
.grip{flex:none;display:flex;align-items:center;justify-content:center;width:18px;height:30px;padding:0;border:0;border-radius:6px;background:none;color:var(--mut);opacity:.4;cursor:grab;touch-action:none}
.fav-row:hover .grip,.grip:focus-visible,body.is-dragging .grip{opacity:1}
.fav-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:7px;padding:6px 4px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;font-size:13.5px;line-height:1.35;color:var(--fg)}
.fav-main svg.i{margin-top:2px;color:var(--mut)}
.fav-main .nm{min-width:0;overflow-wrap:anywhere}
.fav-row.on svg.i{color:var(--ac)}
.fav-row.on .nm{font-weight:500}
.fav-main .chev{transition:transform .12s}
.fav-main[aria-expanded="true"] .chev{transform:rotate(90deg)}
.fav-act{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;color:var(--mut);cursor:pointer;opacity:0}
.fav-row:hover .fav-act,.fav-row:focus-within .fav-act{opacity:1}
.fav-act:hover{background:var(--hover);color:var(--fg)}
.fav-act.del:hover{color:var(--err)}
@media (hover:none){.fav-act{opacity:.75}}
.fav-empty{padding:4px 8px 6px 27px;font-size:12px;color:var(--mut)}
.fav.dragging{opacity:.4}
.fav.drop-before,.fav-end.drop-before{box-shadow:inset 0 2px 0 var(--ac)}
.fav.drop-after{box-shadow:inset 0 -2px 0 var(--ac)}
.fav.drop-into{background:var(--ac-soft)}
.fav-end{min-height:36px;border-radius:9px}
.rename-form{flex:1;min-width:0;padding:1px 4px}
.rename-form .field{min-height:30px;padding:3px 8px}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.favfoot{margin:8px 8px 0;font-size:12px}
.linkbtn{padding:2px 0;border:0;background:none;color:var(--mut);font:inherit;text-decoration:underline;text-underline-offset:.2em;cursor:pointer}
.linkbtn:hover{color:var(--fg)}
.toast .act{margin-left:14px;padding:0;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:.2em;cursor:pointer}

@media (max-width:1180px){ .toc{display:none} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "stage"}
  .btn.icon.menu{display:inline-grid}
  .side{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;width:min(88vw,340px);z-index:40;transform:translateX(-104%);visibility:hidden;box-shadow:0 0 32px rgba(0,0,0,.28)}
  .nav-open .side{transform:none;visibility:visible}
  .nav-open .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4)}
  .side .field{font-size:16px}
  .stage-inner{padding-top:28px}
}
@media (max-width:700px){ .stats{display:none} }
@media (prefers-reduced-motion:no-preference){
  .side{transition:transform .2s ease,visibility .2s}
}
@media (prefers-reduced-motion:reduce){
.pg{transition:none}
}
</style>

</head>
<body>
<div class="app" id="ls-app">
  <header class="bar">
    <button type="button" class="btn icon menu" id="ls-menu" aria-label="Afficher la liste des documents"></button>
    <a class="appicon" href="./" data-home aria-label="Accueil WebApps" title="Accueil WebApps"><img src="icons/markdown_reader.svg" alt="" width="28" height="28"></a>
    <div class="crumb" id="ls-crumb"></div>
    <span class="stats" id="ls-stats"></span>
    <div class="ring" id="ls-ring" hidden><span id="ls-ring-txt"></span></div>
    <button type="button" class="btn icon" id="ls-fav" aria-pressed="false"></button>
    <div class="grp">
      <button type="button" class="btn icon" id="ls-smaller" aria-label="Réduire le texte">A−</button>
      <button type="button" class="btn icon" id="ls-bigger" aria-label="Agrandir le texte">A+</button>
    </div>
    <button type="button" class="btn icon themebtn" data-theme-toggle></button>
    <div class="readbar" id="ls-read" aria-hidden="true"><i></i></div>
  </header>

  <aside class="side" id="ls-side" aria-label="Documents">
    <div class="side-head">
      <div class="openers">
        <button type="button" class="btn primary" id="ls-open-files"></button>
        <button type="button" class="btn primary" id="ls-open-folder"></button>
      </div>
      <form class="urlrow" id="ls-url-form" autocomplete="off">
        <label class="sr" for="ls-url">Adresse d’un fichier Markdown ou d’un dépôt GitHub</label>
        <input class="field" id="ls-url" type="text" inputmode="url" spellcheck="false" placeholder="Adresse .md ou GitHub">
        <button type="submit" class="btn">Charger</button>
      </form>
      <label class="sr" for="ls-q">Rechercher dans les documents</label>
      <input class="field" id="ls-q" type="search" spellcheck="false" placeholder="Rechercher   ( / )">
    </div>
    <div class="tabs" role="group" aria-label="Contenu du volet">
      <button type="button" class="tab" id="ls-tab-favs" aria-pressed="true"></button>
      <button type="button" class="tab" id="ls-tab-docs" aria-pressed="false"></button>
    </div>
    <div class="srcline"><span id="ls-src"></span><span id="ls-count"></span></div>
    <nav class="tree" id="ls-tree" aria-label="Arborescence des documents"></nav>
  </aside>

  <main class="stage" id="ls-stage">
    <div class="stage-inner">
      <div class="col">
        <article class="doc" id="ls-doc"></article>
        <nav class="pager" id="ls-pager" aria-label="Navigation entre documents"></nav>
      </div>
      <nav class="toc" id="ls-toc" aria-label="Plan du document" hidden></nav>
    </div>
  </main>

  <div class="scrim" id="ls-scrim"></div>
  <div class="drop" id="ls-drop" hidden>Dépose un fichier .md ou un dossier</div>
  <div class="toast" id="ls-toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="ls-file-in" accept=".md,.markdown,.mdown,.mkd,.mdx,text/markdown" multiple hidden>
  <input type="file" id="ls-folder-in" webkitdirectory multiple hidden>
</div>

<!-- Documents intégrés : Bienvenue et Syntaxe, proposés dans les favoris -->
<script type="text/markdown" data-path="Bienvenue.md">
# Liseuse Markdown

Une page unique qui affiche des fichiers Markdown comme on lit un livre : colonne étroite, typographie soignée, liste des documents à gauche, plan de la section à droite.

> Les favoris, dans le volet de gauche, gardent tes documents et tes dépôts GitHub sous la main.

## Ouvrir des documents

- **Fichiers** : un ou plusieurs fichiers `.md` de ton ordinateur.
- **Dossier** : tous les `.md` du dossier et de ses sous-dossiers apparaissent dans l’arborescence. Les images et les liens relatifs entre documents fonctionnent.
- **Adresse** : l’URL d’un fichier `.md`, ou celle d’un dépôt GitHub (`https://github.com/utilisateur/depot`) pour parcourir tous ses documents.
- **Glisser-déposer** : dépose un fichier ou un dossier n’importe où sur la page.
- **Coller** : `Ctrl`+`V` affiche le Markdown présent dans le presse-papiers.

Rien n’est envoyé nulle part : les fichiers sont lus dans le navigateur.

## Favoris

L’onglet **Favoris** du volet de gauche garde tes documents sous la main. Clique sur l’étoile du bandeau pour y ajouter le document, le dépôt GitHub ou l’adresse ouverts, et clique une seconde fois pour le retirer.

- Glisse la poignée à gauche d’un favori pour le déplacer, dans un groupe ou en dehors. Au clavier, utilise les flèches haut et bas sur la poignée.
- Le bouton **Groupe** crée un dossier repliable pour ranger des favoris. Le crayon le renomme.
- Une suppression se défait avec **Annuler**. La liste initiale se rétablit en bas de l’onglet.
- Les favoris sont gardés dans ce navigateur. La liseuse rouvre le dernier document au lancement.
- Les fichiers et dossiers de ton ordinateur ne peuvent pas devenir des favoris : le navigateur n’en conserve pas l’accès.

## Raccourcis

| Touche | Action |
| --- | --- |
| <kbd>/</kbd> | Aller à la recherche |
| <kbd>[</kbd> et <kbd>]</kbd> | Document précédent, document suivant |
| <kbd>Échap</kbd> | Effacer la recherche |

## Pour aller plus loin

Voir la [liste des éléments Markdown pris en charge](Syntaxe.md).

### Limites des adresses

Un serveur n’est lisible que s’il autorise les requêtes venant d’une autre origine (CORS). C’est le cas de `raw.githubusercontent.com` et de l’API GitHub, pas de tous les sites. Dans l’aperçu intégré à Claude, les requêtes réseau sont bloquées : pour charger des adresses, enregistre la page en `.html` et ouvre-la depuis ton ordinateur.

/* ---------- État ---------- */
let nextId=1;

const state={

/* ---------- Messages ---------- */
let toastTimer;

/* ---------- Arborescence ---------- */
function buildTree(files){
  const root={name:'',path:'',dirs:new Map(),files:[]};
  for(const f of files){
    const segs=f.path.split('/'); let node=root;
    for(let i=0;i<segs.length-1;i++){
      let c=node.dirs.get(segs[i]);
      if(!c){c={name:segs[i],path:(node.path?node.path+'/':'')+segs[i],dirs:new Map(),files:[]};node.dirs.set(segs[i],c)}
      node=c;
    }
    node.files.push(f);
  }

}
const sortedDirs=n=>[...n.dirs.values()].sort((a,b)=>natural.compare(a.name,b.name));
function flatten(n,out){
  out=out||[];

  n.files.sort((a,b)=>natural.compare(a.name,b.name));
  out.push(...n.files);

}
function allDirs(n,out){out=out||[];for(const d of n.dirs.values()){out.push(d.path);allDirs(d,out)}return out}
function treeHtml(n,depth){
  let h='';
  for(const d of sortedDirs(n)){
    const open=!state.collapsed.has(d.path);
    h+='<li><button type="button" class="row dir-row" data-dir="'+esc(d.path)+'" aria-expanded="'+open+'" style="--d:'+depth+'">'+ICON.chev+ICON.folder+'<span class="nm">'+esc(d.name)+'</span></button>'+(open?'<ul>'+treeHtml(d,depth+1)+'</ul>':'')+'</li>';
  }
  for(const f of n.files){
    const on=f===state.current;
    h+='<li><button type="button" class="row file-row'+(on?' on':'')+'" data-id="'+f.id+'" style="--d:'+depth+'"'+(on?' aria-current="true"':'')+'>'+ICON.file+'<span class="nm">'+esc(f.name.replace(MD_RE,''))+'</span></button></li>';
  }
  return h;
}
function snippet(text,i,len){
  const s=Math.max(0,i-40), e=Math.min(text.length,i+len+60);
  const clean=x=>esc(x.replace(/\s+/g,' '));
  return (s>0?'…':'')+clean(text.slice(s,i))+'<mark>'+clean(text.slice(i,i+len))+'</mark>'+clean(text.slice(i+len,e))+(e<text.length?'…':'');
}
function resultsHtml(q){
  const fq=fold(q), hits=[];
  for(const f of state.order){
    const pathHit=fold(f.path).includes(fq); let snip='';
    if(f.text!=null){const i=fold(f.text).indexOf(fq); if(i>=0) snip=snippet(f.text,i,q.length)}
    if(pathHit||snip) hits.push({f,snip});
    if(hits.length>=200) break;
  }
  if(!hits.length) return '<p class="empty">Aucun résultat pour « '+esc(q)+' ».</p>';
  return (state.kind==='github'?'<p class="hint">Les documents pas encore ouverts ne sont cherchés que par leur nom.</p>':'')+
    '<ul>'+hits.map(({f,snip})=>{
      const on=f===state.current;
      return '<li><button type="button" class="hit'+(on?' on':'')+'" data-id="'+f.id+'"'+(on?' aria-current="true"':'')+'><span class="t">'+esc(f.name.replace(MD_RE,''))+'</span><span class="p">'+esc(dirname(f.path)||'/')+'</span>'+(snip?'<span class="s">'+snip+'</span>':'')+'</button></li>';
    }).join('')+'</ul>';
}
function renderSide(){
  const n=state.files.length, q=el.q.value.trim();
  el.tabFavs.innerHTML=ICON.star+'Favoris';
  el.tabDocs.innerHTML=ICON.file+'Documents <span class="n">'+n+'</span>';

}
function expandTo(f){
  const segs=f.path.split('/'); segs.pop(); let p='';

/* ---------- Source de documents ---------- */
function setSource(o){

  state.byPath=new Map(o.files.map(f=>[f.path,f]));
  state.byLower=new Map(o.files.map(f=>[f.path.toLowerCase(),f]));
  state.byUrl=new Map(o.files.filter(f=>f.url).map(f=>[f.url,f]));
  state.byId=new Map(o.files.map(f=>[f.id,f]));
  state.assetsLower=new Map([...state.assets.keys()].map(k=>[k.toLowerCase(),k]));

async function loadText(f){
  if(f.text!=null) return f.text;
  if(f.file) return f.text=await f.file.text();
  if(f.url){
    const r=await fetch(f.url);
    if(!r.ok) throw httpErr(r);
    return f.text=await r.text();
  }
  return f.text='';
}

    try{await loadText(f)}catch(e){

/* ---------- Rendu d’un document ---------- */
function blobFor(key){
  const real=state.assets.has(key)?key:state.assetsLower.get(key.toLowerCase());
  if(!real) return null;
  if(!state.blobUrls.has(real)) state.blobUrls.set(real,URL.createObjectURL(state.assets.get(real)));
  return state.blobUrls.get(real);
}
function resolveRef(f,href){
  const h=href.indexOf('#');
  const pathPart=(h<0?href:href.slice(0,h)).split('?')[0];
  const anchor=h<0?'':decodeSafe(href.slice(h+1));
  if(f.url){
    let abs; try{abs=new URL(href,f.url).href}catch(e){return {anchor}}
    const bare=abs.split('#')[0];
    return {file:state.byUrl.get(bare),abs,anchor};
  }
  if(pathPart==='') return {anchor};
  const p=joinPath(dirname(f.path),decodeSafe(pathPart));
  return {file:state.byPath.get(p)||state.byLower.get(p.toLowerCase()),path:p,anchor};
}
function decorate(root,f){
  /* titres + plan */
  const used=new Map(), heads=[];
  root.querySelectorAll('h1,h2,h3,h4').forEach(h=>{
    let id=slug(h.textContent); const n=used.get(id)||0; used.set(id,n+1); if(n) id+='-'+n;
    h.id=id; heads.push({id,level:Number(h.tagName[1]),text:h.textContent,el:h});
  });
  /* liens */
  root.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href').trim();
    if(href.startsWith('#')){a.dataset.anchor=decodeSafe(href.slice(1));return}
    if(/^[a-z][a-z0-9+.-]*:/i.test(href)||href.startsWith('//')){
      if(/^https?:/i.test(href)){a.target='_blank';a.rel='noopener noreferrer'}
      return;
    }
    const r=resolveRef(f,href);
    if(r.file){a.dataset.open=r.file.id;a.dataset.anchor=r.anchor||''}
    else if(r.abs){a.href=r.abs;a.target='_blank';a.rel='noopener noreferrer'}
    else if(r.anchor!==undefined&&!r.path){a.dataset.anchor=r.anchor}
    else{a.removeAttribute('href');a.classList.add('dead');a.title='Introuvable dans les documents ouverts'}
  });
  /* images */
  root.querySelectorAll('img[src]').forEach(img=>{
    const src=img.getAttribute('src').trim();
    if(/^(data:|blob:|https?:|\/\/)/i.test(src)){img.loading='lazy';return}
    if(f.url){try{img.src=new URL(src,f.url).href}catch(e){}img.loading='lazy';return}
    const b=blobFor(joinPath(dirname(f.path),decodeSafe(src.split('?')[0])));
    if(b){img.src=b;img.loading='lazy'}
    else{const s=document.createElement('span');s.className='missing-img';s.textContent='Image introuvable : '+(img.alt||src);img.replaceWith(s)}
  });
  /* code */
  root.querySelectorAll('pre > code').forEach(code=>{
    const pre=code.parentElement, m=/language-([\w+#-]+)/.exec(code.className), lang=m?m[1]:'', src=code.textContent;
    if(lang&&window.hljs&&hljs.getLanguage(lang)){
      try{code.innerHTML=hljs.highlight(src,{language:lang,ignoreIllegals:true}).value;code.classList.add('hljs')}catch(e){}
    }
    const wrap=document.createElement('div'); wrap.className='codewrap';
    const bar=document.createElement('div'); bar.className='codebar';
    bar.innerHTML='<span class="lang">'+esc(lang||'texte')+'</span><button type="button" class="copy">Copier</button>';
    const btn=bar.querySelector('button');
    btn.addEventListener('click',async()=>{
      try{await navigator.clipboard.writeText(src);btn.textContent='Copié'}
      catch(e){const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Sélectionné'}
      setTimeout(()=>{btn.textContent='Copier'},1600);
    });
    pre.replaceWith(wrap); wrap.append(bar,pre);
  });
  /* tableaux, cases à cocher */
  root.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tablewrap';t.replaceWith(w);w.append(t)});
  buildTasks(root);
  return heads;
}

/* Listes de tâches : état des parents calculé à partir des sous-tâches, comme dans l’outil TODO */
const tcolor=p=>'hsl('+Math.round(p*1.2)+',72%,52%)';
let docTasks={done:0,total:0};
const taskKids=li=>[...li.children].filter(c=>c.tagName==='UL'||c.tagName==='OL').flatMap(l=>[...l.children].filter(x=>x.classList.contains('task')));
function taskStats(li){
  const kids=taskKids(li);
  if(!kids.length) return {done:li.dataset.checked==='1'?1:0,total:1};
  return kids.reduce((a,k)=>{const s=taskStats(k);return {done:a.done+s.done,total:a.total+s.total}},{done:0,total:0});
}
function pill(s){
  const p=Math.round(s.done/s.total*100);
  return {p,pill:'<span class="pct" style="--c:'+tcolor(p)+'">'+p+'%<small>'+s.done+'/'+s.total+'</small></span>',bar:'<div class="progress" style="--c:'+tcolor(p)+'"><i style="width:'+p+'%"></i></div>'};
}
function buildTasks(root){
  docTasks={done:0,total:0};
  const lis=new Set();
  root.querySelectorAll('li > input[type="checkbox"], li > p > input[type="checkbox"]').forEach(i=>lis.add(i.closest('li')));
  lis.forEach(li=>{
    const input=li.querySelector(':scope > input[type="checkbox"], :scope > p > input[type="checkbox"]');
    if(!input) return;
    li.dataset.checked=(input.checked||input.hasAttribute('checked'))?'1':'0';
    input.remove();
    li.classList.add('task'); li.parentElement.classList.add('tasks');
    const row=document.createElement('div'); row.className='trow';
    const cb=document.createElement('span'); cb.className='cb'; cb.setAttribute('role','img');
    const body=document.createElement('div'); body.className='tbody';
    [...li.childNodes].forEach(n=>{ if(!(n.nodeType===1&&(n.tagName==='UL'||n.tagName==='OL'))) body.append(n) });
    row.append(cb,body); li.prepend(row);
  });
  lis.forEach(li=>{
    const cb=li.querySelector(':scope > .trow > .cb'), body=li.querySelector(':scope > .trow > .tbody');
    if(!cb||!body) return;
    const has=taskKids(li).length>0, s=taskStats(li), all=s.done===s.total, part=has&&!all&&s.done>0;
    if(all) cb.classList.add('on'); else if(part) cb.classList.add('part');
    cb.setAttribute('aria-label',all?'Fait':part?'En cours':'À faire');
    body.classList.toggle('done',all);
    if(has){
      const pc=pill(s), first=body.firstElementChild, host=(first&&first.tagName==='P')?first:body;
      host.insertAdjacentHTML('beforeend',pc.pill);
      body.insertAdjacentHTML('beforeend',pc.bar);
    }
  });
  root.querySelectorAll('ul.tasks, ol.tasks').forEach(list=>{
    if(list.closest('li.task')) return;
    const s=[...list.children].filter(x=>x.classList.contains('task')).reduce((a,k)=>{const t=taskStats(k);return {done:a.done+t.done,total:a.total+t.total}},{done:0,total:0});
    docTasks.done+=s.done; docTasks.total+=s.total;
    const card=document.createElement('div'); card.className='taskcard';
    list.replaceWith(card);
    if(s.total>=2){
      const pc=pill(s), head=document.createElement('div'); head.className='thead';
      head.innerHTML=pc.pill+pc.bar; card.append(head);
    }
    card.append(list);
  });
}
function updateRing(){
  const t=docTasks;
  if(!t.total){el.ring.hidden=true;return}
  const p=Math.round(t.done/t.total*100);
  el.ring.hidden=false; el.ring.style.setProperty('--p',p); el.ring.style.setProperty('--c',tcolor(p));
  el.ringTxt.textContent=p+'%'; el.ring.title='Tâches : '+t.done+' sur '+t.total+' faites';
}
function updateProgress(){
  const s=el.stage, max=s.scrollHeight-s.clientHeight;
  el.read.firstElementChild.style.width=(max>0?Math.min(100,s.scrollTop/max*100):0)+'%';
}
function render(f,anchor){
  const text=f.text;
  let body=text, fm='';
  const m=/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(text);
  if(m){fm=m[1];body=text.slice(m[0].length)}
  let html;
  if(window.marked&&window.DOMPurify) html=DOMPurify.sanitize(marked.parse(body,{gfm:true}));
  else html='<p class="notice">Les bibliothèques de rendu n’ont pas pu être chargées (connexion nécessaire). Texte brut :</p><pre>'+esc(body)+'</pre>';
  const tpl=document.createElement('template'); tpl.innerHTML=html;
  const root=tpl.content;
  if(fm){
    const d=document.createElement('details'); d.className='fm';
    d.innerHTML='<summary>Métadonnées</summary><pre></pre>'; d.querySelector('pre').textContent=fm;
    root.prepend(d);
  }
  const heads=decorate(root,f);
  el.doc.replaceChildren(root);
  renderToc(heads);
  renderPager(f);
  updateRing();
  const words=(body.match(/\S+/g)||[]).length;
  el.stats.textContent=words.toLocaleString('fr-FR')+' mots · '+Math.max(1,Math.round(words/220))+' min';
  el.stage.scrollTop=0;
  if(anchor) scrollToAnchor(anchor);
  updateProgress();
}
function scrollToAnchor(a){

/* ---------- Ouverture : fichiers, dossier, glisser-déposer, collage ---------- */
async function ingest(list,label,explicit){
  const md=[], assets=new Map(), seen=new Set();
  for(const {file,path} of list){
    if(path.split('/').some(s=>IGNORE.has(s))) continue;
    if(explicit||MD_RE.test(path)){
      let p=path,n=1; while(seen.has(p)){p=n+'-'+path;n++} seen.add(p);
      md.push(mk({path:p,file}));
    }else if(IMG_RE.test(path)) assets.set(path,file);
  }
  if(!md.length){toast('Aucun fichier Markdown trouvé.','err');return}
  toast('Chargement…','',0);
  try{
    await Promise.all(md.map(async f=>{f.text=await f.file.text()}));
    hideToast();
    setSource({label,kind:'local',files:md,assets});
  }catch(e){toast('Lecture impossible : '+(e&&e.message||'erreur inconnue'),'err')}
}
function stripRoot(list){
  if(list.length&&list.every(x=>x.path.includes('/'))){
    const first=list[0].path.split('/')[0];
    if(list.every(x=>x.path.split('/')[0]===first)) return {label:first,list:list.map(x=>({file:x.file,path:x.path.slice(first.length+1)}))};
  }
  return {label:'Sélection',list};
}

el.fileIn.addEventListener('change',()=>{

  if(files.length) ingest(files.map(f=>({file:f,path:f.name})),'Sélection',true);
});
el.folderIn.addEventListener('change',()=>{
  const files=[...el.folderIn.files]; el.folderIn.value='';
  if(!files.length) return;
  const r=stripRoot(files.map(f=>({file:f,path:f.webkitRelativePath||f.name})));
  ingest(r.list,r.label,false);
});
async function walkEntry(entry,prefix,out){
  if(entry.isFile){
    const file=await new Promise((res,rej)=>entry.file(res,rej));
    out.push({file,path:prefix+entry.name});
  }else if(entry.isDirectory){
    if(IGNORE.has(entry.name)) return;
    const reader=entry.createReader(); let batch;
    do{
      batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
      for(const e of batch) await walkEntry(e,prefix+entry.name+'/',out);
    }while(batch.length);
  }
}
let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
document.addEventListener('dragenter',e=>{if(hasFiles(e)){dragDepth++;el.drop.hidden=false}});
document.addEventListener('dragleave',e=>{if(hasFiles(e)){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)el.drop.hidden=true}});
document.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
document.addEventListener('drop',async e=>{
  if(!hasFiles(e)) return;
  e.preventDefault(); dragDepth=0; el.drop.hidden=true;
  const dt=e.dataTransfer;
  const entries=[...(dt.items||[])].map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null).filter(Boolean);
  const plain=[...(dt.files||[])];
  try{
    if(entries.some(en=>en.isDirectory)){
      toast('Lecture du dossier…','',0);
      const out=[]; for(const en of entries) await walkEntry(en,'',out);
      const r=entries.length===1?stripRoot(out):{label:'Sélection',list:out};
      await ingest(r.list,r.label,false);
    }else if(plain.length) await ingest(plain.map(f=>({file:f,path:f.name})),'Sélection',true);
  }catch(err){toast('Lecture impossible : '+(err&&err.message||'erreur inconnue'),'err')}
});
document.addEventListener('paste',e=>{

});

/* ---------- Ouverture par adresse (fichier ou dépôt GitHub) ---------- */
function parseGithub(u){
  if(u.hostname!=='github.com') return null;
  const s=u.pathname.split('/').filter(Boolean).map(decodeSafe);
  if(s.length<2) return null;
  const owner=s[0], repo=s[1].replace(/\.git$/,'');
  if(s.length===2) return {kind:'tree',owner,repo,branch:null,sub:''};
  if(s[2]==='tree'&&s[3]) return {kind:'tree',owner,repo,branch:s[3],sub:s.slice(4).join('/')};
  if(s[2]==='blob'&&s[3]&&s.length>4){
    const path=s.slice(4);
    return {kind:'blob',raw:'https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+s[3].split('/').map(encodeURIComponent).join('/')+'/'+path.map(encodeURIComponent).join('/')};
  }
  return null;
}
async function loadGithubTree(gh,ctx){
  const base='https://api.github.com/repos/'+gh.owner+'/'+gh.repo;
  let branch=gh.branch;
  if(!branch){
    const r=await fetch(base); if(!r.ok) throw httpErr(r);
    branch=(await r.json()).default_branch;
  }
  const tr=await fetch(base+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1'); if(!tr.ok) throw httpErr(tr);
  const data=await tr.json();
  const prefix=gh.sub?gh.sub.replace(/\/$/,'')+'/':'';
  const rawBase='https://raw.githubusercontent.com/'+gh.owner+'/'+gh.repo+'/'+branch.split('/').map(encodeURIComponent).join('/')+'/';
  const files=(data.tree||[])
    .filter(t=>t.type==='blob'&&t.path.startsWith(prefix)&&MD_RE.test(t.path)&&!t.path.split('/').some(s=>IGNORE.has(s)))
    .map(t=>mk({path:t.path.slice(prefix.length),url:rawBase+t.path.split('/').map(encodeURIComponent).join('/')}));
  if(!files.length) throw new Error('empty');
  const where='https://github.com/'+gh.owner+'/'+gh.repo+'/tree/'+branch+(gh.sub?'/'+gh.sub:'');
  setSource({label:gh.owner+'/'+gh.repo+(gh.sub?'/'+gh.sub:''),kind:'github',files,key:ctx.key,srcUrl:ctx.srcUrl,
    resume:branch.includes('/')?ctx.srcUrl:where,start:ctx.start,tab:ctx.tab});
  if(data.truncated) toast('Dépôt très volumineux : la liste est incomplète.','err');
}
function urlKey(href){
  let u; try{u=new URL(href)}catch(e){return {key:'url:'+href,kind:'url'}}
  const gh=parseGithub(u);
  if(gh&&gh.kind==='tree') return {key:'gh:'+(gh.owner+'/'+gh.repo).toLowerCase()+(gh.sub?'/'+gh.sub:''),kind:'github'};
  return {key:'url:'+u.href,kind:'url'};
}
async function loadUrl(raw,opt){
  opt=opt||{};
  let u; try{u=new URL(raw.trim())}catch(e){toast('Adresse invalide. Elle doit commencer par https://','err');return false}
  if(!/^https?:$/.test(u.protocol)){toast('Seules les adresses http et https sont lues.','err');return false}
  toast('Chargement…','',0);
  let ctx='';
  try{
    const gh=parseGithub(u), k=urlKey(u.href), srcUrl=opt.srcUrl||u.href;
    if(gh) ctx='gh';
    if(gh&&gh.kind==='tree'){
      await loadGithubTree(gh,{key:k.key,srcUrl,start:opt.start,tab:opt.tab});
      if(!el.toast.classList.contains('err')) hideToast();
    }else{
      const url=gh&&gh.kind==='blob'?gh.raw:u.href;
      const r=await fetch(url); if(!r.ok) throw httpErr(r);
      const ct=r.headers.get('content-type')||'', text=await r.text();
      if(/text\/html/i.test(ct)&&!MD_RE.test(u.pathname)) throw new Error('html');
      const name=decodeSafe(u.pathname.split('/').filter(Boolean).pop()||u.hostname);
      hideToast();
      setSource({label:u.hostname,kind:'url',files:[mk({path:name,url,text})],key:k.key,srcUrl,resume:u.href,tab:opt.tab});
    }
    return true;
  }catch(e){toast(explain(e,ctx),'err');return false}
}

    :'<p class="empty">Aucun favori. Ouvre un dépôt GitHub ou une adresse, puis clique sur l’étoile du bandeau.</p>';
  h+='<div class="favfoot"><button type="button" class="linkbtn" data-freset>Rétablir la liste par défaut</button></div>';
  el.tree.innerHTML=h;
  el.tree.scrollTop=st;
  if(ui.renaming){const inp=el.tree.querySelector('.rename-form input'); if(inp){inp.focus();inp.select()}}
}
function updateStar(){
  const spec=currentSpec(), on=!!(spec&&findFavByKey(favKey(spec)));
  el.fav.innerHTML=on?ICON.stard:ICON.star;
  el.fav.setAttribute('aria-pressed',String(on));
  el.fav.classList.toggle('na',!spec);
  const l=!spec?'Ajouter aux favoris (indisponible pour les fichiers de l’ordinateur)':on?'Retirer des favoris':'Ajouter aux favoris';
  el.fav.setAttribute('aria-label',l); el.fav.title=l;
}
function refreshFavUi(){ if(state.tab==='favs') renderSide(); updateStar() }

/* Modifications avec annulation possible */
function mutate(msg,fn){
  const snap=JSON.stringify(favs);
  fn(); saveFavs(); refreshFavUi();
  toast(msg,'',7000,{label:'Annuler',fn:()=>{favs=JSON.parse(snap);saveFavs();refreshFavUi()}});
}
function removeFav(id){
  const r=locate(id); if(!r) return;
  mutate(r.item.type==='group'?'Groupe « '+r.item.name+' » supprimé':'Retiré des favoris',()=>{r.list.splice(r.index,1)});
}
function addFav(spec){
  favs.push(Object.assign({id:uid()},spec)); saveFavs(); refreshFavUi();
  toast('Ajouté aux favoris','',3000);
}
function resetFavs(){ mutate('Liste par défaut rétablie',()=>{favs=defaultFavs()}) }
function newGroup(){
  const g={id:uid(),type:'group',name:'Nouveau groupe',open:true,items:[]};
  favs.push(g); ui.renaming=g.id; saveFavs(); renderFavs();
}
function commitRename(id,val){
  if(ui.renaming!==id) return;
  ui.renaming=null;
  const r=locate(id), name=val.trim();
  if(r&&name&&name!==r.item.name){r.item.name=name.slice(0,60);saveFavs()}
  renderFavs(); focusFav('[data-ftoggle="'+id+'"]');
}
function openSample(ref){
  const f=sampleFiles.find(x=>x.path===ref)||sampleFiles[0];
  if(state.kind==='sample'){ openFile(f,''); return }
  setSource({label:'Liseuse',kind:'sample',key:'sample',files:sampleFiles,start:f.path,tab:state.tab});
}
function openFav(it){ if(it.type==='sample') openSample(it.ref); else loadUrl(it.url) }
function toggleStar(){
  const spec=currentSpec();
  if(!spec){ toast('Les fichiers et dossiers de ton ordinateur ne peuvent pas devenir des favoris : le navigateur n’en garde pas l’accès. Les dépôts GitHub et les adresses, oui.','err'); return }
  const hit=findFavByKey(favKey(spec));
  if(hit) removeFav(hit.id); else addFav(spec);
}
el.fav.onclick=toggleStar;
el.count.addEventListener('click',e=>{ if(e.target.closest('[data-fnew]')) newGroup() });
el.tabFavs.onclick=()=>{ el.q.value=''; state.tab='favs'; renderSide() };
el.tabDocs.onclick=()=>{ state.tab='docs'; renderSide() };

function favClick(e){
  const t=e.target; let b;
  if((b=t.closest('[data-fopen]'))){ const r=locate(b.dataset.fopen); if(r) openFav(r.item); return true }
  if((b=t.closest('[data-ftoggle]'))){
    const r=locate(b.dataset.ftoggle);
    if(r){ r.item.open=!r.item.open; saveFavs(); renderFavs(); focusFav('[data-ftoggle="'+r.item.id+'"]') }
    return true;
  }
  if((b=t.closest('[data-fdel]'))){ removeFav(b.dataset.fdel); return true }
  if((b=t.closest('[data-frename]'))){ ui.renaming=b.dataset.frename; renderFavs(); return true }
  if(t.closest('[data-freset]')){ resetFavs(); return true }
  return true;
}
el.tree.addEventListener('submit',e=>{
  const f=e.target.closest&&e.target.closest('[data-rename-form]'); if(!f) return;
  e.preventDefault(); commitRename(f.dataset.renameForm,f.querySelector('input').value);
});
el.tree.addEventListener('focusout',e=>{
  if(ui.renaming&&e.target.matches&&e.target.matches('.rename-form input')) commitRename(ui.renaming,e.target.value);
});
el.tree.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.matches&&t.matches('.rename-form input')&&e.key==='Escape'){
    e.preventDefault(); e.stopPropagation();
    const id=ui.renaming; ui.renaming=null; renderFavs(); focusFav('[data-ftoggle="'+id+'"]'); return;
  }
  const g=t.closest&&t.closest('[data-grip]');
  if(g&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    const id=g.closest('[data-fid]').dataset.fid, r=locate(id); if(!r) return;
    const j=r.index+(e.key==='ArrowUp'?-1:1);
    if(j<0||j>=r.list.length) return;
    [r.list[r.index],r.list[j]]=[r.list[j],r.list[r.index]];
    saveFavs(); renderFavs(); focusFav('[data-fid="'+id+'"] > .fav-row > .grip');
  }
});

/* Glisser-déposer (souris, doigt) par la poignée de chaque favori */
let drag=null;
const clearDrop=()=>el.tree.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach(n=>n.classList.remove('drop-before','drop-after','drop-into'));
function applyMove(id,targetId,pos){
  const src=locate(id); if(!src||targetId===id) return;
  const item=src.item;
  src.list.splice(src.index,1);
  if(pos==='end'){ favs.push(item); return }
  const t=locate(targetId);
  if(!t){ src.list.splice(src.index,0,item); return }
  if(item.type==='group'&&t.parent){
    const p=locate(t.parent.id);
    p.list.splice(p.index+(pos==='after'?1:0),0,item);
  }else if(pos==='into'&&t.item.type==='group'&&item.type!=='group'){
    t.item.items.unshift(item); t.item.open=true;
  }else t.list.splice(t.index+(pos==='after'?1:0),0,item);
}
function endDrag(apply){
  if(!drag) return;
  const d=drag; drag=null;
  clearDrop(); d.li.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  if(apply&&d.pos){ applyMove(d.id,d.target,d.pos); saveFavs(); renderFavs() }
}
el.tree.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');
  if(!g||state.tab!=='favs'||(e.pointerType==='mouse'&&e.button!==0)) return;
  const li=g.closest('li.fav'); if(!li) return;
  e.preventDefault();
  try{g.setPointerCapture(e.pointerId)}catch(err){}
  drag={id:li.dataset.fid,li,pid:e.pointerId,group:li.classList.contains('group'),target:'',pos:''};
  li.classList.add('dragging'); document.body.classList.add('is-dragging');
});
el.tree.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  const y=e.clientY, tr=el.tree.getBoundingClientRect();
  if(y<tr.top+30) el.tree.scrollTop-=12; else if(y>tr.bottom-30) el.tree.scrollTop+=12;
  clearDrop(); drag.target=''; drag.pos='';
  let hit=null;
  for(const row of el.tree.querySelectorAll('li.fav > .fav-row')){
    const li=row.parentElement;
    if(li===drag.li||drag.li.contains(li)) continue;
    const b=row.getBoundingClientRect();
    if(y>=b.top&&y<=b.bottom){ hit={li,rel:(y-b.top)/b.height}; break }
  }
  if(hit){
    let li=hit.li, pos=hit.rel<.5?'before':'after';
    const parentLi=li.parentElement.closest('li.fav');
    if(drag.group&&parentLi) li=parentLi;
    else if(li.classList.contains('group')&&!drag.group&&hit.rel>=.3) pos='into';
    drag.target=li.dataset.fid; drag.pos=pos;
    li.classList.add(pos==='into'?'drop-into':pos==='before'?'drop-before':'drop-after');
  }else{
    const end=el.tree.querySelector('.fav-end');
    if(end&&y>=end.getBoundingClientRect().top-8){ drag.target=''; drag.pos='end'; end.classList.add('drop-before') }
  }
});
el.tree.addEventListener('pointerup',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(true) });
el.tree.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(false) });

/* Dernier document ouvert */
function saveLast(){
  const f=state.current; if(!f) return;
  if(state.kind==='sample') store.setJSON('last',{t:'sample',file:f.path});
  else if((state.kind==='github'||state.kind==='url')&&state.resume)
    store.setJSON('last',{t:'link',url:state.resume,src:state.srcUrl,file:state.kind==='github'?f.path:''});
}

/* ---------- Clavier ---------- */
document.addEventListener('keydown',e=>{
  const t=e.target, typing=t.matches&&t.matches('input,textarea,select,[contenteditable]');
  if(e.key==='Escape'){
    if(t===el.q&&el.q.value){el.q.value='';renderSide();e.preventDefault();return}
    if(el.app.classList.contains('nav-open')) setNav(false);
    return;
  }
  if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='/'){e.preventDefault();setNav(true);el.q.focus()}
  else if(e.key==='['||e.key===']') step(e.key===']'?1:-1);
});

/* ---------- Démarrage : favoris, puis le dernier document ou Bienvenue ---------- */
applySize();
const last=store.getJSON('last',null);
const remote=!!(last&&last.t==='link'&&typeof last.url==='string'&&/^https?:\/\//i.test(last.url));
setSource({label:'Liseuse',kind:'sample',key:'sample',files:sampleFiles,
  start:(last&&last.t==='sample'&&last.file)||'Bienvenue.md',tab:'favs',noOpen:remote});
if(remote){
  el.doc.innerHTML='<p class="muted">Ouverture du dernier document…</p>';
  loadUrl(last.url,{start:last.file||'',tab:'favs',srcUrl:last.src}).then(ok=>{ if(!ok) openSample('Bienvenue.md') });
}
})();
</script>
